, "answer": "C", "explanation": "基金财产独立核算、单独建账是防止基金财产与管理人自有财产混同的基础，与纳税方式、收费比例和人数限制无关。", "difficulty": "中"}, {"uid": 1044, "id": 44, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "下列各项中，不属于基金管理人内部监督机制的是（　）。", "optionA": "监事会或执行监事", "optionB": "内部审计", "optionC": "合规风控负责人", "optionD": "证监会派出机构的现场检查", "answer": "D", "explanation": "证监会派出机构检查属于外部行政监管，不是管理人内部监督安排；监事会、合规风控负责人、内部审计均在内部制衡体系内。", "difficulty": "易"}, {"uid": 1045, "id": 45, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "按组织形式划分，私募股权投资基金可以分为（ ）。", "optionA": "公募基金、私募基金", "optionB": "公司型、合伙型、契约型", "optionC": "创业基金、并购基金", "optionD": "人民币基金、外币基金", "answer": "B", "explanation": "按组织形式，私募股权投资基金分为公司型、合伙型和契约型三种基本形式。", "difficulty": "易"}, {"uid": 1046, "id": 46, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "有限合伙型私募基金中，对基金债务承担无限连带责任的是（ ）。", "optionA": "普通合伙人", "optionB": "基金投资者", "optionC": "基金托管人", "optionD": "有限合伙人", "answer": "A", "explanation": "有限合伙型基金中，普通合伙人（GP）对基金债务承担无限连带责任，有限合伙人（LP）以认缴出资额为限承担责任。", "difficulty": "易"}, {"uid": 1047, "id": 47, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "公司型私募基金与合伙型私募基金在税收上的主要区别是（ ）。", "optionA": "公司型基金需缴纳企业所得税，合伙型基金实行先分后税", "optionB": "两者均不需要缴纳任何税款", "optionC": "两者均需缴纳企业所得税", "optionD": "合伙型基金需缴纳企业所得税，公司型基金不缴", "answer": "A", "explanation": "公司型基金作为法人需要缴纳企业所得税，存在双重征税；合伙型基金不是所得税纳税主体，实行先分后税。", "difficulty": "中"}, {"uid": 1048, "id": 48, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "契约型私募基金设立的法律基础是（ ）。", "optionA": "证券法", "optionB": "公司法", "optionC": "基金合同", "optionD": "合伙企业法", "answer": "C", "explanation": "契约型基金依据基金合同设立，投资者与管理人之间是信托关系，基金本身不具有法人资格。", "difficulty": "中"}, {"uid": 1049, "id": 49, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "主要投资于初创期、早期企业的基金通常称为（ ）。", "optionA": "不动产基金", "optionB": "创业投资基金", "optionC": "并购基金", "optionD": "夹层基金", "answer": "B", "explanation": "创业投资基金主要投资于初创期、成长期早期企业，风险较高，重点关注企业的成长性。", "difficulty": "易"}, {"uid": 1050, "id": 50, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "专注于对成熟企业进行收购并参与整合的基金是（ ）。", "optionA": "创业投资基金", "optionB": "Pre-IPO基金", "optionC": "并购基金", "optionD": "天使投资基金", "answer": "C", "explanation": "并购基金主要通过收购成熟企业股权取得控制权，参与企业整合和经营改善，再通过退出获利。", "difficulty": "中"}, {"uid": 1051, "id": 51, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "按资金性质划分，私募股权投资基金可分为（ ）。", "optionA": "创业基金和并购基金", "optionB": "公募基金和私募基金", "optionC": "公司型基金和契约型基金", "optionD": "人民币基金和外币基金", "answer": "D", "explanation": "按资金性质即币种划分，私募股权投资基金分为人民币基金和外币基金。", "difficulty": "易"}, {"uid": 1052, "id": 52, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "夹层基金的投资工具通常介于（ ）之间。", "optionA": "股票和基金", "optionB": "国债和期货", "optionC": "纯股权和纯债权", "optionD": "存款和理财", "answer": "C", "explanation": "夹层基金投资工具兼具股权和债权特征，如可转换债券、优先股等，风险和收益介于纯股权与纯债权之间。", "difficulty": "中"}, {"uid": 1053, "id": 53, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "关于合伙型私募基金，下列说法错误的是（ ）。", "optionA": "有限合伙人通常不参与基金日常管理", "optionB": "普通合伙人对基金债务承担无限连带责任", "optionC": "合伙型基金具有独立的法人资格", "optionD": "由普通合伙人和有限合伙人组成", "answer": "C", "explanation": "合伙企业不具有法人资格，合伙型私募基金不是法人实体，由普通合伙人执行合伙事务。", "difficulty": "难"}, {"uid": 1054, "id": 54, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "Pre-IPO基金的主要投资特点是（ ）。", "optionA": "投资于国债和货币市场工具", "optionB": "投资于企业上市前阶段，期望通过上市后退出获利", "optionC": "投资于企业破产清算阶段", "optionD": "投资于上市公司二级市场股票", "answer": "B", "explanation": "Pre-IPO基金投资于企业上市前相对成熟阶段，通过企业IPO后股权增值退出，投资周期相对较短。", "difficulty": "难"}, {"uid": 1055, "id": 55, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "公司型私募股权投资基金在基金层面需要缴纳（　）。", "optionA": "企业所得税", "optionB": "个人所得税", "optionC": "增值税", "optionD": "印花税", "answer": "A", "explanation": "公司型基金具有法人资格，基金层面缴纳企业所得税，投资者取得分红还可能再缴税，形成双重征税；合伙型和契约型不适用。", "difficulty": "易"}, {"uid": 1056, "id": 56, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "有限合伙型私募股权投资基金的投资者人数不得超过（　）人。", "optionA": "50", "optionB": "100", "optionC": "500", "optionD": "200", "answer": "A", "explanation": "合伙型基金投资者人数不超过50人，契约型和股份有限公司型不超过200人；不得通过拆分份额、代持等方式变相突破。", "difficulty": "易"}, {"uid": 1057, "id": 57, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "契约型私募股权投资基金的特点是（　）。", "optionA": "依法取得法人资格，投资者为股东", "optionB": "不具有法人资格，由管理人代为行使股东权利", "optionC": "由托管人代表基金对外投资", "optionD": "必须在工商部门办理设立登记", "answer": "B", "explanation": "契约型基金依据基金合同设立，不具法人资格，无法直接登记为股东，通常由管理人代持或代为行使权利；A、D属公司型特征。", "difficulty": "中"}, {"uid": 1058, "id": 58, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "符合条件的创业投资企业采取股权投资方式投资于未上市中小高新技术企业满2年的，可按投资额的（　）抵扣应纳税所得额。", "optionA": "150%", "optionB": "70%", "optionC": "50%", "optionD": "100%", "answer": "B", "explanation": "财税政策规定，符合条件的创投企业投资未上市中小高新技术企业或初创科技型企业满2年，按投资额70%抵扣应纳税所得额。", "difficulty": "难"}, {"uid": 1059, "id": 59, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "股权投资母基金的业务通常包括（　）。", "optionA": "一级投资、二级投资和直接投资", "optionB": "仅一级投资", "optionC": "仅二级投资", "optionD": "仅直接投资", "answer": "A", "explanation": "母基金既在一级市场认购新基金份额，也在二级市场受让存量份额，还可直接投资项目，三类业务可以组合开展。", "difficulty": "易"}, {"uid": 1060, "id": 60, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "与直接投资基金相比，股权投资母基金的成本特点是（　）。", "optionA": "不收取任何费用", "optionB": "存在双重管理费和双重业绩报酬", "optionC": "只收取一次管理费", "optionD": "管理费由投资者直接承担且不摊入基金", "answer": "B", "explanation": "母基金层面收费，所投子基金再收一次，形成双重管理费和双重业绩报酬，收益被摊薄，这是其分散风险付出的代价。", "difficulty": "中"}, {"uid": 1061, "id": 61, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "主要从事私募股权基金二手份额交易的基金是（　）。", "optionA": "S基金", "optionB": "夹层基金", "optionC": "并购基金", "optionD": "母基金", "answer": "A", "explanation": "S基金受让存续基金的LP份额或接续基金权益，为原投资者提供流动性，并可能以折价获取优质资产。", "difficulty": "易"}, {"uid": 1062, "id": 62, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "政府投资基金的运作原则是（　）。", "optionA": "政府引导、市场化运作、专业化管理", "optionB": "仅投资于基础设施项目", "optionC": "以营利最大化为唯一目标", "optionD": "政府直接指定项目并包揽管理", "answer": "A", "explanation": "政府投资基金由预算安排出资，但坚持政府引导、市场化运作、专业化管理，不与市场争利，并防范地方政府隐性债务。", "difficulty": "中"}, {"uid": 1063, "id": 63, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "主要投资于种子期、初创期企业，单笔金额较小、项目数量较多的基金类型是（　）。", "optionA": "并购基金", "optionB": "夹层基金", "optionC": "天使投资基金", "optionD": "Pre-IPO基金", "answer": "C", "explanation": "天使投资聚焦企业最早阶段，单笔金额小、项目数量多、失败率高；并购、Pre-IPO、夹层基金投向更后期且单笔规模更大。", "difficulty": "易"}, {"uid": 1064, "id": 64, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "并购基金运作的典型特征是（　）。", "optionA": "仅参股且不参与企业治理", "optionB": "以固定利息为主要收益来源", "optionC": "取得目标企业控制权，常使用杠杆", "optionD": "只投资于上市公司流通股", "answer": "C", "explanation": "并购基金通过收购取得控制权，借助杠杆放大交易规模，改善经营后出售或上市退出；仅参股、只买流通股均不符合其特征。", "difficulty": "中"}, {"uid": 1065, "id": 65, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "下列各项中，通常不属于股权投资基金产品基本要素的是（　）。", "optionA": "投资范围和退出方式", "optionB": "基金存续期限", "optionC": "基金管理人股东名单", "optionD": "管理费与业绩报酬", "answer": "C", "explanation": "产品要素包括名称、组织形式、募集规模、存续期、投资范围、费用、收益分配和退出方式；管理人股东名单不属于产品要素。", "difficulty": "中"}, {"uid": 1066, "id": 66, "subject": "科目三", "chapter": "第三章 股权投资基金产品", "stem": "按照现行备案分类，私募基金不包括（　）类型。", "optionA": "私募股权投资基金", "optionB": "私募证券投资基金", "optionC": "创业投资基金", "optionD": "私募信托贷款基金", "answer": "D", "explanation": "备案分类为私募证券、私募股权、创业投资和私募资产配置基金；以信托贷款方式开展的并不属于私募基金备案类别。", "difficulty": "难"}, {"uid": 1067, "id": 67, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金募集应当遵循的基本原则是（ ）。", "optionA": "公开、公平、公正", "optionB": "无风险、高收益、高流动性", "optionC": "保本、保收益、低风险", "optionD": "非公开、特定对象、合格投资者", "answer": "D", "explanation": "私募基金募集应坚持非公开方式，面向特定对象，并落实合格投资者制度。", "difficulty": "易"}, {"uid": 1068, "id": 68, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金募集机构不得采取的方式是（ ）。", "optionA": "在报刊、电视、互联网等公众媒体公开宣传", "optionB": "组织投资者进行回访确认", "optionC": "通过问卷调查确定特定对象", "optionD": "向合格投资者进行风险揭示", "answer": "A", "explanation": "私募基金不得通过报刊、电台、电视、互联网等公众传播媒体向不特定对象宣传推介。", "difficulty": "易"}, {"uid": 1069, "id": 69, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金募集流程的正确顺序是（ ）。", "optionA": "基金推介、特定对象确定、基金合同签署、风险揭示", "optionB": "合格投资者确认、基金推介、特定对象确定、回访确认", "optionC": "基金合同签署、基金推介、风险揭示、特定对象确定", "optionD": "特定对象确定、投资者适当性匹配、基金推介、风险揭示、合格投资者确认、基金合同签署、投资冷静期、回访确认", "answer": "D", "explanation": "募集流程依次为特定对象确定、适当性匹配、基金推介、风险揭示、合格投资者确认、合同签署、投资冷静期和回访确认。", "difficulty": "中"}, {"uid": 1070, "id": 70, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金投资冷静期自基金合同签署完毕且投资者交纳认购基金款项后起算，不得少于（ ）小时。", "optionA": "24", "optionB": "48", "optionC": "12", "optionD": "72", "answer": "A", "explanation": "《私募投资基金募集行为管理办法》规定，投资冷静期不得少于24小时，冷静期届满后募集机构应进行回访确认。", "difficulty": "中"}, {"uid": 1071, "id": 71, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金募集完毕后，管理人应当在（ ）个工作日内向中基协办理备案手续。", "optionA": "5", "optionB": "20", "optionC": "10", "optionD": "30", "answer": "B", "explanation": "私募基金募集完毕后，管理人应在20个工作日内通过私募基金登记备案系统办理基金备案手续。", "difficulty": "易"}, {"uid": 1072, "id": 72, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "基金合同应当约定的内容不包括（ ）。", "optionA": "基金的费用和收益分配方式", "optionB": "基金托管人的选任及职责", "optionC": "基金的投资范围和投资策略", "optionD": "保证投资者获得固定收益的承诺", "answer": "D", "explanation": "私募基金不得承诺保本保收益，基金合同中不得约定保证投资者获得固定收益的条款。", "difficulty": "中"}, {"uid": 1073, "id": 73, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于私募基金募集中的风险揭示，下列说法正确的是（ ）。", "optionA": "风险揭示工作应当由托管人负责", "optionB": "募集机构应向投资者充分揭示基金风险，并由投资者签字确认", "optionC": "风险揭示环节可以视情况省略", "optionD": "风险揭示只需进行口头说明即可", "answer": "B", "explanation": "募集机构应向投资者充分揭示投资风险，投资者应签字确认风险揭示书，确保其了解并愿意承担风险。", "difficulty": "中"}, {"uid": 1074, "id": 74, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金投资者应当以（ ）方式支付投资款项。", "optionA": "现金支付", "optionB": "由第三方代为支付", "optionC": "由管理人自有账户代收", "optionD": "银行转账等非现金方式", "answer": "D", "explanation": "投资者应以银行转账等非现金方式将款项划入基金募集专用账户，不得使用现金或由他人代付。", "difficulty": "易"}, {"uid": 1075, "id": 75, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于私募基金募集专用账户，下列说法错误的是（ ）。", "optionA": "募集专用账户可以与管理人自有账户混用", "optionB": "投资者交纳的认购资金应存入募集专用账户", "optionC": "募集机构应当开立募集专用账户", "optionD": "募集专用账户用于归集投资者的认购资金", "answer": "A", "explanation": "募集专用账户专款专用，不得与管理人自有账户混同，以保障募集资金的安全。", "difficulty": "难"}, {"uid": 1076, "id": 76, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于私募基金回访确认，下列说法正确的是（ ）。", "optionA": "回访应在投资冷静期届满后进行，确认投资者的真实认购意愿", "optionB": "回访可以由销售人员随意进行并口头记录", "optionC": "回访应当在投资冷静期内完成", "optionD": "投资者拒绝回访不影响基金的正常成立", "answer": "A", "explanation": "回访确认应在投资冷静期届满后进行，确认投资者是否出于真实意愿认购，回访内容应按规定记录保存。", "difficulty": "难"}, {"uid": 1077, "id": 77, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金合格投资者投资于单只私募基金的金额不得低于（　）万元。", "optionA": "1000", "optionB": "50", "optionC": "100", "optionD": "300", "answer": "C", "explanation": "合格投资者除满足资产或收入条件外，单只基金最低投资额为100万元；300万元是个人金融资产门槛，不要混淆。", "difficulty": "易"}, {"uid": 1078, "id": 78, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于私募基金投资者人数限制，下列说法错误的是（　）。", "optionA": "契约型基金不超过200人", "optionB": "可通过拆分份额方式变相增加投资者", "optionC": "不得以代持方式规避人数限制", "optionD": "合伙型基金不超过50人", "answer": "B", "explanation": "拆分份额、代持、凑单等方式变相突破人数上限均属违规，监管按实质合并计算投资者人数，故C项错误。", "difficulty": "中"}, {"uid": 1079, "id": 79, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于私募股权投资基金的募集与设立，下列顺序正确的是（　）。", "optionA": "募集与备案同时完成，设立可以事后补办", "optionB": "先向合格投资者募集，再完成设立，最后办理备案", "optionC": "先备案，再募集，最后设立", "optionD": "先办理工商设立，再向投资者募集，最后备案", "answer": "B", "explanation": "基金应先完成募集，再办理工商登记或签订基金合同完成设立，募集完毕后20个工作日内向中基协备案。", "difficulty": "易"}, {"uid": 1080, "id": 80, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募股权投资基金设立时的初始实缴规模原则上不低于（　）万元。", "optionA": "2000", "optionB": "500", "optionC": "1000", "optionD": "5000", "answer": "C", "explanation": "私募股权基金初始实缴规模不低于1000万元；创业投资基金备案阶段可放宽至首期实缴500万元，并在6个月内补足。", "difficulty": "易"}, {"uid": 1081, "id": 81, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "创业投资基金备案时按首期实缴500万元先行备案的，应当在（　）内补足至1000万元。", "optionA": "12个月", "optionB": "6个月", "optionC": "1个月", "optionD": "3个月", "answer": "B", "explanation": "创投基金可先以500万元首期实缴备案，但须在6个月内补足至1000万元，逾期未补足将影响后续产品备案。", "difficulty": "难"}, {"uid": 1082, "id": 82, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "私募基金募集完毕后办理备案时，通常需要提交的材料不包括（　）。", "optionA": "托管协议或托管说明", "optionB": "基金合同", "optionC": "投资者明细", "optionD": "管理人的验资报告", "answer": "D", "explanation": "备案材料主要包括基金合同、投资者明细、托管协议或托管说明、风险揭示书等；管理人验资报告不属于基金备案必备材料。", "difficulty": "中"}, {"uid": 1083, "id": 83, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "与专业投资者相比，普通投资者在募集环节享有的特别保护是（　）。", "optionA": "享有冷静期和回访确认等安排", "optionB": "可以公开宣传产品", "optionC": "无需签署风险揭示书", "optionD": "可以突破合格投资者标准", "answer": "A", "explanation": "普通投资者风险识别和承受能力较弱，享有特别风险揭示、冷静期、回访确认等保护；突破合格投资者标准或公开宣传均违规。", "difficulty": "中"}, {"uid": 1084, "id": 84, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "关于契约型私募股权投资基金的设立，下列说法正确的是（　）。", "optionA": "须经证监会批准设立", "optionB": "须由托管人作为登记股东", "optionC": "须到工商部门办理设立登记并领取营业执照", "optionD": "依据基金合同设立，无需办理工商登记", "answer": "D", "explanation": "契约型基金以基金合同设立，不具有法人资格，无需工商登记，也不需要行政审批；公司型、合伙型才需办理相应登记。", "difficulty": "易"}, {"uid": 1085, "id": 85, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "合伙型私募股权投资基金设立时，投资者之间签署的法律文件是（　）。", "optionA": "基金合同", "optionB": "公司章程", "optionC": "合伙协议", "optionD": "托管协议", "answer": "C", "explanation": "合伙型基金依据合伙企业法设立，投资者签署合伙协议；公司型用章程加股东协议，契约型用基金合同，三者不能混用。", "difficulty": "易"}, {"uid": 1086, "id": 86, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "认定私募基金募集完毕，通常应当同时满足的条件是（　）。", "optionA": "仅向协会提交备案申请", "optionB": "仅完成产品宣传推介", "optionC": "仅完成工商登记手续", "optionD": "投资者已签署基金合同且首期实缴资金到账", "answer": "D", "explanation": "募集完毕以投资者签署基金合同并完成首期实缴为标志，仅有宣传、登记或提交申请都不构成募集完毕，也不能据此备案。", "difficulty": "难"}, {"uid": 1087, "id": 87, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "募集机构在确定特定对象时，通常采用的方式是（　）。", "optionA": "在社交平台公开推荐产品", "optionB": "委托陌生人代为招揽客户", "optionC": "通过电视广告吸引投资者", "optionD": "通过问卷调查评估投资者的风险识别和承受能力", "answer": "D", "explanation": "募集机构应以问卷调查等方式完成投资者风险测评，确认特定对象后再推介；公开广告、社交平台推荐均属公开宣传。", "difficulty": "中"}, {"uid": 1088, "id": 88, "subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "stem": "基金合同应当载明的投资事项条款通常包括（　）。", "optionA": "投资者的家庭财产状况", "optionB": "投资范围、投资限制和投资决策程序", "optionC": "管理人员工的薪酬明细", "optionD": "托管银行的组织架构", "answer": "B", "explanation": "投资事项条款须明确投资范围、投资限制、决策程序和投后安排；员工薪酬、托管行架构、投资者家庭财产均非合同必备内容。", "difficulty": "中"}, {"uid": 1089, "id": 89, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "私募股权投资基金的投资流程一般始于（ ）。", "optionA": "项目退出", "optionB": "项目开发与筛选", "optionC": "投资交割", "optionD": "投资后管理", "answer": "B", "explanation": "投资流程一般包括项目开发与筛选、初步尽职调查、项目立项、尽职调查、投资决策、签署协议和投资交割等环节。", "difficulty": "易"}, {"uid": 1090, "id": 90, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "私募股权投资基金的尽职调查通常不包括（ ）。", "optionA": "投资者风险承受能力调查", "optionB": "法律尽职调查", "optionC": "业务尽职调查", "optionD": "财务尽职调查", "answer": "A", "explanation": "尽职调查主要围绕被投企业的业务、财务和法律等方面展开，投资者风险承受能力调查属于募集环节的适当性管理。", "difficulty": "易"}, {"uid": 1091, "id": 91, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "市盈率估值法的基本计算公式是（ ）。", "optionA": "企业价值等于现金流乘以折现率", "optionB": "企业价值等于净利润乘以市盈率", "optionC": "企业价值等于净资产乘以市净率", "optionD": "企业价值等于营业收入乘以市销率", "answer": "B", "explanation": "市盈率法以企业净利润乘以可比市盈率估算企业价值，适用于盈利相对稳定的企业估值。", "difficulty": "中"}, {"uid": 1092, "id": 92, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "现金流折现法估值的关键参数是（ ）。", "optionA": "历史股价和成交量", "optionB": "企业注册资本和股本结构", "optionC": "未来现金流预测和折现率", "optionD": "同行业公司的市值排名", "answer": "C", "explanation": "现金流折现法通过预测企业未来现金流，并按适当折现率折现来估算企业价值，关键是现金流预测和折现率。", "difficulty": "中"}, {"uid": 1093, "id": 93, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "投资协议中的估值调整条款通常被称为（ ）。", "optionA": "反稀释条款", "optionB": "拖售权条款", "optionC": "对赌条款", "optionD": "优先购买权条款", "answer": "C", "explanation": "估值调整条款又称对赌条款，用于根据被投企业未来业绩调整投资估值，保护投资方利益。", "difficulty": "易"}, {"uid": 1094, "id": 94, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "反稀释条款的主要作用是（ ）。", "optionA": "防止后续融资时原有投资者股权被过度稀释", "optionB": "限制基金管理人收取管理费", "optionC": "防止被投企业申请首次公开发行上市", "optionD": "保证投资者每年获得固定分红", "answer": "A", "explanation": "反稀释条款用于在后续融资价格低于前轮时保护原有投资者权益，防止其股权被过度稀释。", "difficulty": "中"}, {"uid": 1095, "id": 95, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "私募股权投资基金常用的投资策略不包括（ ）。", "optionA": "集中投资于单一项目且不加监控", "optionB": "组合投资", "optionC": "分散投资", "optionD": "联合投资", "answer": "A", "explanation": "私募股权投资基金通常采用组合投资、分散投资、联合投资、分段投资等策略控制风险，集中投资单一项目且不加监控不符合风险管理要求。", "difficulty": "易"}, {"uid": 1096, "id": 96, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "关于优先购买权条款，下列说法正确的是（ ）。", "optionA": "投资方可以优先于其他股东获得企业分红", "optionB": "被投企业其他股东转让股权时，投资方有权在同等条件下优先购买", "optionC": "投资方可以优先任命企业财务总监", "optionD": "投资方有权强制其他股东出售其全部股权", "answer": "B", "explanation": "优先购买权是指被投企业股东转让股权时，投资方在同等条件下享有优先购买的权利。", "difficulty": "中"}, {"uid": 1097, "id": 97, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "关于拖售权条款，下列说法正确的是（ ）。", "optionA": "投资方有权优先分配企业清算剩余财产", "optionB": "投资方出售股权时，有权要求其他股东按同等条件一同出售", "optionC": "投资方有权要求被投企业按约定价格回购其股权", "optionD": "投资方有权优先购买其他股东拟转让的股权", "answer": "B", "explanation": "拖售权又称强制随售权，指投资方出售股权时，有权要求其他股东按相同条件一并出售。", "difficulty": "难"}, {"uid": 1098, "id": 98, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "关于清算优先权条款，下列说法正确的是（ ）。", "optionA": "投资方在企业清算时优先承担企业全部债务", "optionB": "投资方在企业清算时无权参与剩余财产分配", "optionC": "投资方在企业清算时有权优先于普通股股东获得剩余财产分配", "optionD": "投资方在企业清算时只能按持股比例参与分配", "answer": "C", "explanation": "清算优先权指企业清算时，投资方有权优先于普通股股东按约定金额获得剩余财产分配。", "difficulty": "难"}, {"uid": 1099, "id": 99, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "股权投资基金的投资流程中，在签署交易文件之后紧接着的环节是（　）。", "optionA": "项目开发", "optionB": "投资决策", "optionC": "交割", "optionD": "尽职调查", "answer": "C", "explanation": "标准流程为项目开发筛选、初步评估立项、尽职调查、投资决策、签署交易文件、交割、投后管理，签约后即进入交割。", "difficulty": "易"}, {"uid": 1100, "id": 100, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "下列各项中，属于法律尽职调查内容的是（　）。", "optionA": "股权结构、资产权属与诉讼情况", "optionB": "行业市场规模测算", "optionC": "收入确认政策和应收账款质量", "optionD": "未来自由现金流预测", "answer": "A", "explanation": "股权结构、资产权属、诉讼、合规和知识产权属法律尽调；收入质量属财务尽调，现金流预测和市场测算属业务或估值分析。", "difficulty": "中"}, {"uid": 1101, "id": 101, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "已知目标企业股权价值为8亿元、净负债为2亿元，其企业价值为（　）亿元。", "optionA": "10", "optionB": "16", "optionC": "6", "optionD": "8", "answer": "A", "explanation": "企业价值等于股权价值加净负债，即8加2等于10亿元；净负债为负时应相应扣减，估值时须区分企业价值与股权价值。", "difficulty": "难"}, {"uid": 1102, "id": 102, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "参考最近融资价格法最适用于（　）的目标企业。", "optionA": "从未进行过任何股权融资", "optionB": "近期有外部机构融资且经营条件未发生重大变化", "optionC": "处于种子期且尚无营业收入", "optionD": "已进入破产清算程序", "answer": "B", "explanation": "该方法以最近一轮融资价格为基础，适用于近期有外部融资的企业；时间间隔过长或经营条件发生重大变化时须作调整。", "difficulty": "中"}, {"uid": 1103, "id": 103, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "使用EV/EBITDA乘数估值时，EV指的是（　）。", "optionA": "企业价值", "optionB": "股权价值", "optionC": "销售收入", "optionD": "息税前利润", "answer": "A", "explanation": "EV为企业价值，等于股权价值加净负债；EBITDA为息税折旧摊销前利润，二者口径须一致，避免用股权价值与EBITDA相除。", "difficulty": "易"}, {"uid": 1104, "id": 104, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "现金流折现法中，用于折现未来自由现金流的折现率通常采用（　）。", "optionA": "行业平均毛利率", "optionB": "无风险利率", "optionC": "银行贷款基准利率", "optionD": "加权平均资本成本", "answer": "D", "explanation": "折现率应反映资金的时间价值和项目风险，通常采用加权平均资本成本WACC；无风险利率未包含风险补偿，会高估估值。", "difficulty": "难"}, {"uid": 1105, "id": 105, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "成本法估值最适用于（　）的企业。", "optionA": "现金流稳定且可准确预测", "optionB": "即将在主板上市", "optionC": "轻资产、高成长的互联网平台", "optionD": "资产较重、收益不稳定或处于早期", "answer": "D", "explanation": "成本法以资产负债表净资产为基础调整，适合重资产、收益不稳定或早期企业；对轻资产高成长企业难以反映未来盈利能力。", "difficulty": "中"}, {"uid": 1106, "id": 106, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "风险资本估值法最适用于（　）。", "optionA": "近期有大量可比交易的公司", "optionB": "早期且缺乏可比公司和稳定现金流的企业", "optionC": "成熟稳定的制造业龙头", "optionD": "已上市公司的定向增发", "answer": "B", "explanation": "风险资本法先预测退出时估值，再按目标收益率折现回当前，适合缺乏可比公司和稳定现金流的早期企业。", "difficulty": "难"}, {"uid": 1107, "id": 107, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "对于业务成熟、现金流稳定的企业，估值时通常优先采用（　）。", "optionA": "面值法", "optionB": "风险资本估值法", "optionC": "市场乘数法和现金流折现法", "optionD": "成本法", "answer": "C", "explanation": "成熟稳定企业有可比公司和可预测现金流，适合市场乘数法和DCF；早期企业才更多使用风险资本法或最近融资价格法。", "difficulty": "易"}, {"uid": 1108, "id": 108, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "投资者以增资方式向目标企业投资时，签署的协议通常是（　）。", "optionA": "合伙协议", "optionB": "股权转让协议", "optionC": "增资协议", "optionD": "托管协议", "answer": "C", "explanation": "增资是认购目标企业新增注册资本，签署增资协议；受让老股东股权才签股权转让协议，二者在资金流向和登记程序上不同。", "difficulty": "易"}, {"uid": 1109, "id": 109, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "股东协议中的优先认购权，是指（　）。", "optionA": "投资者有权要求企业回购股权", "optionB": "投资者有权优先分配利润", "optionC": "目标企业增资时，老股东有权按持股比例优先认购新增出资", "optionD": "老股东对外转让股权时，其他股东有权优先受让", "answer": "C", "explanation": "优先认购权针对增资，按比例优先认购新增出资以维持持股比例；B项是优先购买权，C项是优先分红权，D项是回购权。", "difficulty": "中"}, {"uid": 1110, "id": 110, "subject": "科目三", "chapter": "第五章 股权投资基金的投资", "stem": "股东协议中的共同出售权，是指（　）。", "optionA": "投资者可要求其他股东一同按比例向第三方出售股权", "optionB": "投资者可优先购买企业新增注册资本", "optionC": "企业上市前必须向投资者分红", "optionD": "投资者可强制其他股东出售其全部股权", "answer": "A", "explanation": "共同出售权即随售权，投资者可搭创始股东出售股权的便车按比例退出；强制他人出售属于拖售权，二者方向相反。", "difficulty": "难"}, {"uid": 1111, "id": 111, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "私募股权投资基金投资后管理的主要内容不包括（ ）。", "optionA": "代替被投企业进行全部日常经营决策", "optionB": "协助被投企业进行战略规划", "optionC": "为被投企业提供增值服务", "optionD": "对被投企业进行日常监控", "answer": "A", "explanation": "投后管理包括日常监控、重大事项管理和增值服务，投资方不代替企业进行全部日常经营决策。", "difficulty": "易"}, {"uid": 1112, "id": 112, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资后管理中的增值服务通常不包括（ ）。", "optionA": "帮助企业引进核心人才", "optionB": "协助企业开拓市场渠道", "optionC": "为企业提供后续融资支持", "optionD": "直接接管企业财务核算工作", "answer": "D", "explanation": "增值服务包括战略、人才、市场、融资、管理提升等支持，直接接管企业财务核算不属于通常的增值服务。", "difficulty": "易"}, {"uid": 1113, "id": 113, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资方对被投企业进行财务监控的主要方式是（ ）。", "optionA": "代替企业编制年度预算方案", "optionB": "直接管理企业的全部银行账户", "optionC": "参与企业所有采购合同的审批", "optionD": "定期获取企业财务报表并分析关键指标", "answer": "D", "explanation": "财务监控主要通过定期获取财务报表、分析关键财务指标、关注异常变动等方式进行。", "difficulty": "中"}, {"uid": 1114, "id": 114, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资方派驻董事进入被投企业董事会的主要目的是（ ）。", "optionA": "代替管理层负责企业日常经营", "optionB": "为企业提供银行贷款担保", "optionC": "直接负责企业产品销售工作", "optionD": "参与企业重大决策并保护投资方权益", "answer": "D", "explanation": "投资方通过董事会席位参与企业重大决策，监督管理层，保护投资方的合法权益。", "difficulty": "中"}, {"uid": 1115, "id": 115, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资后管理中，投资方关注被投企业的重大事项一般不包括（ ）。", "optionA": "企业发生重大诉讼或仲裁", "optionB": "企业核心管理人员发生变动", "optionC": "企业股权结构发生重大变化", "optionD": "企业员工的日常考勤情况", "answer": "D", "explanation": "重大事项通常包括股权变动、重大诉讼、核心人员变动、重大投资等，日常考勤不属于重大事项。", "difficulty": "易"}, {"uid": 1116, "id": 116, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资协议中约定的信息获取权，通常允许投资方（ ）。", "optionA": "要求被投企业定期提供财务报表和经营信息", "optionB": "直接修改被投企业的会计账簿", "optionC": "代替被投企业对外披露信息", "optionD": "随意查阅被投企业员工的个人隐私", "answer": "A", "explanation": "信息获取权使投资方有权要求被投企业定期提供财务报表、经营情况等信息，以便实施投后监控。", "difficulty": "中"}, {"uid": 1117, "id": 117, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "关于投资后管理覆盖的时间区间，通常是指（ ）。", "optionA": "仅限投资交割的当月", "optionB": "仅限项目立项审批阶段", "optionC": "投资交割后至项目退出前的整个持有期间", "optionD": "仅限被投企业上市的当年", "answer": "C", "explanation": "投资后管理贯穿投资交割后至项目退出前的整个持有期间，包括日常监控和增值服务等。", "difficulty": "中"}, {"uid": 1118, "id": 118, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资方对被投企业进行战略层面的增值服务，通常包括（ ）。", "optionA": "协助制定企业发展战略和业务规划", "optionB": "代替企业签署所有销售合同", "optionC": "负责企业日常现金收付管理", "optionD": "承担企业全部员工薪酬支出", "answer": "A", "explanation": "战略层面的增值服务包括协助企业制定发展战略、业务规划、完善公司治理结构等。", "difficulty": "易"}, {"uid": 1119, "id": 119, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "关于投资后管理中风险预警机制的作用，下列说法正确的是（ ）。", "optionA": "代替投资方进行投资决策和项目管理", "optionB": "及时发现被投企业经营和财务异常，为采取应对措施提供依据", "optionC": "确保被投企业永远不会出现经营亏损", "optionD": "保证被投企业能够按期实现上市", "answer": "B", "explanation": "风险预警机制通过设定关键指标和监控阈值，及时发现异常情况，为投资方采取应对措施提供依据。", "difficulty": "难"}, {"uid": 1120, "id": 120, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "当被投企业出现严重经营困难时，投资方通常可以采取的措施不包括（ ）。", "optionA": "调整管理层或更换核心人员", "optionB": "追加投资以缓解企业资金压力", "optionC": "行使协议约定的回购权或清算权", "optionD": "直接将被投企业债务转嫁给基金投资者", "answer": "D", "explanation": "投资方可通过更换管理层、追加投资、行使回购权等方式应对，但不能将企业债务转嫁给基金投资者。", "difficulty": "难"}, {"uid": 1121, "id": 121, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "私募股权投资基金采用投资经理负责制开展投后管理，其主要特点是（ ）。", "optionA": "由基金投资者直接负责被投企业的日常经营", "optionB": "由负责该项目的投资经理持续跟踪项目，投前与投后管理衔接紧密", "optionC": "将投后管理工作全部委托给基金托管人承担", "optionD": "由独立的投后部门接管全部项目，投资经理不再参与", "answer": "B", "explanation": "投资经理负责制即投前投后一体化，由原投资经理持续跟踪，信息连续、责任清晰；独立投后团队属于专业化投后模式。", "difficulty": "中"}, {"uid": 1122, "id": 122, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投后管理中，追加投资、项目退出、重大诉讼等重大事项通常应提交（ ）审议决定。", "optionA": "被投企业职工代表大会", "optionB": "投资决策委员会", "optionC": "基金销售机构", "optionD": "基金托管人", "answer": "B", "explanation": "投后事项实行分级决策，重大事项须提交投资决策委员会审议；日常事项由投后团队或投资经理处理，托管人只负责保管与监督。", "difficulty": "易"}, {"uid": 1123, "id": 123, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "项目分类管理中，被列为预警类的被投企业，投后管理通常应当采取的措施是（ ）。", "optionA": "提高跟踪频率，制定风险处置预案并明确上报路径", "optionB": "立即终止基金合同并清算基金", "optionC": "暂停与被投企业的一切联系，等待其自行恢复", "optionD": "降低跟踪频率，减少管理资源投入", "answer": "A", "explanation": "项目按正常、关注、预警、危机分类差异化配置资源；预警类应加密跟踪、启动处置预案并及时上报，放任不管会放大风险。", "difficulty": "中"}, {"uid": 1124, "id": 124, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投后管理中，负责对项目风险进行独立监控和合规审查的部门通常是（ ）。", "optionA": "风控合规部门", "optionB": "基金销售部门", "optionC": "基金托管人", "optionD": "被投企业财务部门", "answer": "A", "explanation": "风控合规部承担独立的风险监控与合规审查职责；销售部门负责募集，被投企业财务部门是监控对象，托管人不参与管理人内部风控。", "difficulty": "易"}, {"uid": 1125, "id": 125, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "与并购基金相比，创业投资基金的投后管理通常更侧重于（ ）。", "optionA": "通过大幅削减成本和裁员迅速改善短期利润", "optionB": "取得控制权后对业务、人员、财务和文化进行深度整合", "optionC": "资源对接、后续融资支持、规范治理与上市辅导", "optionD": "主导被投企业的债务重组与资产处置", "answer": "C", "explanation": "创投基金多为小比例参股，投后重点是资源对接、后续融资和上市辅导；深度整合与运营改善是并购基金投后管理的特点。", "difficulty": "中"}, {"uid": 1126, "id": 126, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投资方获取被投企业信息的主要方式不包括（ ）。", "optionA": "取得并分析被投企业的定期财务报表", "optionB": "查阅董事会、股东会会议资料", "optionC": "现场走访并访谈管理层", "optionD": "监听被投企业管理层的私人通话内容", "answer": "D", "explanation": "投后信息主要通过定期财务报表、会议资料、现场走访、管理层访谈和第三方数据等合法渠道获取；监听私人通话侵犯隐私，不合规。", "difficulty": "易"}, {"uid": 1127, "id": 127, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "投后管理中投资方面临的主要风险点不包括（ ）。", "optionA": "被投企业按期完成年度分红", "optionB": "被投企业经营恶化导致项目估值下降", "optionC": "管理层道德风险引发资金挪用或关联交易", "optionD": "信息不对称导致投资方难以掌握真实经营状况", "answer": "A", "explanation": "信息不对称、管理层道德风险、经营恶化、资金挪用、关联交易和退出受阻是主要风险点；按期分红属于正常履约，不构成风险。", "difficulty": "易"}, {"uid": 1128, "id": 128, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "下列指标中，最适合作为投后管理人员绩效考核依据的是（ ）。", "optionA": "所管项目的经营指标改善、估值变化及风险事件处置情况", "optionB": "投后管理人员参加行业会议的次数", "optionC": "基金募集路演的场次数量", "optionD": "基金当期管理费收入规模", "answer": "A", "explanation": "投后考核应围绕项目价值提升与风险控制，采用经营指标、估值变化、风险处置等定量与定性结合指标；管理费和路演场次属于募集范畴。", "difficulty": "难"}, {"uid": 1129, "id": 129, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "关于并购项目投后管理的特点，下列说法正确的是（ ）。", "optionA": "投后重点是财务投资，无需关注业务协同", "optionB": "投资方一般不参与被投企业的经营管理", "optionC": "并购项目不存在整合风险", "optionD": "投资方取得控制权后需推进业务、人员、财务和文化的深度整合", "answer": "D", "explanation": "并购基金通常取得控制权，投后以深度整合和运营改善为核心，通过协同效应提升企业价值；整合风险客观存在，需要专门预案。", "difficulty": "中"}, {"uid": 1130, "id": 130, "subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "stem": "关于投后管理中的信息不对称风险，下列说法正确的是（ ）。", "optionA": "信息不对称只能通过提前退出加以解决", "optionB": "被投企业按时提供财务报表即可完全消除信息不对称", "optionC": "信息不对称只存在于投资交割之前，投后不再存在", "optionD": "投资方作为小股东掌握的信息通常少于管理层，需借助信息权条款、董事席位和现场核查加以缓解", "answer": "D", "explanation": "投后阶段投资方与管理层的信息差距依然存在，需通过信息权条款、董事或观察员席位、现场核查等安排降低不对称程度，但难以完全消除。", "difficulty": "难"}, {"uid": 1131, "id": 131, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "私募股权投资基金项目退出的方式不包括（ ）。", "optionA": "将基金份额在银行柜台出售", "optionB": "股权回购", "optionC": "并购退出", "optionD": "首次公开发行上市", "answer": "A", "explanation": "常见退出方式包括首次公开发行上市、并购、股权回购、清算等，基金份额不能在银行柜台出售。", "difficulty": "易"}, {"uid": 1132, "id": 132, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "通常被认为收益水平最高的退出方式是（ ）。", "optionA": "首次公开发行上市", "optionB": "解散清算", "optionC": "以资产抵偿债务", "optionD": "破产清算", "answer": "A", "explanation": "首次公开发行上市退出通常能获得较高的估值和收益，但周期长、不确定性大，对企业和市场环境要求较高。", "difficulty": "易"}, {"uid": 1133, "id": 133, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "并购退出的主要特点是（ ）。", "optionA": "退出周期相对较短，交易灵活性较高", "optionB": "只能由被投企业管理层进行收购", "optionC": "必须等待被投企业上市后才能实施", "optionD": "退出收益一定高于首次公开发行上市", "answer": "A", "explanation": "并购退出通过将股权出售给其他企业或投资者实现退出，周期相对较短、灵活性较高，但估值可能低于首次公开发行上市。", "difficulty": "中"}, {"uid": 1134, "id": 134, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "股权回购退出的常见触发情形不包括（ ）。", "optionA": "被投企业业绩未达到约定目标", "optionB": "被投企业实际控制人违反协议约定", "optionC": "被投企业按时完成年度利润分配", "optionD": "被投企业未能在约定期限内实现上市", "answer": "C", "explanation": "回购条款通常在企业未按期上市、业绩不达标、实际控制人违约等情形下触发，正常利润分配不是触发情形。", "difficulty": "中"}, {"uid": 1135, "id": 135, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "清算退出通常发生在（ ）。", "optionA": "被投企业完成新一轮股权融资时", "optionB": "被投企业扩大生产规模时", "optionC": "被投企业经营失败或基金存续期届满时", "optionD": "被投企业成功实现首次公开发行时", "answer": "C", "explanation": "清算退出通常在被投企业经营失败、无法持续经营或基金存续期届满时进行，是投资的最后选择。", "difficulty": "易"}, {"uid": 1136, "id": 136, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "关于首次公开发行上市退出，下列说法正确的是（ ）。", "optionA": "首次公开发行退出没有任何锁定期限制", "optionB": "首次公开发行退出不需要中介机构参与", "optionC": "企业上市后投资方可以立即全部减持", "optionD": "企业需符合相应板块的发行上市条件", "answer": "D", "explanation": "首次公开发行退出要求企业符合主板、科创板、创业板、北京证券交易所等板块的发行上市条件，且投资方减持受锁定期限制。", "difficulty": "中"}, {"uid": 1137, "id": 137, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "投资方选择退出时机时，通常需要考虑的因素不包括（ ）。", "optionA": "投资方员工的日常考勤记录", "optionB": "基金存续期和退出安排", "optionC": "被投企业的经营状况和成长阶段", "optionD": "资本市场行情和估值水平", "answer": "A", "explanation": "退出时机选择需综合考虑企业经营状况、资本市场环境、基金存续期和协议约定等因素。", "difficulty": "中"}, {"uid": 1138, "id": 138, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "我国多层次资本市场中，主要服务创新型中小企业的新设证券交易所是（ ）。", "optionA": "北京证券交易所", "optionB": "全国银行间同业拆借中心", "optionC": "上海黄金交易所", "optionD": "中国金融期货交易所", "answer": "A", "explanation": "北京证券交易所主要服务创新型中小企业，为私募股权投资基金提供了新的退出渠道。", "difficulty": "易"}, {"uid": 1139, "id": 139, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "关于清算退出，下列说法错误的是（ ）。", "optionA": "清算退出是收益最高的项目退出方式", "optionB": "清算退出时投资方可能无法收回全部投资本金", "optionC": "清算分为解散清算和破产清算两种类型", "optionD": "清算退出通常意味着投资项目失败或基金到期", "answer": "A", "explanation": "清算退出通常是被投企业经营失败或基金到期时的被动选择，收益往往较低甚至亏损，不是收益最高的退出方式。", "difficulty": "难"}, {"uid": 1140, "id": 140, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "关于股份锁定期对私募股权投资基金退出的影响，下列说法正确的是（ ）。", "optionA": "锁定期不影响投资方的退出安排", "optionB": "锁定期内投资方可以随意减持套现", "optionC": "锁定期规定只适用于公募证券投资基金", "optionD": "锁定期内投资方不能转让所持股份，客观上延长了退出周期", "answer": "D", "explanation": "首次公开发行后投资方所持股份通常存在锁定期，锁定期内不得转让，客观上延长了基金的退出周期。", "difficulty": "难"}, {"uid": 1141, "id": 141, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "企业清算时，下列各项中应当最先从清算财产中支付的是（ ）。", "optionA": "所欠税款", "optionB": "普通债权人的债务", "optionC": "职工工资和社会保险费用", "optionD": "清算费用", "answer": "D", "explanation": "清算财产按清算费用、职工工资社保及法定补偿金、所欠税款、普通债务、股东分配的顺位清偿；清算费用是清算程序本身的支出。", "difficulty": "易"}, {"uid": 1142, "id": 142, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "企业清算的清偿顺序中，紧接在职工工资、社会保险费用和法定补偿金之后清偿的是（ ）。", "optionA": "普通债务", "optionB": "清算费用", "optionC": "所欠税款", "optionD": "股东剩余财产分配", "answer": "C", "explanation": "清算顺序为清算费用、职工工资社保及法定补偿金、所欠税款、普通债务、股东分配；所欠税款排在职工债权之后、普通债务之前。", "difficulty": "中"}, {"uid": 1143, "id": 143, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "企业解散清算时，清算程序的首要环节是（ ）。", "optionA": "清缴所欠税款", "optionB": "成立清算组", "optionC": "办理注销登记", "optionD": "分配剩余财产", "answer": "B", "explanation": "清算流程为成立清算组、通知和公告债权人、清理财产编制资产负债表、处理未了业务、清税偿债、分配剩余财产、注销登记。", "difficulty": "易"}, {"uid": 1144, "id": 144, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "企业申请股票在全国中小企业股份转让系统挂牌，基本要求之一是依法设立且存续满（ ）。", "optionA": "两个完整会计年度", "optionB": "五个完整会计年度", "optionC": "一个完整会计年度", "optionD": "三个完整会计年度", "answer": "A", "explanation": "新三板挂牌要求依法设立且存续满两个完整会计年度，同时业务明确、治理健全、股权清晰，并由主办券商推荐、全国股转公司审查。", "difficulty": "中"}, {"uid": 1145, "id": 145, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "企业申请股票在全国中小企业股份转让系统挂牌，通常需要由（ ）推荐并持续督导。", "optionA": "会计师事务所", "optionB": "律师事务所", "optionC": "主办券商", "optionD": "基金托管人", "answer": "C", "explanation": "新三板挂牌实行主办券商推荐和持续督导制度；会计师事务所、律师事务所提供审计和法律服务，托管人负责基金财产保管。", "difficulty": "易"}, {"uid": 1146, "id": 146, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "投资方约定由被投企业自身作为股权回购主体时，最应当关注的法律限制是（ ）。", "optionA": "企业回购本公司股权无需履行任何内部决策程序", "optionB": "企业回购价格不得低于投资方的投资本金", "optionC": "企业回购必须经基金托管人书面同意", "optionD": "企业回购本公司股权通常需履行减资程序，受债权人保护规则约束", "answer": "D", "explanation": "由公司回购股权实质上是减资，须经股东会决议、通知债权人并履行减资程序；程序受限或公司缺乏支付能力时，回购条款可能无法执行。", "difficulty": "中"}, {"uid": 1147, "id": 147, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "境内居民通过境外特殊目的公司开展境外融资并返程投资，应按规定办理的外汇登记通常被称为（ ）。", "optionA": "资管新规登记", "optionB": "税务登记", "optionC": "私募基金备案登记", "optionD": "37号文登记", "answer": "D", "explanation": "境内居民以境内外合法资产或权益向特殊目的公司出资前，应按汇发2014年37号文办理境外投资外汇登记，这是红筹架构境外上市的基础合规环节。", "difficulty": "中"}, {"uid": 1148, "id": 148, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "被投企业首次公开发行上市后，投资方所持股份的转让通常受锁定期限制，下列说法正确的是（ ）。", "optionA": "全部股东一律锁定6个月", "optionB": "上市后股份可以立即全部转让，不存在锁定期", "optionC": "全部股东一律锁定60个月", "optionD": "控股股东、实际控制人所持股份通常锁定36个月，其他股东通常锁定12个月", "answer": "D", "explanation": "为维护上市后股价稳定，控股股东、实际控制人所持股份通常锁定36个月，其他股东通常锁定12个月，具体以所属板块规则为准。", "difficulty": "难"}, {"uid": 1149, "id": 149, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "私募股权二级市场基金即S基金，在退出环节的主要作用是（ ）。", "optionA": "承担基金管理人的投资决策职能", "optionB": "为被投企业提供银行贷款担保", "optionC": "受让存量基金份额或项目组合，为原投资者提供提前退出渠道", "optionD": "代替被投企业完成首次公开发行", "answer": "C", "explanation": "S基金通过受让现有投资者持有的基金份额或项目组合提供流动性，也为管理人提供接续基金方案；它不参与企业上市，也不承担管理人职责。", "difficulty": "易"}, {"uid": 1150, "id": 150, "subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "stem": "关于项目退出时点与基金存续期的匹配，下列说法正确的是（ ）。", "optionA": "基金存续期届满后，管理人可自行决定无限期延长", "optionB": "只要项目尚未退出，基金就必须永久存续", "optionC": "基金存续期通常为5至10年，包含投资期和退出期，退出安排应与投资者流动性需求匹配", "optionD": "基金存续期一般为1至2年，项目退出无需考虑存续期", "answer": "C", "explanation": "私募股权基金存续期通常为5至10年，含投资期与退出期；退出节奏需与投资者流动性需求匹配，延长存续期须按合同约定经投资者表决。", "difficulty": "难"}, {"uid": 1151, "id": 151, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金管理人的内部控制应当遵循的原则不包括（ ）。", "optionA": "全面性原则", "optionB": "独立性原则", "optionC": "收益最大化原则", "optionD": "相互制约原则", "answer": "C", "explanation": "内部控制原则包括全面性、相互制约、独立性、有效性、适时性等，收益最大化不是内部控制原则。", "difficulty": "易"}, {"uid": 1152, "id": 152, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金管理人的风险管理流程通常包括（ ）。", "optionA": "登记备案、信息披露、档案管理", "optionB": "资金募集、投资运作、项目退出", "optionC": "风险识别、风险评估、风险控制", "optionD": "人员招聘、业务培训、绩效考核", "answer": "C", "explanation": "风险管理流程一般包括风险识别、风险评估、风险控制和风险监测等环节。", "difficulty": "易"}, {"uid": 1153, "id": 153, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金管理人应当向投资者披露的信息不包括（ ）。", "optionA": "管理人员工的个人薪酬明细", "optionB": "基金的投资运作情况", "optionC": "基金的费用和收益分配情况", "optionD": "基金的资产负债情况", "answer": "A", "explanation": "信息披露内容包括基金投资运作、资产负债、费用收益分配、重大事项等，不涉及员工个人薪酬明细。", "difficulty": "中"}, {"uid": 1154, "id": 154, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金相关业务资料的保存期限自基金清算终止之日起不得少于（ ）年。", "optionA": "10", "optionB": "20", "optionC": "3", "optionD": "5", "answer": "A", "explanation": "管理人应当妥善保存投资决策、交易、信息披露等资料，保存期限自基金清算终止之日起不少于10年。", "difficulty": "中"}, {"uid": 1155, "id": 155, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金管理人应当履行的反洗钱义务不包括（ ）。", "optionA": "客户身份资料和交易记录保存", "optionB": "大额交易和可疑交易报告", "optionC": "客户身份识别", "optionD": "代替客户进行投资决策", "answer": "D", "explanation": "反洗钱义务包括客户身份识别、资料和记录保存、大额和可疑交易报告等，不包括代替客户投资决策。", "difficulty": "易"}, {"uid": 1156, "id": 156, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于私募基金的收益分配，下列说法正确的是（ ）。", "optionA": "收益分配方式无需在基金合同中约定", "optionB": "应按基金合同约定的方式和顺序进行分配", "optionC": "管理人可以优先于投资者提取全部收益", "optionD": "基金亏损时也必须向投资者分配固定收益", "answer": "B", "explanation": "基金收益分配应按照基金合同约定的分配方式、顺序和比例进行，不得承诺固定收益。", "difficulty": "中"}, {"uid": 1157, "id": 157, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "公司型私募基金管理人的治理结构通常包括（ ）。", "optionA": "仅设置股东会", "optionB": "仅设置董事会", "optionC": "股东会、董事会、监事会和高级管理层", "optionD": "仅设置高级管理层", "answer": "C", "explanation": "公司型管理人通常建立股东会、董事会、监事会和高级管理层相互制衡的治理结构。", "difficulty": "中"}, {"uid": 1158, "id": 158, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "私募基金管理人应当对从业人员进行（ ）。", "optionA": "执业培训和职业道德教育", "optionB": "个人所得税筹划培训", "optionC": "股票投资操作指导", "optionD": "房地产投资咨询服务", "answer": "A", "explanation": "管理人应加强从业人员执业培训和职业道德教育，提高其合规意识和专业能力。", "difficulty": "易"}, {"uid": 1159, "id": 159, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于私募基金估值与核算，下列说法错误的是（ ）。", "optionA": "管理人可以根据需要随意调整估值方法以平滑业绩", "optionB": "基金应当按规定的估值方法对资产进行估值", "optionC": "基金应当定期编制财务会计报告", "optionD": "估值结果影响基金份额净值和收益分配", "answer": "A", "explanation": "基金估值应遵循规定的原则和方法，管理人不得随意调整估值方法调节业绩，估值结果应真实公允。", "difficulty": "难"}, {"uid": 1160, "id": 160, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于私募基金管理人的业务隔离要求，下列说法正确的是（ ）。", "optionA": "无需建立利益冲突防范机制", "optionB": "不同基金的投资决策可以由同一人随意操作", "optionC": "可以将基金财产与管理人自有财产混同管理", "optionD": "应当建立投资、研究、交易等业务之间的隔离机制", "answer": "D", "explanation": "管理人应建立业务隔离和利益冲突防范机制，确保基金财产独立，防止利益输送。", "difficulty": "难"}, {"uid": 1161, "id": 161, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "股权投资基金治理的核心目标是（ ）。", "optionA": "最大化基金管理人的管理费收入", "optionB": "由监管机构代替投资者作出投资决策", "optionC": "通过制度安排协调投资者、管理人、托管人等各方关系，保障基金规范运作和投资者利益", "optionD": "确保基金每年都能实现正收益", "answer": "C", "explanation": "基金治理通过法律监管、自律规则、基金合同和内部治理结构协调各方关系，保护投资者利益；治理不能保证收益，也不替代投资决策。", "difficulty": "易"}, {"uid": 1162, "id": 162, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "下列机制中，最有助于实现基金管理人与投资者利益一致的是（ ）。", "optionA": "管理人按基金规模收取固定管理费且不设业绩报酬", "optionB": "免除管理人的信息披露义务", "optionC": "管理人优先于投资者分配基金收益", "optionD": "业绩报酬、管理团队跟投以及递延支付与追索扣回安排", "answer": "D", "explanation": "业绩报酬使管理人分享超额收益，跟投使其共担风险，递延支付与追索扣回约束短期行为；单纯按规模收费容易诱发盲目扩张。", "difficulty": "易"}, {"uid": 1163, "id": 163, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "下列做法中，符合公平对待投资者原则的是（ ）。", "optionA": "按基金合同约定的份额比例向全体投资者分配收益", "optionB": "将甲基金的优质项目无偿转让给乙基金", "optionC": "未在合同中约定也未披露，却向部分投资者多分收益", "optionD": "在同一基金中优先向关联方投资者分配项目回款", "answer": "A", "explanation": "公平对待要求同一基金内投资者按份额公平分配收益与费用，不同基金之间不得输送利益；差别对待和跨基金转让均违反该原则。", "difficulty": "中"}, {"uid": 1164, "id": 164, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "依据信息透明原则，管理人向投资者披露的信息通常不包括（ ）。", "optionA": "管理人股东的家庭成员职业信息", "optionB": "关联交易及潜在利益冲突", "optionC": "基金的投资组合与运作情况", "optionD": "基金费用计提与收益分配情况", "answer": "A", "explanation": "信息透明要求真实、准确、完整、及时披露基金运作、投资组合、费用、关联交易和风险等信息；股东家庭成员信息与基金运作无关。", "difficulty": "中"}, {"uid": 1165, "id": 165, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于合伙型股权投资基金的内部治理，下列说法正确的是（ ）。", "optionA": "设立股东会、董事会和监事会作为最高权力机构", "optionB": "由基金托管人决定基金的投资事项", "optionC": "投资者无权参与任何重大事项的表决", "optionD": "由执行事务合伙人执行合伙事务，修改合伙协议、延长存续期等重大事项由合伙人会议决定", "answer": "D", "explanation": "合伙型基金由普通合伙人担任执行事务合伙人负责日常事务，重大事项提交合伙人会议表决；股东会、董事会、监事会是公司型基金的治理机构。", "difficulty": "中"}, {"uid": 1166, "id": 166, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于股权投资基金咨询委员会即顾问委员会的定位，下列说法错误的是（ ）。", "optionA": "它是基金的投资决策机构，可以直接决定项目投资", "optionB": "其成员通常由主要投资者代表组成", "optionC": "其意见对管理人具有重要参考作用", "optionD": "通常就利益冲突、关联交易、估值争议等事项提供咨询意见", "answer": "A", "explanation": "咨询委员会是投资者参与治理、化解利益冲突的咨询平台，并非投资决策机构；项目投资由管理人投资决策委员会决定。", "difficulty": "易"}, {"uid": 1167, "id": 167, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "下列事项中，通常需要提交基金投资者会议表决的是（ ）。", "optionA": "管理人办公场所的装修方案", "optionB": "修改基金合同、延长基金存续期以及基金清算", "optionC": "投后管理人员的日常考勤管理", "optionD": "单个项目尽职调查的人员安排", "answer": "B", "explanation": "修改合同、延长存续期、关联交易、清算等重大事项关系投资者根本利益，须经投资者会议按合同约定比例表决；日常事务由管理人决定。", "difficulty": "中"}, {"uid": 1168, "id": 168, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "下列制度安排中，属于基金治理约束机制的是（ ）。", "optionA": "管理团队强制跟投", "optionB": "业绩报酬与超额收益分配", "optionC": "员工持股计划", "optionD": "投资限制、关联交易审批、托管监督与外部审计", "answer": "D", "explanation": "约束机制通过投资限制、关联交易审批、托管监督、信息披露、审计和自律检查限制管理人行为；业绩报酬、跟投与员工持股属于激励机制。", "difficulty": "难"}, {"uid": 1169, "id": 169, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "专业审慎原则对基金管理人的核心要求是（ ）。", "optionA": "只投资于低风险项目以确保本金安全", "optionB": "将投资决策权全部交由投资者行使", "optionC": "具备与业务相匹配的专业能力，勤勉尽责、审慎决策并持续履行受托职责", "optionD": "以管理规模最大化为首要经营目标", "answer": "C", "explanation": "专业审慎要求管理人具备专业胜任能力，在募集、投资、管理、退出各环节勤勉尽责；股权基金属高风险投资，规模最大化与该原则相悖。", "difficulty": "易"}, {"uid": 1170, "id": 170, "subject": "科目三", "chapter": "第八章 股权投资基金治理", "stem": "关于股权投资基金治理体系，下列说法错误的是（ ）。", "optionA": "声誉机制和市场约束对管理人行为具有一定的规范作用", "optionB": "治理体系包括法律监管、自律规则、基金合同、内部治理结构和市场约束", "optionC": "只要监管处罚足够严厉，就无需建立内部治理结构", "optionD": "基金合同是约定各方权利义务的核心法律文件", "answer": "C", "explanation": "基金治理是多重制度共同作用的体系，外部监管不能替代内部治理结构、合同约定和市场约束，该说法割裂了治理体系的整体性。", "difficulty": "难"}, {"uid": 1171, "id": 171, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "私募股权投资基金的外部监管机构主要是（ ）。", "optionA": "财政部", "optionB": "商务部", "optionC": "国家外汇管理局", "optionD": "中国证监会及其派出机构", "answer": "D", "explanation": "中国证监会及其派出机构依法对私募投资基金业务实施监督管理，是私募基金行业的主要行政监管机关。", "difficulty": "易"}, {"uid": 1172, "id": 172, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "我国私募投资基金行业监管的基本原则不包括（ ）。", "optionA": "全面审批", "optionB": "行业自律", "optionC": "底线监管", "optionD": "适度监管", "answer": "A", "explanation": "私募基金监管坚持适度监管、底线监管、行业自律、社会监督相结合，不实行全面审批。", "difficulty": "易"}, {"uid": 1173, "id": 173, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "2023年施行的《私募投资基金监督管理条例》的发布主体是（ ）。", "optionA": "中国证券投资基金业协会", "optionB": "全国人民代表大会常务委员会", "optionC": "中国证监会", "optionD": "国务院", "answer": "D", "explanation": "《私募投资基金监督管理条例》由国务院发布，自2023年9月1日起施行，是私募基金行业的重要行政法规。", "difficulty": "中"}, {"uid": 1174, "id": 174, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "私募基金管理人未按规定办理登记，擅自从事私募基金业务的，可能面临的监管措施是（ ）。", "optionA": "直接追究刑事责任", "optionB": "责令改正、警告、罚款", "optionC": "由中基协颁发营业执照", "optionD": "无需承担任何责任", "answer": "B", "explanation": "未经登记擅自从事私募基金业务的，监管部门可依法责令改正、给予警告、处以罚款等。", "difficulty": "中"}, {"uid": 1175, "id": 175, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "关于私募基金募集行为的监管要求，下列说法正确的是（ ）。", "optionA": "可以拆分基金份额向多人变相销售", "optionB": "可以向不特定对象公开宣传推介", "optionC": "可以向投资者承诺最低收益", "optionD": "应当向合格投资者募集，不得公开宣传", "answer": "D", "explanation": "私募基金应向合格投资者非公开募集，不得公开宣传推介，不得承诺保本保收益，不得拆分份额变相突破人数限制。", "difficulty": "易"}, {"uid": 1176, "id": 176, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "私募基金管理人应当按监管要求报送的信息不包括（ ）。", "optionA": "基金季度更新信息", "optionB": "基金年度报告", "optionC": "管理人重大事项变更信息", "optionD": "管理人员工的家庭成员信息", "answer": "D", "explanation": "信息报送包括基金季度更新、年度报告、重大事项变更等，员工家庭成员信息不属于报送范围。", "difficulty": "中"}, {"uid": 1177, "id": 177, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "中国证监会对私募基金违法行为可以采取的行政处罚措施不包括（ ）。", "optionA": "罚款", "optionB": "没收违法所得", "optionC": "警告", "optionD": "直接撤销基金管理人的公司章程", "answer": "D", "explanation": "行政处罚措施包括警告、罚款、没收违法所得、责令停止业务等，不包括撤销公司章程。", "difficulty": "易"}, {"uid": 1178, "id": 178, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "关于私募基金托管，下列说法正确的是（ ）。", "optionA": "所有私募基金都必须强制托管", "optionB": "除基金合同另有约定外，私募基金应当由基金托管人托管", "optionC": "托管人由投资者自行选定并承担全部责任", "optionD": "托管人可以参与基金的投资决策", "answer": "B", "explanation": "除基金合同另有约定外，私募基金应当由基金托管人托管；托管人负责保管财产，不参与投资决策。", "difficulty": "中"}, {"uid": 1179, "id": 179, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "关于私募基金管理人登记，下列说法正确的是（ ）。", "optionA": "登记不构成对管理人投资能力和持续合规情况的认可", "optionB": "登记由地方政府金融管理部门负责办理", "optionC": "登记后管理人即获得监管部门的业绩担保", "optionD": "登记后管理人无需再履行信息报送义务", "answer": "A", "explanation": "管理人登记不构成对其投资能力、持续合规情况的认可，也不作为基金财产安全的保证，管理人仍需持续履行义务。", "difficulty": "难"}, {"uid": 1180, "id": 180, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "关于私募基金监管中的功能监管与机构监管，下列说法正确的是（ ）。", "optionA": "两者含义完全相同，可以相互替代", "optionB": "功能监管只监管机构而不监管业务", "optionC": "功能监管强调按业务性质实施统一监管，减少监管套利", "optionD": "机构监管完全不关注机构经营行为", "answer": "C", "explanation": "功能监管按金融业务性质实施统一监管，有利于减少监管真空和套利；机构监管侧重对机构整体的审慎监管。", "difficulty": "难"}, {"uid": 1181, "id": 181, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "我国私募投资基金行业的自律管理组织是（ ）。", "optionA": "中国证券投资基金业协会", "optionB": "中国人民银行", "optionC": "中国银行业协会", "optionD": "中国证监会", "answer": "A", "explanation": "中国证券投资基金业协会是私募投资基金行业的自律管理组织，依法开展自律管理。", "difficulty": "易"}, {"uid": 1182, "id": 182, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "中国证券投资基金业协会的自律管理职责不包括（ ）。", "optionA": "对违规会员实施纪律处分", "optionB": "对违法主体判处刑罚", "optionC": "办理私募基金登记备案", "optionD": "制定行业自律规则", "answer": "B", "explanation": "中基协负责自律规则制定、登记备案、会员管理、纪律处分等，判处刑罚属于司法机关职权。", "difficulty": "易"}, {"uid": 1183, "id": 183, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "私募基金管理人在登记后应当按规定持续报送的信息是（ ）。", "optionA": "仅在被投企业上市时报送信息", "optionB": "无需向中基协报送任何信息", "optionC": "管理人年度财务报告和基金运行信息", "optionD": "仅在登记时报送一次信息即可", "answer": "C", "explanation": "管理人登记后应按规定持续报送年度财务报告、基金运行信息及重大事项变更等信息。", "difficulty": "中"}, {"uid": 1184, "id": 184, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "中基协对违规会员可以采取的纪律处分措施不包括（ ）。", "optionA": "警告", "optionB": "取消会员资格", "optionC": "暂停办理业务", "optionD": "吊销营业执照", "answer": "D", "explanation": "纪律处分包括警告、暂停办理业务、取消会员资格、撤销登记等，吊销营业执照属于市场监管部门职权。", "difficulty": "中"}, {"uid": 1185, "id": 185, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "关于私募基金从业人员资格管理，下列说法正确的是（ ）。", "optionA": "从业人员资格由证券交易所认定", "optionB": "从业人员应当遵守职业道德，按规定参加执业培训", "optionC": "从业人员可以同时在多家竞争性机构任职", "optionD": "从业人员无需具备任何专业能力", "answer": "B", "explanation": "私募基金从业人员应遵守职业道德规范，按规定参加执业培训，不断提高专业能力和合规意识。", "difficulty": "易"}, {"uid": 1186, "id": 186, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem": "中基协的会员管理通常包括的会员类别是（ ）。", "optionA": "仅设观察会员一类", "optionB": "会员类别由管理人自行决定", "optionC": "仅设普通会员一类", "optionD": "普通会员、联席会员、观察会员等", "answer": "D", "explanation": "中基协会员分为普通会员、联席会员、观察会员等类别，按章程和自律规则实施管理。", "difficulty": "中"}, {"uid": 1187, "id": 187, "subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "stem" const LS_KEY = "jjcy_quiz_v1";

let pool = ALL.slice();
let idx = 0;
let record = load();

function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {ans:{}, wrong:{}}; }
  catch(e){ return {ans:{}, wrong:{}}; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(record)); }catch(e){} }

const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1400); }

function rebuildPool(){
  const subj = $("fSubject").value, chap = $("fChapter").value, onlyWrong = $("btnWrong").dataset.on === "1";
  pool = ALL.filter(q => (subj==="全部" || q.subject===subj)
                      && (chap==="全部" || q.chapter===chap)
                      && (!onlyWrong || record.wrong[q.uid]));
  if($("btnShuffle").dataset.on === "1") pool = shuffle(pool.slice());
  idx = firstUnanswered();
  render();
}
// 定位到第一道还没做过的题；全部做完则回到第一题
function firstUnanswered(){
  for(let i=0;i<pool.length;i++){
    if(!record.ans[pool[i].uid]) return i;
  }
  return 0;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function renderChapters(){
  const subj = $("fSubject").value;
  const set = new Set(ALL.filter(q=>subj==="全部"||q.subject===subj).map(q=>q.chapter));
  const sel = $("fChapter");
  sel.innerHTML = '<option value="全部">全部章节</option>' + [...set].map(c=>`<option value="${c}">${c}</option>`).join("");
}

function render(){
  if(pool.length === 0){ $("card").style.display="none"; $("hint").textContent="当前筛选下没有题目"; updateStats(); return; }
  $("card").style.display="block";
  const q = pool[idx];
  $("qSubject").textContent = q.subject;
  $("qChapter").textContent = q.chapter;
  $("qDiff").textContent = "难度 " + q.difficulty;
  $("qDiff").className = "tag " + (q.difficulty==="易"?"d1":q.difficulty==="中"?"d2":"d3");
  $("qIndex").textContent = (idx+1) + " / " + pool.length;
  $("qStem").textContent = q.stem;

  const keys = ["A","B","C","D"];
  const picked = record.ans[q.uid];
  $("qOptions").innerHTML = keys.map(k=>{
    const txt = q["option"+k];
    let cls = "opt";
    if(picked){
      if(k === q.answer) cls += " right";
      else if(k === picked) cls += " wrong";
      else cls += " dim";
    }
    return `<div class="${cls}" data-k="${k}"><span class="k">${k}</span><span>${txt}</span></div>`;
  }).join("");

  const ex = $("qExplain");
  if(picked){
    ex.classList.add("show");
    ex.innerHTML = `<span class="ans">正确答案 ${q.answer}${picked===q.answer?" · 你答对了":" · 你选了"}${picked===q.answer?"":picked}</span><br>${q.explanation}`;
  } else { ex.classList.remove("show"); ex.innerHTML=""; }

  $("qOptions").querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=> pick(q, el.dataset.k, el));
  });

  $("btnPrev").classList.toggle("is-dim", idx === 0);
  $("btnPrev").removeAttribute("disabled");
  $("btnNext").removeAttribute("disabled");
  $("btnNext").textContent = (idx === pool.length-1) ? "已是最后一题" : "下一题 →";
  $("btnNext").classList.toggle("is-dim", idx === pool.length-1);
  updateStats();
}

function pick(q, k){
  if(record.ans[q.uid]) return;
  record.ans[q.uid] = k;
  if(k !== q.answer) record.wrong[q.uid] = true;
  else delete record.wrong[q.uid];
  save(); render();
  if(k !== q.answer) toast("答错，已加入错题本");
}

function updateStats(){
  const done = Object.keys(record.ans).length;
  const total = ALL.length;
  let right = 0;
  for(const [id,k] of Object.entries(record.ans)){
    const q = ALL.find(x=>String(x.uid)===String(id));
    if(q && q.answer===k) right++;
  }
  $("sDone").textContent = done;
  $("sTotal").textContent = total;
  $("sRate").textContent = done ? Math.round(right/done*100)+"%" : "0%";
  $("sWrong").textContent = Object.keys(record.wrong).length;
  $("barFill").style.width = total ? (done/total*100)+"%" : "0%";
}

$("fSubject").addEventListener("change", ()=>{ renderChapters(); rebuildPool(); });
$("fChapter").addEventListener("change", rebuildPool);
$("btnWrong").addEventListener("click", e=>{ e.target.dataset.on = e.target.dataset.on==="1"?"0":"1"; e.target.classList.toggle("primary"); e.target.classList.toggle("ghost"); rebuildPool(); });
$("btnShuffle").addEventListener("click", e=>{ e.target.dataset.on = e.target.dataset.on==="1"?"0":"1"; e.target.classList.toggle("primary"); e.target.classList.toggle("ghost"); rebuildPool(); });
$("btnReset").addEventListener("click", ()=>{ if(confirm("确定清空所有作答记录和错题本？")){ record={ans:{},wrong:{}}; save(); idx=0; rebuildPool(); toast("已清空"); } });
function scrollToCard(){
  const el = $("card");
  if(!el || el.style.display === "none") return;
  const y = el.getBoundingClientRect().top + window.pageYOffset - 8;
  window.scrollTo(0, Math.max(0, y));
}
function go(delta){
  const ni = idx + delta;
  if(ni < 0){ toast("已经是第一题了"); return; }
  if(ni >= pool.length){ toast("已经是最后一题了"); return; }
  idx = ni;
  render();
  scrollToCard();
}
$("btnPrev").addEventListener("click", ()=>go(-1));
$("btnNext").addEventListener("click", ()=>go(1));

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); go(1); }
  else { const k=e.key.toUpperCase(); if(["A","B","C","D"].includes(k)){ const el=document.querySelector(".opt[data-k='"+k+"']"); if(el) el.click(); } }
});

renderChapters();
rebuildPool();
</script>
</body>
</html>
