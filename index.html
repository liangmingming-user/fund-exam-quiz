<style>
  :root{--blue:#1f4e79;--green:#2e7d32;--red:#c62828;--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--muted:#6b7280}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1f2937;padding-bottom:90px}
  header{background:var(--blue);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.8;margin-top:3px}
  .stats{display:flex;gap:14px;margin-top:10px;font-size:12px}
  .stats b{font-size:15px;margin-right:2px}
  .wrap{max-width:760px;margin:0 auto;padding:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  .panel.actions button{flex:0 1 auto}
  select,button{font-size:13px;font-family:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 10px;color:#1f2937}
  select{min-width:0}
  button{cursor:pointer}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.ghost{background:#fff;color:var(--blue);border-color:#c9d6e3}
  button:active{opacity:.75}
  .bar{height:6px;background:#e5ebf2;border-radius:99px;overflow:hidden;margin:0 0 12px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#eef3f8;color:var(--blue)}
  .tag.d1{background:#e8f5e9;color:#2e7d32}.tag.d2{background:#fff8e1;color:#a16207}.tag.d3{background:#fdecea;color:#c62828}
  .stem{font-size:16px;line-height:1.65;margin:4px 0 14px;font-weight:500}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;line-height:1.5;font-size:14.5px}
  .opt:hover{border-color:#a9c3dd;background:#fafcff}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;background:#eef3f8;color:var(--blue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt.right{border-color:var(--green);background:#f1f8f1}
  .opt.right .k{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:#fdf3f3}
  .opt.wrong .k{background:var(--red);color:#fff}
  .opt.dim{opacity:.55;cursor:default}
  .explain{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13.5px;line-height:1.7;color:#374151;display:none}
  .explain.show{display:block}
  .explain .ans{color:var(--green);font-weight:700;margin-right:6px}
  .foot{display:flex;gap:10px;margin-top:14px}
  .foot button{flex:1;padding:11px 0;font-size:14px}
  .foot .nav{background:#fff;color:var(--blue);border:1px solid #c9d6e3}
  .foot button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .foot button:active{transform:scale(.985)}
  .foot .nav.is-dim{opacity:.4}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(31,41,55,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:480px){.stem{font-size:15px}.opt{font-size:14px}}
</style>
</head>

<script>
const ALL = [{"uid": 1, "id": 1, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "金融市场最基本的功能是（　）。", "optionA": "信息传递", "optionB": "风险管理", "optionC": "价格发现", "optionD": "资金融通", "answer": "D", "explanation": "金融市场通过金融工具引导资金从盈余部门流向短缺部门，实现资金融通，这是其最基本的功能。", "difficulty": "易"}, {"uid": 2, "id": 2, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "按金融工具的期限划分，金融市场可以分为（　）。", "optionA": "货币市场和资本市场", "optionB": "一级市场和二级市场", "optionC": "场内市场和场外市场", "optionD": "国内市场和国外市场", "answer": "A", "explanation": "期限在1年以内的为货币市场，1年以上的为资本市场，这是按交易期限划分的结果。", "difficulty": "易"}, {"uid": 3, "id": 3, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "下列融资方式中，属于间接融资的是（　）。", "optionA": "企业发行股票", "optionB": "政府发行国债", "optionC": "企业发行债券", "optionD": "银行发放贷款", "answer": "D", "explanation": "间接融资通过金融中介机构进行，银行吸收存款后发放贷款属于典型的间接融资。", "difficulty": "易"}, {"uid": 4, "id": 4, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "世界上第一只公认的证券投资基金是（　）。", "optionA": "荷兰东印度公司", "optionB": "美国马萨诸塞投资信托基金", "optionC": "英国海外及殖民地政府信托", "optionD": "法国通用银行", "answer": "C", "explanation": "1868年英国成立的海外及殖民地政府信托被认为是世界上第一只证券投资基金，标志着基金业的诞生。", "difficulty": "易"}, {"uid": 5, "id": 5, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "我国第一只开放式基金是（　）。", "optionA": "南方稳健成长", "optionB": "华安创新", "optionC": "基金开元", "optionD": "基金金泰", "answer": "B", "explanation": "2001年9月华安创新基金成立，是我国第一只开放式基金，标志着我国基金业进入开放式基金时代。", "difficulty": "中"}, {"uid": 6, "id": 6, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "关于资产管理，下列说法正确的是（　）。", "optionA": "资产管理人可将受托资产与自有资产混合管理", "optionB": "资产管理业务不需要向委托人披露投资运作情况", "optionC": "资产管理人按约定收取管理费，投资收益归委托人所有", "optionD": "资产管理人运用受托资产投资，投资风险由管理人承担", "answer": "C", "explanation": "资产管理是受托理财，管理人收取管理费，投资收益和风险由委托人承担，并应履行信息披露义务。", "difficulty": "中"}, {"uid": 7, "id": 7, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "与间接融资相比，直接融资的特点是（　）。", "optionA": "融资风险主要由金融中介承担", "optionB": "资金供求双方直接形成债权债务关系", "optionC": "融资成本完全由金融中介决定", "optionD": "不受金融市场发育程度影响", "answer": "B", "explanation": "直接融资中资金供求双方直接对接，形成债权债务或股权关系，无需经过金融中介。", "difficulty": "中"}, {"uid": 8, "id": 8, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "下列不属于货币市场工具的是（　）。", "optionA": "公司股票", "optionB": "同业拆借", "optionC": "商业票据", "optionD": "大额可转让定期存单", "answer": "A", "explanation": "货币市场工具期限在1年以内，包括同业拆借、大额存单、商业票据、短期国债等，股票属于资本市场工具。", "difficulty": "中"}, {"uid": 9, "id": 9, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "关于金融市场的价格发现功能，下列理解正确的是（　）。", "optionA": "价格发现仅指股票价格的涨跌", "optionB": "金融市场通过公开竞价形成资金价格，引导资源合理配置", "optionC": "价格发现功能只在场内市场发挥作用", "optionD": "金融产品的价格由监管机构统一制定", "answer": "B", "explanation": "金融市场通过众多交易者的公开竞价形成利率、汇率和证券价格，为资源配置提供信号。", "difficulty": "难"}, {"uid": 10, "id": 10, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "关于我国证券投资基金业的发展，下列说法错误的是（　）。", "optionA": "2001年华安创新基金成立，是我国第一只开放式基金", "optionB": "1998年基金开元、基金金泰两只封闭式基金成立", "optionC": "我国第一只ETF于1998年推出", "optionD": "2012年修订的《证券投资基金法》自2013年6月1日起施行", "answer": "C", "explanation": "我国第一只ETF是2004年推出的上证50ETF，1998年成立的是封闭式基金，故D项错误。", "difficulty": "难"}, {"uid": 11, "id": 11, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "在金融市场主体中，兼有金融市场参与主体和监管者双重身份的是（　）。", "optionA": "个人投资者", "optionB": "中央银行", "optionC": "金融机构", "optionD": "政府", "answer": "B", "explanation": "中央银行处于特殊地位，既参与金融市场交易，又承担宏观调控和监管职责；政府主要是资金需求方，个人主要是资金供给方。", "difficulty": "易"}, {"uid": 12, "id": 12, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "按参与身份划分，通常作为金融市场主要资金供给方的是（　）。", "optionA": "非金融企业", "optionB": "中央银行", "optionC": "政府", "optionD": "个人", "answer": "D", "explanation": "个人是金融市场主要的资金供给方，有时通过消费信贷成为资金需求方；政府和典型非金融企业则主要是资金需求方。", "difficulty": "易"}, {"uid": 13, "id": 13, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "按交割期限划分，协议成立与标的交割相分离的市场是（　）。", "optionA": "期货和衍生品市场", "optionB": "货币市场", "optionC": "现货市场", "optionD": "外汇市场", "answer": "A", "explanation": "现货市场达成交易后须在若干交易日内交割；期货和衍生品市场约定在特定时间后交割，协议成立与标的交割相互分离。", "difficulty": "中"}, {"uid": 14, "id": 14, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "证券集中竞价交易撮合成交时遵循的原则是（　）。", "optionA": "时间优先、价格优先", "optionB": "价格优先、数量优先", "optionC": "数量优先、价格优先", "optionD": "价格优先、时间优先", "answer": "D", "explanation": "证券集中竞价按当事人报价，实行价格优先、时间优先的撮合原则；数量优先不是我国证券集中竞价的撮合原则。", "difficulty": "易"}, {"uid": 15, "id": 15, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "下列市场中，属于我国典型场外交易市场的是（　）。", "optionA": "深圳证券交易所", "optionB": "上海证券交易所", "optionC": "银行间债券市场", "optionD": "北京证券交易所", "answer": "C", "explanation": "场外交易是在交易所之外分散进行的交易，我国典型场外市场包括银行间债券市场、代办股份转让系统和债券柜台交易市场。", "difficulty": "易"}, {"uid": 16, "id": 16, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "现代金融体系的构成不包括（　）。", "optionA": "金融市场", "optionB": "金融调控", "optionC": "企业年度预算", "optionD": "金融机构", "answer": "C", "explanation": "现代金融体系包括金融市场、金融机构、金融监管、金融产品和服务、金融调控、金融基础设施六个方面，企业年度预算不属于其中。", "difficulty": "易"}, {"uid": 17, "id": 17, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "资产管理三大基本原则中，作为买者自负前提的是（　）。", "optionA": "审慎监管原则", "optionB": "风险收益匹配原则", "optionC": "公开公平公正原则", "optionD": "卖者尽责原则", "answer": "D", "explanation": "卖者尽责侧重保护投资者，是买者自负的前提；买者自负强调投资者承担最终收益和风险，不得存在保本保收益的刚性兑付。", "difficulty": "难"}, {"uid": 18, "id": 18, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "某证券类资产管理产品投资于债券等债权类资产的比例为85%，其余资产投资于股票，该产品应归类为（　）。", "optionA": "固定收益类产品", "optionB": "权益类产品", "optionC": "商品及金融衍生品类产品", "optionD": "混合类产品", "answer": "A", "explanation": "债权类资产投资比例不低于80%的为固定收益类；权益类要求股票等权益资产不低于80%，该产品股票仅占15%，不符合权益类标准。", "difficulty": "中"}, {"uid": 19, "id": 19, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "关于资产管理产品投资非标准化债权类资产，下列说法正确的是（　）。", "optionA": "公募资产管理产品可以投资未上市企业股权", "optionB": "可以直接投资商业银行信贷资产", "optionC": "非标资产终止日可以晚于开放式产品最近一次开放日", "optionD": "非标资产终止日不得晚于封闭式产品到期日或开放式产品最近一次开放日", "answer": "D", "explanation": "资管产品不得直投商业银行信贷资产；非标终止日不得晚于封闭式产品到期日或开放式产品最近一次开放日；公募产品不得投未上市企业股权。", "difficulty": "难"}, {"uid": 20, "id": 20, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "证券期货经营机构取得私募资产管理业务资格后，设立私募资产管理计划应当履行的程序是（　）。", "optionA": "报国家金融监督管理总局登记", "optionB": "报中国证监会批准", "optionC": "报证券交易所核准", "optionD": "报中国证券投资基金业协会备案", "answer": "D", "explanation": "开展私募资产管理业务的资格须经中国证监会批准，取得资格后设立的私募资产管理计划须在协会备案，注意区分资格批准与产品备案。", "difficulty": "难"}, {"uid": 21, "id": 21, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "公募基金产品应当经下列哪个机构进行产品注册及基金备案（　）。", "optionA": "国家金融监督管理总局", "optionB": "中国证监会", "optionC": "中国证券投资基金业协会", "optionD": "中国人民银行", "answer": "B", "explanation": "公募基金管理业务须经中国证监会批准，公募基金产品须经中国证监会产品注册及基金备案；协会负责私募基金相关登记备案。", "difficulty": "易"}, {"uid": 22, "id": 22, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "银行理财子公司、保险公司以及信托公司开展资产管理业务，须经下列哪个机构批准设立（　）。", "optionA": "国家金融监督管理总局", "optionB": "中国人民银行", "optionC": "中国证券投资基金业协会", "optionD": "中国证监会", "answer": "A", "explanation": "银行及其理财子公司、保险公司与保险资产管理机构、信托公司、金融资产投资公司，须经国家金融监督管理总局批准设立后展业。", "difficulty": "中"}, {"uid": 23, "id": 23, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "每只封闭式公募产品的总资产不得超过该产品净资产的（　）。", "optionA": "120%", "optionB": "100%", "optionC": "200%", "optionD": "140%", "answer": "C", "explanation": "每只开放式公募产品总资产不得超过净资产的140%，每只封闭式公募产品和每只私募产品不得超过200%，分级私募产品为140%。", "difficulty": "中"}, {"uid": 24, "id": 24, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "关于公募资产管理产品的投资范围，下列说法正确的是（　）。", "optionA": "主要投资标准化债权类资产以及上市交易的股票", "optionB": "可以投资未上市企业股权", "optionC": "投资范围由投资者与管理人逐笔协商确定", "optionD": "可以直接投资商业银行信贷资产", "answer": "A", "explanation": "公募资管产品主要投资标准化债权类资产和上市交易的股票，不得投资未上市企业股权；私募产品投资范围才由合同约定。", "difficulty": "中"}, {"uid": 25, "id": 25, "subject": "科目一", "chapter": "第一章 金融市场与资产管理", "stem": "资产管理业务监管中，要求向上识别最终投资者、向下识别底层资产的监管方式称为（　）。", "optionA": "功能监管", "optionB": "机构监管", "optionC": "宏观审慎管理", "optionD": "穿透式监管", "answer": "D", "explanation": "穿透式监管强调向上识别最终投资者、向下识别底层资产，防止多层嵌套和监管套利；机构监管按机构类型实施监管。", "difficulty": "易"}, {"uid": 26, "id": 26, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "证券投资基金本质上是一种（　）。", "optionA": "债权凭证", "optionB": "集合投资工具", "optionC": "银行存单", "optionD": "所有权凭证", "answer": "B", "explanation": "基金通过发售基金份额汇集投资者资金，由管理人专业管理，本质上是一种集合投资工具。", "difficulty": "易"}, {"uid": 27, "id": 27, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "证券投资基金的特点不包括（　）。", "optionA": "组合投资、分散风险", "optionB": "集合理财、专业管理", "optionC": "保本保收益", "optionD": "利益共享、风险共担", "answer": "C", "explanation": "基金实行组合投资、风险共担，不得承诺保本保收益，保本保收益不是基金的特点。", "difficulty": "易"}, {"uid": 28, "id": 28, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "股票反映所有权关系，债券反映债权关系，基金反映的是（　）。", "optionA": "信托关系", "optionB": "担保关系", "optionC": "所有权关系", "optionD": "债权关系", "answer": "A", "explanation": "基金份额持有人将资金委托给管理人管理，形成信托关系，这是基金与股票、债券的重要区别。", "difficulty": "易"}, {"uid": 29, "id": 29, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "证券投资基金的当事人包括（　）。", "optionA": "基金份额持有人、基金管理人和基金销售机构", "optionB": "基金份额持有人、基金管理人和基金托管人", "optionC": "基金份额持有人、基金托管人和基金登记机构", "optionD": "基金管理人、基金托管人和基金销售机构", "answer": "B", "explanation": "基金份额持有人、基金管理人和基金托管人是基金的当事人，销售机构、登记机构属于基金服务机构。", "difficulty": "易"}, {"uid": 30, "id": 30, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "证券投资基金的主要作用不包括（　）。", "optionA": "为中小投资者拓宽投资渠道", "optionB": "有效分散投资风险", "optionC": "促进证券市场稳定发展", "optionD": "保证投资者获得固定收益", "answer": "D", "explanation": "基金通过组合投资分散风险，但收益不确定，不能保证固定收益，故A项不是基金的作用。", "difficulty": "中"}, {"uid": 31, "id": 31, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "基金的运作不包括下列哪个环节（　）。", "optionA": "投资管理", "optionB": "存款保险", "optionC": "基金募集", "optionD": "基金托管", "answer": "B", "explanation": "基金运作主要包括募集、投资管理、托管、登记、销售和信息披露等环节，与存款保险无关。", "difficulty": "中"}, {"uid": 32, "id": 32, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "基金托管制度的核心作用是（　）。", "optionA": "承担基金投资风险", "optionB": "保证基金资产安全，防止基金财产被挪用", "optionC": "提高基金收益", "optionD": "决定基金投资方向", "answer": "B", "explanation": "基金托管人独立保管基金财产，对管理人投资运作进行监督，保障基金资产安全。", "difficulty": "中"}, {"uid": 33, "id": 33, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "与银行存款相比，证券投资基金的特点是（　）。", "optionA": "收益和风险由投资者承担，不承诺保本", "optionB": "收益固定，没有风险", "optionC": "可以随时按约定利率取得利息", "optionD": "受存款保险制度保障", "answer": "A", "explanation": "基金投资风险由投资者承担，不承诺保本保收益，这是其与银行存款的重要区别。", "difficulty": "中"}, {"uid": 34, "id": 34, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "关于证券投资基金在金融体系中的地位，下列说法正确的是（　）。", "optionA": "基金属于间接融资，资金全部来自银行", "optionB": "基金是直接融资工具，可将储蓄转化为长期投资", "optionC": "基金只能投资于货币市场", "optionD": "基金规模变化与证券市场无关", "answer": "B", "explanation": "基金汇集社会资金投资于证券市场，属于直接融资范畴，有助于储蓄转化为长期投资。", "difficulty": "难"}, {"uid": 35, "id": 35, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "《证券投资基金法》的立法宗旨不包括（　）。", "optionA": "促进证券投资基金和资本市场的健康发展", "optionB": "确保基金投资者获得最低收益", "optionC": "规范证券投资基金活动", "optionD": "保护投资人及相关当事人的合法权益", "answer": "B", "explanation": "根据《证券投资基金法》，立法宗旨是规范基金活动、保护投资人权益、促进市场健康发展，不包括保证收益。", "difficulty": "难"}, {"uid": 36, "id": 36, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "按运作方式划分，基金可以分为（　）。", "optionA": "主动型基金和被动型基金", "optionB": "股票基金和债券基金", "optionC": "封闭式基金和开放式基金", "optionD": "契约型基金和公司型基金", "answer": "C", "explanation": "按基金份额是否可赎回及运作方式，基金分为封闭式基金和开放式基金。", "difficulty": "易"}, {"uid": 37, "id": 37, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "根据规定，股票基金投资于股票的比例不得低于基金资产的（　）。", "optionA": "70%", "optionB": "60%", "optionC": "80%", "optionD": "50%", "answer": "C", "explanation": "根据《公开募集证券投资基金运作管理办法》，80%以上的基金资产投资于股票的为股票基金。", "difficulty": "易"}, {"uid": 38, "id": 38, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "根据规定，债券基金投资于债券的比例不得低于基金资产的（　）。", "optionA": "60%", "optionB": "95%", "optionC": "80%", "optionD": "70%", "answer": "C", "explanation": "80%以上的基金资产投资于债券的为债券基金，这是基金分类的基本标准。", "difficulty": "易"}, {"uid": 39, "id": 39, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "货币市场基金可以投资下列哪类金融工具（　）。", "optionA": "可转换债券", "optionB": "股票", "optionC": "信用等级在AAA级以下的企业债券", "optionD": "剩余期限在397天以内的债券", "answer": "D", "explanation": "货币市场基金投资于剩余期限不超过397天的债券等货币市场工具，不得投资股票和可转债。", "difficulty": "易"}, {"uid": 40, "id": 40, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "关于ETF，下列说法正确的是（　）。", "optionA": "ETF必须每日公布全部投资组合", "optionB": "ETF通常采用被动投资策略，跟踪特定指数", "optionC": "ETF只能在交易所申购赎回", "optionD": "ETF不能在场内交易", "answer": "B", "explanation": "ETF即交易型开放式指数基金，通常采用被动策略跟踪指数，可同时在场内交易和申购赎回。", "difficulty": "中"}, {"uid": 41, "id": 41, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "关于LOF，下列说法正确的是（　）。", "optionA": "LOF是上市开放式基金，可在交易所买卖", "optionB": "LOF只能在场外申购赎回", "optionC": "LOF属于封闭式基金", "optionD": "LOF必须跟踪特定指数", "answer": "A", "explanation": "LOF即上市开放式基金，既可在场外申购赎回，也可在交易所上市交易，不一定跟踪指数。", "difficulty": "中"}, {"uid": 42, "id": 42, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "QDII基金是指（　）。", "optionA": "合格境内机构投资者投资境外市场的基金", "optionB": "投资于国内股票市场的基金", "optionC": "合格境外机构投资者投资境内市场的基金", "optionD": "专门投资债券的基金", "answer": "A", "explanation": "QDII即合格境内机构投资者，此类基金在境内募集资金后投资于境外证券市场。", "difficulty": "中"}, {"uid": 43, "id": 43, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "根据规定，基金中的基金（FOF）投资于其他基金份额的比例不得低于基金资产的（　）。", "optionA": "60%", "optionB": "90%", "optionC": "70%", "optionD": "80%", "answer": "D", "explanation": "根据《公开募集证券投资基金运作管理办法》，80%以上的基金资产投资于其他基金份额的为基金中的基金。", "difficulty": "中"}, {"uid": 44, "id": 44, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "关于分级基金，下列说法正确的是（　）。", "optionA": "分级基金属于货币市场基金", "optionB": "分级基金不得在交易所上市", "optionC": "分级基金通过将基金份额分成不同风险收益特征的子份额", "optionD": "分级基金的不同份额具有相同的风险收益特征", "answer": "C", "explanation": "分级基金将基金份额分为风险收益特征不同的子份额，如优先级和进取级，以满足不同投资者需求。", "difficulty": "难"}, {"uid": 45, "id": 45, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "下列基金类型中，按投资理念划分的是（　）。", "optionA": "封闭式基金与开放式基金", "optionB": "契约型基金与公司型基金", "optionC": "主动型基金与被动型基金", "optionD": "股票基金与债券基金", "answer": "C", "explanation": "按投资理念，基金可分为主动型基金和被动型基金，后者主要采用指数化投资策略。", "difficulty": "难"}, {"uid": 46, "id": 46, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "公募基金是指向不特定对象募集资金，或者向特定对象募集资金累计超过一定人数而设立的基金，该人数是（　）。", "optionA": "200人", "optionB": "300人", "optionC": "500人", "optionD": "100人", "answer": "A", "explanation": "公募基金是向不特定对象募集，或向特定对象募集累计超过200人设立的基金；私募基金向合格投资者非公开募集。", "difficulty": "易"}, {"uid": 47, "id": 47, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "合伙型基金中，普通合伙人对合伙企业债务承担的责任是（　）。", "optionA": "无限连带责任", "optionB": "以认缴出资额为限", "optionC": "不承担对外责任", "optionD": "以实缴出资额为限", "answer": "A", "explanation": "合伙型基金由普通合伙人和有限合伙人组成，普通合伙人承担无限连带责任，有限合伙人以其认缴出资额为限承担责任。", "difficulty": "中"}, {"uid": 48, "id": 48, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "重新召集的基金份额持有人大会，应当有代表基金份额（　）以上的持有人参加，方可召开。", "optionA": "三分之一", "optionB": "四分之三", "optionC": "三分之二", "optionD": "二分之一", "answer": "A", "explanation": "首次召开需代表二分之一以上基金份额的持有人参加；未达到的可在原定时间三个月以后、六个月以内重新召集，重新召集需三分之一以上参加。", "difficulty": "难"}, {"uid": 49, "id": 49, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "私募证券投资基金中的期货和衍生品类基金，其期货和衍生品账户权益应当超过已投资产的（　）。", "optionA": "80%", "optionB": "50%", "optionC": "20%", "optionD": "10%", "answer": "C", "explanation": "该类基金要求投资于期货和衍生品的持仓合约价值不低于已投资产80%，同时账户权益超过已投资产20%，两个比例不能混淆。", "difficulty": "难"}, {"uid": 50, "id": 50, "subject": "科目一", "chapter": "第二章 基金概述", "stem": "与期货、期权相比，基金交易的典型特征是（　）。", "optionA": "采用保证金交易方式", "optionB": "一般不采用保证金交易方式", "optionC": "实行双向交易", "optionD": "须在合约到期前交割或行权", "answer": "B", "explanation": "基金一般对应具体财产，单向交易，在合同期限内认购并持有，一般不采用保证金；期货期权双向交易、采用保证金并须到期交割或行权。", "difficulty": "中"}, {"uid": 51, "id": 51, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "我国基金法律法规体系中，效力最高的是（　）。", "optionA": "《证券投资基金销售管理办法》", "optionB": "《证券投资基金法》", "optionC": "《公开募集证券投资基金运作管理办法》", "optionD": "《基金从业人员管理规则》", "answer": "B", "explanation": "《证券投资基金法》由全国人大常委会制定，属于法律，效力高于行政法规和部门规章。", "difficulty": "易"}, {"uid": 52, "id": 52, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "我国证券投资基金的监管机构是（　）。", "optionA": "财政部", "optionB": "中国人民银行", "optionC": "中国证监会", "optionD": "中国证券投资基金业协会", "answer": "C", "explanation": "中国证监会依法对证券投资基金活动实施监督管理，基金业协会属于行业自律组织。", "difficulty": "易"}, {"uid": 53, "id": 53, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证券投资基金业协会的性质是（　）。", "optionA": "行业自律组织", "optionB": "政府监管机构", "optionC": "基金销售机构", "optionD": "基金托管机构", "answer": "A", "explanation": "中国证券投资基金业协会是基金行业的自律组织，依法开展行业自律管理。", "difficulty": "易"}, {"uid": 54, "id": 54, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "基金监管的核心目标是（　）。", "optionA": "扩大基金规模", "optionB": "增加基金公司利润", "optionC": "保护投资者合法权益", "optionD": "提高基金收益", "answer": "C", "explanation": "保护投资者合法权益是基金监管的核心目标，也是基金监管工作的出发点和落脚点。", "difficulty": "易"}, {"uid": 55, "id": 55, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "2012年修订的《证券投资基金法》施行时间是（　）。", "optionA": "2012年6月1日", "optionB": "2013年1月1日", "optionC": "2013年6月1日", "optionD": "2014年1月1日", "answer": "C", "explanation": "2012年12月28日修订通过的《证券投资基金法》自2013年6月1日起施行。", "difficulty": "中"}, {"uid": 56, "id": 56, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "下列属于部门规章的是（　）。", "optionA": "《基金业务外包服务指引》", "optionB": "《基金从业人员管理规则》", "optionC": "《证券投资基金法》", "optionD": "《证券投资基金监督管理暂行办法》", "answer": "D", "explanation": "《证券投资基金监督管理暂行办法》由证监会制定，属于部门规章，其余分别为法律和自律规则。", "difficulty": "中"}, {"uid": 57, "id": 57, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "基金监管应遵循的基本原则不包括（　）。", "optionA": "依法监管原则", "optionB": "效率原则", "optionC": "收益最大化原则", "optionD": "公开、公平、公正原则", "answer": "C", "explanation": "基金监管遵循依法监管、三公、效率和审慎监管原则，不以收益最大化为原则。", "difficulty": "中"}, {"uid": 58, "id": 58, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证监会派出机构在基金监管中的主要职责是（　）。", "optionA": "对辖区基金活动进行日常监管", "optionB": "审批基金产品发行规模", "optionC": "制定基金法律", "optionD": "确定基金份额净值", "answer": "A", "explanation": "证监会派出机构负责辖区内基金市场主体的日常监管和现场检查，不制定法律。", "difficulty": "中"}, {"uid": 59, "id": 59, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "关于基金监管与行业自律的关系，下列说法正确的是（　）。", "optionA": "行业自律是政府监管的必要补充", "optionB": "行业自律可以替代政府监管", "optionC": "二者都是政府监管的组成部分", "optionD": "行业自律规则具有法律强制力", "answer": "A", "explanation": "政府监管与行业自律相互补充，行业自律规则主要依靠会员自觉遵守，不具有法律强制力。", "difficulty": "难"}, {"uid": 60, "id": 60, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "商业银行担任基金托管人的，其资格由（　）核准。", "optionA": "中国证监会会同国务院银行业监督管理机构", "optionB": "中国证监会", "optionC": "中国证券投资基金业协会", "optionD": "中国人民银行", "answer": "A", "explanation": "根据《证券投资基金法》，商业银行担任基金托管人的，由证监会会同国务院银行业监督管理机构核准。", "difficulty": "难"}, {"uid": 61, "id": 61, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "我国基金法律法规体系中，由国务院制定的规范性文件属于（　）。", "optionA": "国家法律", "optionB": "自律规则", "optionC": "部门规章", "optionD": "行政法规", "answer": "D", "explanation": "国家法律由全国人大及其常委会制定，行政法规由国务院制定，部门规章由证监会等部委制定，自律规则由行业协会、交易场所制定。", "difficulty": "易"}, {"uid": 62, "id": 62, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证监会制定的公募基金六个方面部门规章与《证券投资基金法》并称为（　）。", "optionA": "一法三规", "optionB": "一法六规", "optionC": "两法六规", "optionD": "一法八规", "answer": "B", "explanation": "六个方面包括管理人经营管理、基金托管、资金募集、投资运作、信息披露和从业人员管理，合称一法六规。", "difficulty": "易"}, {"uid": 63, "id": 63, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "《证券投资基金法》将忠实和谨慎勤勉原则上升到法律高度，从而使下列哪项义务根植于我国基金行业（　）。", "optionA": "信息披露义务", "optionB": "信义义务", "optionC": "适当性义务", "optionD": "反洗钱义务", "answer": "B", "explanation": "证券投资基金法明确基金当事人法律关系、保障基金财产安全独立，并使信义义务根植于基金行业，将忠实和谨慎勤勉上升为法律要求。", "difficulty": "中"}, {"uid": 64, "id": 64, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "基金监管目标中，被称为保护基金投资人合法权益必然要求的是（　）。", "optionA": "提高基金管理人收益", "optionB": "促进基金行业和资本市场健康发展", "optionC": "扩大基金发行规模", "optionD": "规范基金活动", "answer": "D", "explanation": "保护基金投资人合法权益是出发点和首要目标，规范基金活动是其必然要求，促进基金行业和资本市场健康发展是重要目标。", "difficulty": "中"}, {"uid": 65, "id": 65, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "三公原则中，要求监管机构对监管对象公正执法、一视同仁，并且是依法监管原则具体化的是（　）。", "optionA": "公开原则", "optionB": "审慎原则", "optionC": "公正原则", "optionD": "公平原则", "answer": "C", "explanation": "公开强调透明度，公平强调市场主体平等和相同标准，公正强调公正执法、一视同仁，是依法监管原则的具体化。", "difficulty": "中"}, {"uid": 66, "id": 66, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证监会在调查操纵证券市场等重大违法行为时，经批准可以在法定期限内限制当事人证券买卖，该批准主体是（　）。", "optionA": "中国人民银行", "optionB": "国务院金融管理部门", "optionC": "中国证监会主要负责人", "optionD": "中国证监会派出机构负责人", "answer": "C", "explanation": "冻结或者查封涉案财产、限制被调查当事人证券买卖，均须经中国证监会主要负责人批准，派出机构无权自行决定。", "difficulty": "难"}, {"uid": 67, "id": 67, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "下列属于中国证监会对基金违法行为可以采取的行政处罚的是（　）。", "optionA": "没收违法所得", "optionB": "监管谈话", "optionC": "出具警示函", "optionD": "责令改正", "answer": "A", "explanation": "行政处罚包括警告、罚款、没收违法所得、暂停或者撤销基金从业资格；责令改正、监管谈话、出具警示函属于行政监管措施。", "difficulty": "中"}, {"uid": 68, "id": 68, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国人民银行在基金行业监管中主要承担的职责是（　）。", "optionA": "基金产品注册", "optionB": "反洗钱与反恐怖融资", "optionC": "基金托管资格核准", "optionD": "基金从业资格考试组织", "answer": "B", "explanation": "中国人民银行主要承担反洗钱与反恐怖融资职责，包括组织协调、资金监测、监督检查和调查可疑交易；产品注册由证监会负责。", "difficulty": "易"}, {"uid": 69, "id": 69, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证券投资基金业协会会员中，基金服务机构对应的会员类型是（　）。", "optionA": "联席会员", "optionB": "特别会员", "optionC": "普通会员", "optionD": "观察会员", "answer": "A", "explanation": "普通会员为公募基金管理人、托管人和符合条件的私募基金管理人，联席会员为基金服务机构，观察会员为其他私募基金管理人。", "difficulty": "中"}, {"uid": 70, "id": 70, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证券投资基金业协会的社团登记管理机关是（　）。", "optionA": "中国人民银行", "optionB": "国家金融监督管理总局", "optionC": "中华人民共和国民政部", "optionD": "中国证监会", "answer": "C", "explanation": "协会依据证券投资基金法和社团登记管理条例成立，接受中国证监会业务指导，以及社团登记管理机关民政部的监督管理。", "difficulty": "难"}, {"uid": 71, "id": 71, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "我国基金法律法规体系中，效力低于法律、行政法规但数量相对较多的层级是（　）。", "optionA": "自律规则", "optionB": "国家法律", "optionC": "行政法规", "optionD": "部门规章和规范性文件", "answer": "D", "explanation": "部门规章和规范性文件由证监会、中国人民银行等制定，效力低于法律、行政法规，但在基金法律法规体系中数量相对较多。", "difficulty": "中"}, {"uid": 72, "id": 72, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "中国证券业协会的观察员是（　）。", "optionA": "证券公司", "optionB": "公募基金管理公司", "optionC": "证券投资咨询机构", "optionD": "证券交易所", "answer": "B", "explanation": "证券公司为法定会员，证券投资咨询机构等为普通会员，证券交易所等为特别会员，公募基金管理公司为观察员。", "difficulty": "中"}, {"uid": 73, "id": 73, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "证券交易所对涉嫌违法违规的基金交易行为可以采取的措施不包括（　）。", "optionA": "电话提示", "optionB": "罚款", "optionC": "书面警告", "optionD": "约见谈话", "answer": "B", "explanation": "证券交易所可采取电话提示、书面警告、约见谈话、公开谴责等措施，并同时向中国证监会报告；罚款属于行政处罚。", "difficulty": "易"}, {"uid": 74, "id": 74, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "证券交易所在证券市场中的双重身份是（　）。", "optionA": "发行人与投资者", "optionB": "做市商与经纪商", "optionC": "监管者与被监管者", "optionD": "委托人与受托人", "answer": "C", "explanation": "证券交易所作为市场组织者是管理者，具有法定自律管理权限；作为特殊市场主体又要接受证券监管机构监管。", "difficulty": "易"}, {"uid": 75, "id": 75, "subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "stem": "下列不属于其他交易场所的是（　）。", "optionA": "中国银行间市场交易商协会", "optionB": "全国中小企业股份转让系统", "optionC": "中国证券投资基金业协会", "optionD": "期货交易所", "answer": "C", "explanation": "其他交易场所包括银行间市场交易商协会、期货交易所、全国中小企业股份转让系统和区域性股权市场；基金业协会是自律组织。", "difficulty": "易"}, {"uid": 76, "id": 76, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金份额持有人享有的权利不包括（　）。", "optionA": "依法转让或者申请赎回其持有的基金份额", "optionB": "直接决定基金的投资组合", "optionC": "分享基金财产收益", "optionD": "参与分配清算后的剩余基金财产", "answer": "B", "explanation": "基金份额持有人享有收益分配、剩余财产分配、转让赎回等权利，投资决策由管理人负责。", "difficulty": "易"}, {"uid": 77, "id": 77, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金管理人的主要职责是（　）。", "optionA": "保管基金财产", "optionB": "出具基金业绩报告", "optionC": "依法募集基金，办理基金份额的发售和登记", "optionD": "监督基金托管人", "answer": "C", "explanation": "基金管理人负责基金募集、投资运作和日常管理，保管基金财产是托管人的职责。", "difficulty": "易"}, {"uid": 78, "id": 78, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人的主要职责不包括（　）。", "optionA": "办理基金份额的申购、赎回业务", "optionB": "对基金财务会计报告进行复核", "optionC": "监督管理人的投资运作", "optionD": "安全保管基金财产", "answer": "A", "explanation": "办理申购赎回属于管理人或销售、登记机构的职责，托管人负责保管财产、复核核算和监督投资。", "difficulty": "易"}, {"uid": 79, "id": 79, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "下列属于基金服务机构的是（　）。", "optionA": "基金销售机构", "optionB": "基金份额持有人", "optionC": "基金监管机构", "optionD": "基金托管人", "answer": "A", "explanation": "基金服务机构包括销售、支付、份额登记、估值核算、投资顾问、评价等机构，销售机构属于其中。", "difficulty": "易"}, {"uid": 80, "id": 80, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金管理公司的注册资本不得低于（　）。", "optionA": "1亿元人民币", "optionB": "3000万元人民币", "optionC": "5000万元人民币", "optionD": "2亿元人民币", "answer": "A", "explanation": "根据《证券投资基金法》，基金管理人的注册资本不低于1亿元人民币，且必须为实缴货币资本。", "difficulty": "中"}, {"uid": 81, "id": 81, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人由（　）担任。", "optionA": "基金管理公司", "optionB": "依法设立的商业银行或者其他金融机构", "optionC": "基金销售机构", "optionD": "中国证券投资基金业协会", "answer": "B", "explanation": "根据《证券投资基金法》，基金托管人由依法设立的商业银行或者其他金融机构担任。", "difficulty": "中"}, {"uid": 82, "id": 82, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "下列机构中，可以申请基金销售业务资格的是（　）。", "optionA": "中国证券投资基金业协会", "optionB": "证券交易所", "optionC": "基金托管人", "optionD": "商业银行", "answer": "D", "explanation": "商业银行、证券公司、期货公司、保险机构、证券投资咨询机构和独立基金销售机构等可申请基金销售资格。", "difficulty": "中"}, {"uid": 83, "id": 83, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金份额登记机构的主要职责是（　）。", "optionA": "监督基金管理人", "optionB": "保管基金财产", "optionC": "决定基金投资策略", "optionD": "负责基金份额的登记、过户和结算", "answer": "D", "explanation": "基金份额登记机构负责基金份额的登记、过户、结算等业务，保障份额持有人权益。", "difficulty": "中"}, {"uid": 84, "id": 84, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人应当具备的条件不包括（　）。", "optionA": "注册资本不低于10亿元人民币", "optionB": "有安全保管基金财产的条件", "optionC": "设有专门的基金托管部门", "optionD": "取得基金从业资格的专职人员达到法定人数", "answer": "A", "explanation": "《证券投资基金法》规定托管人应设专门托管部门、专职人员达法定人数、有安全保管条件等，未规定注册资本10亿元。", "difficulty": "难"}, {"uid": 85, "id": 85, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人在基金运作中的监督职责主要体现在（　）。", "optionA": "决定基金投资组合", "optionB": "对基金管理人的投资运作进行监督", "optionC": "代替管理人进行投资决策", "optionD": "承担基金投资损失", "answer": "B", "explanation": "托管人发现管理人投资指令违反法律法规或基金合同约定的，应当拒绝执行并及时报告。", "difficulty": "难"}, {"uid": 86, "id": 86, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "关于公募基金管理人的治理结构，下列表述正确的是（　）。", "optionA": "独立董事由总经理决定是否设置", "optionB": "总经理应当为董事会成员", "optionC": "监事会可以越权干预经理层的具体经营活动", "optionD": "董事长可以直接决定经理层的具体经营活动", "answer": "B", "explanation": "公募基金管理人的总经理应为董事会成员；董事会、董事长和监事（会）均不得越权干预经理层具体经营活动，并应建立健全独立董事制度。", "difficulty": "易"}, {"uid": 87, "id": 87, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "公募基金管理人计提风险准备金的来源是（　）。", "optionA": "公司资本公积", "optionB": "基金托管费", "optionC": "基金财产", "optionD": "管理基金的报酬", "answer": "D", "explanation": "风险准备金从管理基金的报酬中计提，专项用于赔偿因违法违规、违反基金合同等给基金财产或持有人造成的损失，不得在基金财产中列支。", "difficulty": "易"}, {"uid": 88, "id": 88, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "下列情形中，中国证监会及其派出机构可以暂停受理、审核公募基金管理人基金产品募集注册申请的是（　）。", "optionA": "净资产低于5000万元", "optionB": "净资产低于2000万元", "optionC": "总负债超过净资产的50%", "optionD": "流动资产低于5000万元", "answer": "A", "explanation": "净资产低于5000万元，或流动资产低于2000万元且低于上一会计年度营业支出时，证监会可暂停受理审核其产品注册申请并限期改善。", "difficulty": "中"}, {"uid": 89, "id": 89, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "私募基金管理人办理登记，实缴货币资本不得低于（　）。", "optionA": "2000万元人民币", "optionB": "5000万元人民币", "optionC": "500万元人民币", "optionD": "1000万元人民币", "answer": "D", "explanation": "私募基金管理人实缴货币资本不低于1000万元人民币或等值可自由兑换货币；专门管理创业投资基金的管理人另有规定的从其规定。", "difficulty": "易"}, {"uid": 90, "id": 90, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "私募基金管理人的法定代表人、执行事务合伙人或其委派代表、负责投资管理的高级管理人员，合计实缴出资不得低于最低实缴资本的（　）。", "optionA": "50%", "optionB": "20%", "optionC": "30%", "optionD": "10%", "answer": "B", "explanation": "上述人员应直接或间接合计持股，合计实缴出资不低于实缴资本或最低实缴资本的20%，即不低于200万元。", "difficulty": "中"}, {"uid": 91, "id": 91, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "私募基金管理人申请登记时，专职员工不得少于（　）。", "optionA": "8人", "optionB": "5人", "optionC": "3人", "optionD": "10人", "answer": "B", "explanation": "私募基金管理人高级管理人员应具备相应专业能力，专职员工不少于5人；集团化私募基金管理人另有规定的，从其规定。", "difficulty": "易"}, {"uid": 92, "id": 92, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "私募基金管理人的控股股东、实际控制人、普通合伙人持有的股权或财产份额，自登记或者变更登记之日起（　）内不得转让。", "optionA": "5年", "optionB": "1年", "optionC": "2年", "optionD": "3年", "answer": "D", "explanation": "相关股权、财产份额或实际控制权自登记或变更登记之日起3年内不得转让，行政划转、同一实际控制人下转让等情形除外。", "difficulty": "中"}, {"uid": 93, "id": 93, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人发现基金管理人的投资指令违反法律、行政法规或者基金合同约定时，应当（　）。", "optionA": "仅通知基金份额持有人大会，不必报告监管部门", "optionB": "自行修改指令后执行", "optionC": "拒绝执行，立即通知基金管理人，并及时向中国证监会报告", "optionD": "先执行指令，事后向基金管理人提出", "answer": "C", "explanation": "托管人负有投资监督职责，对违规投资指令应拒绝执行、立即通知管理人并及时报告证监会；已生效的违规指令也应立即通知并报告。", "difficulty": "中"}, {"uid": 94, "id": 94, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人职责终止后，基金份额持有人大会应当在（　）内选任新基金托管人。", "optionA": "6个月", "optionB": "12个月", "optionC": "1个月", "optionD": "3个月", "answer": "A", "explanation": "托管人职责终止的，基金份额持有人大会应在6个月内选任新托管人；新托管人产生前，由中国证监会指定临时基金托管人。", "difficulty": "中"}, {"uid": 95, "id": 95, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "商业银行申请基金托管资格，净资产不得低于（　）。", "optionA": "100亿元人民币", "optionB": "200亿元人民币", "optionC": "50亿元人民币", "optionD": "20亿元人民币", "answer": "B", "explanation": "申请基金托管资格，净资产不得低于200亿元人民币，风险控制指标应符合监管规定，并设有独立、完整的基金托管部门。", "difficulty": "易"}, {"uid": 96, "id": 96, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管部门拟从事基金清算、核算、投资监督等业务的执业人员不得少于（　），其中核算、监督等核心岗位人员应当具有（　）以上托管业务经验。", "optionA": "8人；2年", "optionB": "10人；3年", "optionC": "8人；3年", "optionD": "5人；1年", "answer": "A", "explanation": "托管部门取得基金从业资格人员不低于部门员工的1/2，执业人员不少于8人；核算、监督等核心岗位人员须有2年以上托管业务经验。", "difficulty": "难"}, {"uid": 97, "id": 97, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金托管人对基金会计凭证、交易记录、合同协议等重要文件档案的保存期限应当不少于（　）。", "optionA": "20年", "optionB": "15年", "optionC": "10年", "optionD": "30年", "answer": "A", "explanation": "托管人应安全保管基金财产，对会计凭证、交易记录、合同协议等重要文件档案保存20年以上；份额登记数据也至少保存20年。", "difficulty": "易"}, {"uid": 98, "id": 98, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "申请注册基金销售业务资格，下列条件表述正确的是（　）。", "optionA": "最近3年没有受到刑事处罚或者重大行政处罚", "optionB": "取得基金从业资格的人员不少于10人", "optionC": "注册资本不低于5000万元人民币", "optionD": "最近3年没有因相近业务被采取重大行政监管措施", "answer": "A", "explanation": "销售资格要求取得基金从业资格人员不少于20人，最近3年无刑事处罚或重大行政处罚，最近1年无重大行政监管措施，注册资本无此要求。", "difficulty": "难"}, {"uid": 99, "id": 99, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "独立基金销售机构的净资产不得低于（　）。", "optionA": "1000万元人民币", "optionB": "1亿元人民币", "optionC": "5000万元人民币", "optionD": "2000万元人民币", "answer": "C", "explanation": "独立基金销售机构应以自有资金出资，净资产不低于5000万元人民币；商业银行等机构适用不同的准入条件。", "difficulty": "易"}, {"uid": 100, "id": 100, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "基金从业人员因离职不再从事基金业务的，所在机构应当在离职情形发生后（　）内办理从业资格注销。", "optionA": "5个工作日", "optionB": "15个工作日", "optionC": "3个工作日", "optionD": "10个工作日", "answer": "A", "explanation": "从业人员因离职、工作调动等不再从事基金业务的，所在机构应在5个工作日内办理从业资格注销，离职后仍负保密义务。", "difficulty": "易"}, {"uid": 101, "id": 101, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "公募基金管理人对高级管理人员、基金经理等关键岗位人员实施绩效薪酬递延支付，递延期限原则上不少于（　），递延支付金额原则上不少于（　）。", "optionA": "1年；20%", "optionB": "3年；40%", "optionC": "2年；30%", "optionD": "5年；50%", "answer": "B", "explanation": "绩效薪酬递延期限不少于3年，递延速度不快于等分比例；高级管理人员、基金经理等关键岗位递延金额原则上不少于40%。", "difficulty": "中"}, {"uid": 102, "id": 102, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "公募基金管理人的总经理因故不能履行职务，公司决定由他人代为履职的，应当自作出决定之日起（　）内报告中国证监会相关派出机构，代为履职时间不得超过（　）。", "optionA": "10个工作日；6个月", "optionB": "3个工作日；3个月", "optionC": "5个工作日；6个月", "optionD": "15个工作日；12个月", "answer": "C", "explanation": "董事长、总经理、督察长等不能履职的，应在15个工作日内决定代履职人员；公司自决定之日起5个工作日内报告，代履职不超过6个月。", "difficulty": "难"}, {"uid": 103, "id": 103, "subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "stem": "公募基金管理人的高级管理人员、主要业务部门负责人，应当将不少于当年绩效薪酬的（　）购买本公司管理的公募基金，其中购买权益类基金不得低于（　）。", "optionA": "20%；50%", "optionB": "30%；50%", "optionC": "20%；30%", "optionD": "30%；80%", "answer": "A", "explanation": "高管和主要业务部门负责人应将不少于当年绩效薪酬20%用于购买本公司公募基金，其中权益类基金不低于50%；基金经理跟投比例不低于30%。", "difficulty": "难"}, {"uid": 104, "id": 104, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金募集期限自基金份额发售之日起不得超过（　）。", "optionA": "2个月", "optionB": "3个月", "optionC": "1个月", "optionD": "6个月", "answer": "B", "explanation": "根据《证券投资基金法》，基金 tem": "基金销售机构在销售基金前，应当了解投资者的（　）。", "optionA": "婚姻状况和子女数量", "optionB": "宗教信仰", "optionC": "投资目标、风险承受能力和投资期限", "optionD": "政治面貌", "answer": "C", "explanation": "销售机构应了解投资者的投资目标、风险承受能力、投资期限等，以进行适当性匹配。", "difficulty": "易"}, {"uid": 126, "id": 126, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "下列不属于基金销售机构的是（　）。", "optionA": "证券公司", "optionB": "独立基金销售机构", "optionC": "中国证券投资基金业协会", "optionD": "商业银行", "answer": "C", "explanation": "基金销售机构包括商业银行、证券公司、期货公司、保险机构、证券投资咨询机构和独立销售机构等。", "difficulty": "易"}, {"uid": 127, "id": 127, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金客户服务的内容一般不包括（　）。", "optionA": "售前服务", "optionB": "售中服务", "optionC": "代替客户进行投资决策", "optionD": "售后服务", "answer": "C", "explanation": "基金客户服务包括售前、售中、售后服务，但不能代替客户作出投资决策。", "difficulty": "易"}, {"uid": 128, "id": 128, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "根据规定，投资者持有基金份额少于7日赎回的，赎回费率不得低于（　）。", "optionA": "2.0%", "optionB": "1.0%", "optionC": "1.5%", "optionD": "0.5%", "answer": "C", "explanation": "根据流动性风险管理规定，持有期少于7日的，赎回费不低于1.5%，且全额计入基金财产。", "difficulty": "中"}, {"uid": 129, "id": 129, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金销售机构对投资者风险承受能力的评估结果通常分为（　）。", "optionA": "盈利型与亏损型", "optionB": "保守型、稳健型、积极型等类型", "optionC": "长期型与短期型", "optionD": "机构型与个人型", "answer": "B", "explanation": "销售机构一般将投资者风险承受能力分为保守型、稳健型、积极型等，与产品风险等级匹配。", "difficulty": "中"}, {"uid": 130, "id": 130, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金销售费用一般不包括（　）。", "optionA": "销售服务费", "optionB": "赎回费", "optionC": "申购费", "optionD": "基金托管费", "answer": "D", "explanation": "申购费、赎回费和销售服务费属于销售费用，托管费属于基金运作费用。", "difficulty": "中"}, {"uid": 131, "id": 131, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金销售机构开展投资者教育的主要内容不包括（　）。", "optionA": "揭示基金投资风险", "optionB": "引导投资者理性投资", "optionC": "普及基金基础知识", "optionD": "宣传基金历史业绩并承诺未来收益", "answer": "D", "explanation": "投资者教育应普及知识、揭示风险、引导理性投资，不得承诺收益或片面宣传业绩。", "difficulty": "中"}, {"uid": 132, "id": 132, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "私募基金募集过程中，投资冷静期自基金合同签署完毕且投资者交纳认购基金款项后起算，不得少于（　）。", "optionA": "72小时", "optionB": "48小时", "optionC": "24小时", "optionD": "12小时", "answer": "C", "explanation": "根据私募基金募集相关规定，投资冷静期不得少于24小时，冷静期届满后募集机构应进行回访。", "difficulty": "难"}, {"uid": 133, "id": 133, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "关于基金销售适当性管理，下列说法正确的是（　）。", "optionA": "销售机构应当将适当的产品销售给适当的投资者", "optionB": "适当性管理只适用于机构投资者", "optionC": "投资者主动要求购买高风险产品时，销售机构无需进行风险提示", "optionD": "销售机构可以向投资者销售风险等级高于其承受能力的产品，无需提示", "answer": "A", "explanation": "适当性管理要求将适当的产品销售给适当的投资者，投资者主动购买高风险产品也应进行风险提示。", "difficulty": "难"}, {"uid": 134, "id": 134, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金管理人应当自收到准予注册文件之日起（　）内进行基金募集；基金募集期限自基金份额发售之日起不得超过（　）。", "optionA": "6个月；3个月", "optionB": "3个月；3个月", "optionC": "12个月；3个月", "optionD": "6个月；6个月", "answer": "A", "explanation": "管理人应自收到准予注册文件之日起6个月内募集，募集期限自份额发售之日起算且不超过3个月；逾期未募且无实质变化的应报备案。", "difficulty": "中"}, {"uid": 135, "id": 135, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "某开放式基金募集期限届满，募集份额2.1亿份，募集金额2.05亿元，基金份额持有人180人。该基金（　）。", "optionA": "不符合生效条件，因基金份额持有人不足200人", "optionB": "不符合生效条件，因募集份额不足2亿份", "optionC": "符合基金合同生效条件，可以办理备案", "optionD": "不符合生效条件，因募集金额不足2亿元", "answer": "A", "explanation": "基金合同生效须同时满足募集份额不少于2亿份、金额不少于2亿元、持有人不少于200人；该基金持有人仅180人，不符合条件。", "difficulty": "中"}, {"uid": 136, "id": 136, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金募集达到规定条件后，关于验资和备案，下列表述正确的是（　）。", "optionA": "中国证监会应当自收到备案材料之日起10个工作日内予以书面确认", "optionB": "基金管理人应当自募集期限届满之日起10日内验资，自收到验资报告之日起10日内提交备案", "optionC": "基金管理人应当自募集期限届满之日起30日内验资并办理备案", "optionD": "基金合同自基金管理人公告之日起生效", "answer": "B", "explanation": "募集期限届满10日内验资，收到验资报告10日内提交证监会办理备案；证监会3个工作日内书面确认，确认之日基金合同生效，次日公告。", "difficulty": "难"}, {"uid": 137, "id": 137, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "开放式基金发生巨额赎回时，基金管理人当日办理的赎回份额不得低于基金总份额的（　），对延期办理部分应当在（　）内通知基金份额持有人。", "optionA": "10%；5个工作日", "optionB": "10%；3个交易日", "optionC": "20%；5个工作日", "optionD": "20%；3个交易日", "answer": "B", "explanation": "巨额赎回指单个开放日净赎回超过基金总份额10%；管理人当日办理不低于10%，其余可延期，并在3个交易日内通知持有人和公告。", "difficulty": "中"}, {"uid": 138, "id": 138, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "基金宣传推介材料登载基金过往业绩时，下列做法符合规定的是（　）。", "optionA": "基金合同生效满3个月即登载该基金完整业绩", "optionB": "基金合同生效不足6个月，不登载该基金过往业绩", "optionC": "只登载业绩较好的季度，不登载业绩比较基准", "optionD": "引用距今超过2年的基金评价结果", "answer": "B", "explanation": "基金合同生效不足6个月的，宣传材料不得登载其过往业绩；登载业绩应同时登载比较基准，评价结果不得引用超过2年的。", "difficulty": "易"}, {"uid": 139, "id": 139, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "下列投资者中，符合私募基金合格投资者标准的是（　）。", "optionA": "金融资产280万元、最近3年年均收入40万元的个人，拟投资120万元", "optionB": "净资产800万元的甲公司，拟投资80万元", "optionC": "金融资产260万元、最近3年年均收入55万元的个人，拟投资100万元", "optionD": "净资产1200万元的乙公司，拟投资50万元", "answer": "C", "explanation": "合格投资者须投资单只私募基金不低于100万元；个人金融资产不低于300万元或近3年年均收入不低于50万元，单位净资产不低于1000万元。", "difficulty": "易"}, {"uid": 140, "id": 140, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "某合伙型私募股权基金现有45名合格投资者，现拟新增投资者。关于该基金投资者人数，下列说法正确的是（　）。", "optionA": "合伙型基金不受投资者人数限制", "optionB": "最多可增至200人", "optionC": "最多可增至100人", "optionD": "最多可增至50人", "answer": "D", "explanation": "合伙型、有限责任公司型私募基金的投资者人数不得超过50人；契约型、股份有限公司型不得超过200人，且投资者均须为合格投资者。", "difficulty": "易"}, {"uid": 141, "id": 141, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "私募基金募集完毕后，基金管理人应当在（　）内向中国证券投资基金业协会办理备案。", "optionA": "5个工作日", "optionB": "30个工作日", "optionC": "20个工作日", "optionD": "10个工作日", "answer": "C", "explanation": "私募基金应在募集完毕后20个工作日内向中基协备案，协会自材料齐备之日起20个工作日内办结；备案前仅可进行规定现金管理。", "difficulty": "中"}, {"uid": 142, "id": 142, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "关于私募证券投资基金业绩报酬的计提，下列表述正确的是（　）。", "optionA": "计提比例不得超过业绩报酬计提基准以上投资收益的60%", "optionB": "可以每月计提一次，无需设置计提间隔", "optionC": "计提比例不得超过基金资产净值的20%", "optionD": "业绩报酬可以优先于投资者本金从基金财产中扣除", "answer": "A", "explanation": "业绩报酬计提比例不得超过业绩报酬计提基准以上投资收益的60%；连续两次计提间隔不应短于6个月，且不得承诺保本保收益。", "difficulty": "难"}, {"uid": 143, "id": 143, "subject": "科目一", "chapter": "第五章 基金活动的法规要求", "stem": "某私募基金合同约定投资冷静期为12小时。该约定（　）。", "optionA": "有效，投资冷静期长短由基金合同自由约定", "optionB": "有效，但募集主体应当在冷静期内主动联系投资者确认", "optionC": "无效，投资冷静期不得少于48小时", "optionD": "无效，投资冷静期不得少于24小时", "answer": "D", "explanation": "基金合同应设置不少于24小时的投资冷静期，冷静期内募集主体不得主动联系投资者；冷静期届满后还须由销售推介以外人员回访。", "difficulty": "中"}, {"uid": 144, "id": 144, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制的目标不包括（　）。", "optionA": "保证公司经营运作遵守法律法规和监管规则", "optionB": "防范和化解经营风险", "optionC": "保证基金投资收益最大化", "optionD": "确保基金和公司财务信息真实、准确、完整", "answer": "C", "explanation": "内部控制的目标是合规经营、防范风险、保证信息真实完整，不包括保证投资收益最大化。", "difficulty": "易"}, {"uid": 145, "id": 145, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制应遵循的原则不包括（　）。", "optionA": "收益最大化原则", "optionB": "有效性原则", "optionC": "健全性原则", "optionD": "独立性原则", "answer": "A", "explanation": "内部控制遵循健全性、有效性、独立性、相互制约和成本效益原则，不以收益最大化为原则。", "difficulty": "易"}, {"uid": 146, "id": 146, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制的基础是（　）。", "optionA": "内部监控", "optionB": "风险评估", "optionC": "控制活动", "optionD": "控制环境", "answer": "D", "explanation": "控制环境是内部控制的基础，包括治理结构、机构设置、权责分配和企业文化等。", "difficulty": "易"}, {"uid": 147, "id": 147, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理公司的督察长由（　）聘任。", "optionA": "董事长", "optionB": "中国证监会", "optionC": "总经理", "optionD": "董事会", "answer": "D", "explanation": "督察长由董事会聘任，对董事会负责，负责监督检查公司及基金运作的合法合规情况。", "difficulty": "易"}, {"uid": 148, "id": 148, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理公司独立董事人数不得少于（　）。", "optionA": "4人", "optionB": "2人", "optionC": "3人", "optionD": "5人", "answer": "C", "explanation": "基金管理公司独立董事不得少于3人，且不得少于董事会人数的三分之一。", "difficulty": "中"}, {"uid": 149, "id": 149, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人设置防火墙制度的主要目的是（　）。", "optionA": "降低基金销售费用", "optionB": "减少人员编制", "optionC": "提高投资收益", "optionD": "防止不同业务之间利益冲突和风险传递", "answer": "D", "explanation": "防火墙制度通过隔离不同业务、部门和人员，防止利益冲突和风险在不同业务间传递。", "difficulty": "中"}, {"uid": 150, "id": 150, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人风险评估的主要内容包括（　）。", "optionA": "仅市场风险", "optionB": "仅合规风险", "optionC": "投资风险、运营风险、合规风险等", "optionD": "仅投资风险", "answer": "C", "explanation": "风险评估应覆盖投资、运营、合规、声誉等各类风险，识别和分析风险发生的可能性和影响。", "difficulty": "中"}, {"uid": 151, "id": 151, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部监控的主要方式不包括（　）。", "optionA": "日常监察稽核", "optionB": "专项检查", "optionC": "定期检查", "optionD": "外部审计", "answer": "D", "explanation": "内部监控通过日常监察稽核、定期检查和专项检查等方式进行，外部审计不属于内部监控。", "difficulty": "中"}, {"uid": 152, "id": 152, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制五要素中，贯穿于内部控制全过程的是（　）。", "optionA": "内部监控", "optionB": "信息与沟通", "optionC": "控制环境", "optionD": "风险评估", "answer": "B", "explanation": "信息与沟通贯穿内部控制全过程，确保内外部信息及时传递，是内控有效运行的纽带。", "difficulty": "难"}, {"uid": 153, "id": 153, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人投资决策的内部控制，下列说法错误的是（　）。", "optionA": "基金经理可以不经授权直接决定超出权限的投资", "optionB": "投资决策应当形成书面记录", "optionC": "投资决策应当有明确的研究支持和决策程序", "optionD": "投资指令应当经过审核后执行", "answer": "A", "explanation": "投资决策应遵循授权和分级管理原则，超出权限的投资须经审批，基金经理不得擅自决定。", "difficulty": "难"}, {"uid": 154, "id": 154, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人的合规管理应当覆盖所有业务、各部门、各分支机构、各层级子公司和全体员工，并贯穿决策、执行、监督、反馈等各个环节。这体现的合规管理基本原则是（　）。", "optionA": "及时性原则", "optionB": "有效性原则", "optionC": "健全性原则", "optionD": "独立性原则", "answer": "C", "explanation": "健全性原则要求合规管理全覆盖、全流程，各级子公司的合规管理纳入统一体系。独立性强调独立于业务经营，有效性强调评估与落实。", "difficulty": "易"}, {"uid": 155, "id": 155, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人合规管理有效性评估，下列说法正确的是（　）。", "optionA": "每3年至少进行1次全面评估，委托外部机构评估的每年1次", "optionB": "仅在发生重大违法违规事件后才需要开展评估", "optionC": "每年至少进行1次全面评估，委托外部专业机构评估的每3年至少1次", "optionD": "评估由各业务部门自行组织，评估结果无需向董事会报告", "answer": "C", "explanation": "合规管理有效性评估每年不得少于1次；公募基金管理人聘请外部专业机构全面评估的，每3年至少1次。A项年限颠倒，B、D项不符合规定。", "difficulty": "难"}, {"uid": 156, "id": 156, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人董事会的合规管理职责，下列说法错误的是（　）。", "optionA": "决定合规负责人的聘任、解聘、考核及薪酬待遇事项", "optionB": "对公司合规管理的有效性承担责任", "optionC": "审议批准合规管理的基本制度和年度合规报告", "optionD": "组织拟定合规管理基本制度并督导实施", "answer": "D", "explanation": "组织拟定合规管理基本制度并督导实施属于合规负责人的职责；董事会负责审议批准基本制度和年度合规报告，并对合规管理有效性承担责任。", "difficulty": "中"}, {"uid": 157, "id": 157, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "对董事、高级管理人员履行合规管理职责的情况进行监督，并对发生重大合规风险负有主要责任的董事提出罢免建议的机构是（　）。", "optionA": "合规部门", "optionB": "风险管理委员会", "optionC": "股东会", "optionD": "监事（会）或审计委员会", "answer": "D", "explanation": "监事（会）或审计委员会负责监督董事和高级管理人员的合规履职情况，对负有主要责任或领导责任者可提出罢免建议，必要时可提议召开临时股东会。", "difficulty": "中"}, {"uid": 158, "id": 158, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人管理层的合规管理职责，下列说法错误的是（　）。", "optionA": "负责落实合规管理目标，对合规运营承担责任", "optionB": "不得越权干预投资、研究、交易等具体业务活动", "optionC": "不得接受任何股东及其实际控制人超越股东会、董事会的指示", "optionD": "可以根据股东要求利用职务之便向股东进行利益输送", "answer": "D", "explanation": "经理层人员不得利用职务之便向股东、本人及他人进行利益输送，并应公平对待所有股东。A、B、C三项均为管理层的合规职责。", "difficulty": "中"}, {"uid": 159, "id": 159, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "对公募基金管理人，合规部门中具备3年以上证券、金融、法律、会计、信息技术等有关领域工作经历的合规管理人员，数量不得低于公司总部人数的（　），且不得少于（　）人。", "optionA": "1.5%；2", "optionB": "2%；3", "optionC": "1.5%；3", "optionD": "3%；2", "answer": "A", "explanation": "合规部门中具备3年以上相关领域工作经历的合规管理人员，不得低于公司总部人数的1.5%，且不得少于2人。B、C、D项比例或人数错误。", "difficulty": "难"}, {"uid": 160, "id": 160, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于公募基金管理人的合规管理考核机制，下列说法错误的是（　）。", "optionA": "合规负责人由董事会负责考核，股东不得越过董事会直接考核", "optionB": "合规性专项考核占高级管理人员和各部门考核结果的比例不得低于15%", "optionC": "合规负责人工作称职的，其年度薪酬收入总额在高管中的排名不得低于中位数", "optionD": "对兼职合规管理人员考核时，合规负责人所占权重不得低于30%", "answer": "D", "explanation": "对兼职合规管理人员考核时，合规负责人所占权重应当超过50%，B项错误。其余三项分别为董事会考核、15%比例和中位数薪酬的规定。", "difficulty": "难"}, {"uid": 161, "id": 161, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于合规审查与合规检查，下列说法正确的是（　）。", "optionA": "合规审查强调事后，合规检查强调事前", "optionB": "合规审查的对象仅限于已经发行并运作的基金产品", "optionC": "合规审查强调事前，合规检查强调事后", "optionD": "两者均属事后监督，可以相互替代", "answer": "C", "explanation": "合规审查强调事前，对制度、重大决策、新产品新业务方案出具书面意见；合规检查强调事后，重点检查独立运作、有效制衡和公平交易。", "difficulty": "中"}, {"uid": 162, "id": 162, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人风险管理的组织架构，下列说法正确的是（　）。", "optionA": "各业务部门对风险管理承担最终责任", "optionB": "风险控制委员会协助管理层开展风险管理工作", "optionC": "风险管理职能部门负责制定公司风险管理战略", "optionD": "董事会对风险管理承担直接责任", "answer": "B", "explanation": "董事会承担最终责任，管理层承担直接责任，风险控制委员会协助管理层；职能部门独立评估、监控、检查和报告，业务部门对自身风险管理有效性负责。", "difficulty": "中"}, {"uid": 163, "id": 163, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "因市场交易量不足，导致不能以合理价格及时进行证券交易，或投资组合无法应付客户赎回要求而产生违约损失。这类风险属于（　）。", "optionA": "市场风险", "optionB": "流动性风险", "optionC": "操作风险", "optionD": "信用风险", "answer": "B", "explanation": "流动性风险包括市场交易量不足导致无法以合理价格及时交易的风险，以及无法应付客户赎回要求的违约风险；信用风险源于发行人违约或交易对手违约。", "difficulty": "易"}, {"uid": 164, "id": 164, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制的具体目标包括合规目标、经营目标和信息目标，其中信息目标要求确保基金和基金管理人的信息（　）。", "optionA": "独立、客观、审慎", "optionB": "全面、简明、易得", "optionC": "公开、公平、公正", "optionD": "真实、准确、完整、及时", "answer": "D", "explanation": "内部控制信息目标要求确保基金和基金管理人的信息真实、准确、完整、及时。B项是证券交易原则，D项是信息披露的部分质量要求。", "difficulty": "易"}, {"uid": 165, "id": 165, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人制定内部控制制度应当遵循的原则是（　）。", "optionA": "全面性原则、独立性原则、权责匹配原则、一致性原则", "optionB": "合法合规性原则、全面性原则、审慎性原则、适时性原则", "optionC": "健全性原则、有效性原则、独立性原则、成本效益原则", "optionD": "合法性原则、制衡性原则、重要性原则、适应性原则", "answer": "B", "explanation": "制定内部控制制度遵循合法合规性、全面性、审慎性、适时性四项原则。A项是内部控制本身的原则，B项是风险管理的原则。", "difficulty": "中"}, {"uid": 166, "id": 166, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "基金管理人内部控制的基本要素包括控制环境、风险评估、控制活动、信息沟通和（　）。", "optionA": "合规审查", "optionB": "压力测试", "optionC": "外部审计", "optionD": "内部监控", "answer": "D", "explanation": "内部控制五要素为控制环境、风险评估、控制活动、信息沟通和内部监控；外部审计、合规审查和压力测试均不属于内部控制的基本要素。", "difficulty": "易"}, {"uid": 167, "id": 167, "subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "stem": "关于基金管理人应当履行的反洗钱义务，下列说法正确的是（　）。", "optionA": "客户身份资料和交易记录自业务关系结束后保存3年即可", "optionB": "仅需对风险等级最高的客户开展身份识别", "optionC": "应当识别客户身份、划分客户风险等级，并将客户身份资料和交易记录至少保存10年", "optionD": "可疑交易是否报告由经办人员自行决定", "answer": "C", "explanation": "反洗钱义务包括客户身份识别、客户风险等级划分、大额和可疑交易报告、资料至少保存10年及保密等，A、B、D三项均不符合规定。", "difficulty": "中"}, {"uid": 168, "id": 168, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金职业道德规范的主要内容不包括（　）。", "optionA": "诚实守信", "optionB": "客户至上", "optionC": "追求利润最大化", "optionD": "守法合规", "answer": "C", "explanation": "基金职业道德规范包括守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。", "difficulty": "易"}, {"uid": 169, "id": 169, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员在执业活动中不得有的行为是（　）。", "optionA": "承诺基金投资收益", "optionB": "按规定进行信息披露", "optionC": "如实介绍基金产品", "optionD": "向投资者充分揭示风险", "answer": "A", "explanation": "基金从业人员不得违规承诺收益或者承担损失，这是诚实守信的基本要求。", "difficulty": "易"}, {"uid": 170, "id": 170, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "客户至上原则要求基金从业人员（　）。", "optionA": "优先考虑公司利益", "optionB": "优先考虑关联方利益", "optionC": "优先考虑个人业绩", "optionD": "始终把客户利益放在首位", "answer": "D", "explanation": "客户至上要求从业人员在处理利益冲突时优先考虑客户利益，不得损害客户合法权益。", "difficulty": "易"}, {"uid": 171, "id": 171, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "保守秘密原则要求基金从业人员（　）。", "optionA": "可以在离职后公开公司机密", "optionB": "不得泄露客户信息和商业秘密", "optionC": "可以向亲友透露客户投资情况", "optionD": "可以将客户资料用于个人投资", "answer": "B", "explanation": "从业人员应保守客户秘密和公司商业秘密，未经授权不得泄露或使用。", "difficulty": "易"}, {"uid": 172, "id": 172, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "专业审慎原则要求基金从业人员（　）。", "optionA": "只关注短期业绩", "optionB": "可以超出能力范围执业", "optionC": "无需持续学习", "optionD": "具备与岗位相适应的专业知识和技能", "answer": "D", "explanation": "专业审慎要求从业人员具备专业胜任能力，持续学习，审慎执业，不得超出能力范围。", "difficulty": "中"}, {"uid": 173, "id": 173, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "守法合规原则要求基金从业人员（　）。", "optionA": "只遵守职业道德", "optionB": "遵守法律法规和行业规范", "optionC": "只遵守公司内部规定", "optionD": "以客户要求为准", "answer": "B", "explanation": "守法合规要求从业人员遵守法律法规、监管规定和行业自律规则，依法执业。", "difficulty": "中"}, {"uid": 174, "id": 174, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "忠诚尽责原则要求基金从业人员（　）。", "optionA": "只对个人负责", "optionB": "可以将客户业务转给他人牟利", "optionC": "可以同时从事与公司竞争的业务", "optionD": "勤勉尽责，维护客户和公司合法权益", "answer": "D", "explanation": "忠诚尽责要求从业人员勤勉履职，不得从事与公司利益冲突的活动，维护客户和公司权益。", "difficulty": "中"}, {"uid": 175, "id": 175, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员遇到利益冲突时，正确的做法是（　）。", "optionA": "向客户披露并按规定处理", "optionB": "让客户自行承担损失", "optionC": "优先考虑个人利益", "optionD": "隐瞒冲突继续交易", "answer": "A", "explanation": "遇到利益冲突应主动披露，按规定回避或处理，不得利用冲突谋取不当利益。", "difficulty": "中"}, {"uid": 176, "id": 176, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "下列行为中，违反基金职业道德的是（　）。", "optionA": "利用内幕信息进行基金投资", "optionB": "如实向投资者披露信息", "optionC": "妥善保管客户资料", "optionD": "按规定进行投资决策", "answer": "A", "explanation": "利用内幕信息交易违反诚实守信和守法合规要求，属于法律禁止的行为。", "difficulty": "难"}, {"uid": 177, "id": 177, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "关于基金职业道德与法律法规的关系，下列说法正确的是（　）。", "optionA": "职业道德可以替代法律", "optionB": "违反职业道德必然构成犯罪", "optionC": "职业道德要求通常高于法律底线，二者相互补充", "optionD": "职业道德与法律完全相同", "answer": "C", "explanation": "职业道德是对从业人员的更高要求，与法律相互补充，违反职业道德不一定构成犯罪。", "difficulty": "难"}, {"uid": 178, "id": 178, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金职业道德建设包括多个方面，下列不属于基金职业道德建设内容的是（　）。", "optionA": "基金职业道德警示教育", "optionB": "基金职业道德立法", "optionC": "基金职业道德宣传", "optionD": "基金职业道德评级", "answer": "D", "explanation": "基金职业道德建设包括立法、监督、教育、宣传、警示和修养六个方面，职业道德评级不在其中。", "difficulty": "易"}, {"uid": 179, "id": 179, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金职业道德修养的自我锤炼包括三个步骤，其正确的顺序是（　）。", "optionA": "参加职业道德实践、树立职业道德观念、领会职业道德规范", "optionB": "树立职业道德观念、领会职业道德规范、参加职业道德实践", "optionC": "树立职业道德观念、参加职业道德实践、领会职业道德规范", "optionD": "领会职业道德规范、树立职业道德观念、参加职业道德实践", "answer": "B", "explanation": "职业道德修养应先树立职业道德观念，再深刻领会职业道德规范，最后积极参加职业道德实践，三者顺序不能颠倒。", "difficulty": "中"}, {"uid": 180, "id": 180, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "守法合规要求基金从业人员遵守的范围，除国家法律、行政法规、部门规章和中国证监会及其派出机构的规范性文件外，还应当包括（　）。", "optionA": "与基金业相关的自律规则及其所属机构的管理规范", "optionB": "仅本公司的内部考核办法", "optionC": "其他从业人员的个人投资计划", "optionD": "社会公众的一般道德评价", "answer": "A", "explanation": "守法合规要求遵守法律法规、部门规章、监管规范性文件，还包括基金业自律规则及其所属机构的管理规范，并配合监管机构监管。", "difficulty": "易"}, {"uid": 181, "id": 181, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员利用因职务便利获取的内幕信息以外的其他未公开信息从事相关交易活动，这种行为属于（　）。", "optionA": "欺诈客户", "optionB": "内幕交易", "optionC": "利用未公开信息交易", "optionD": "操纵市场", "answer": "C", "explanation": "内幕交易利用的是内幕信息；利用职务便利获取的内幕信息以外的其他未公开信息从事交易，属于利用未公开信息交易，两者信息范围不同。", "difficulty": "中"}, {"uid": 182, "id": 182, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "判定某一行为是否构成操纵市场的关键因素是（　）。", "optionA": "交易金额是否巨大", "optionB": "行为人是否实际获利", "optionC": "是否具有误导市场参与者的意图", "optionD": "是否使用多个证券账户", "answer": "C", "explanation": "操纵市场的构成要件包括具有误导市场参与者的意图并实施扭曲价格或交易量的行为，其中误导意图是判定的关键因素。", "difficulty": "易"}, {"uid": 183, "id": 183, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "关于基金从业人员推介基金时的行为，下列说法错误的是（　）。", "optionA": "陈述过往业绩应当客观、全面、准确，并使用来源符合法律法规要求的业绩信息", "optionB": "不得片面夸大过往业绩", "optionC": "可以根据历史业绩预测所推介基金的未来收益", "optionD": "不得违规承诺投资不受损失或保证最低收益", "answer": "C", "explanation": "基金从业人员不得预测所推介基金的未来业绩，C项错误。A、B、D三项均为诚实守信、不得欺诈客户的基本要求。", "difficulty": "难"}, {"uid": 184, "id": 184, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "下列行为中，属于不正当竞争的是（　）。", "optionA": "通过提升投研能力树立品牌形象", "optionB": "在宣传材料中如实提示基金投资风险", "optionC": "为投资者提供规范的账户查询服务", "optionD": "以排挤竞争对手为目的，低于基金销售成本销售基金", "answer": "D", "explanation": "不正当竞争包括以排挤竞争对手为目的压低收费、低于成本销售，以及抽奖、回扣、赠送实物等方式销售基金；A、B、C项属正当经营。", "difficulty": "中"}, {"uid": 185, "id": 185, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员从事相关业务，除通过从业人员资格考试或符合规定的豁免条件外，还须（　）方可执业。", "optionA": "由所在部门负责人口头批准", "optionB": "在中国证券业协会完成备案登记", "optionC": "向中国证监会申请单项行政许可", "optionD": "由所聘用机构向中国证券投资基金业协会申请从业资格注册", "answer": "D", "explanation": "通过考试或符合豁免条件后，还须由所聘用机构向中国证券投资基金业协会申请从业资格注册，方可执业；基金经理任职前还须通过证券投资法律知识考试。", "difficulty": "中"}, {"uid": 186, "id": 186, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员应当按规定完成后续职业培训，每年度不少于（　）学时，其中职业道德方面的培训不少于（　）学时。", "optionA": "10；5", "optionB": "15；5", "optionC": "20；5", "optionD": "15；10", "answer": "B", "explanation": "后续职业培训每年度不少于15学时，其中职业道德方面不少于5学时，内容涵盖法律法规、职业道德和专业技能。", "difficulty": "难"}, {"uid": 187, "id": 187, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "关于客户至上的基本要求，下列说法错误的是（　）。", "optionA": "应当充分识别客户，了解客户的风险承受能力", "optionB": "可以挪用基金份额持有人的交易资金用于临时周转", "optionC": "应当公平对待不同客户", "optionD": "应当重视客户体验，提升服务质量", "answer": "B", "explanation": "基金从业人员不得侵占或者挪用基金份额持有人的交易资金和基金份额，也不得利用基金财产为持有人以外的人牟利。", "difficulty": "易"}, {"uid": 188, "id": 188, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "基金从业人员提出辞职时，符合忠诚尽责要求的做法是（　）。", "optionA": "按合同约定期限提前提出申请，并配合完成工作移交", "optionB": "提交辞职申请后即可停止履行各项职务", "optionC": "离职后不再承担任何保密义务", "optionD": "未完成工作移交即到其他机构任职", "answer": "A", "explanation": "辞职应按合同约定期限提前申请并配合工作移交；未完成移交不得擅自离岗，离职后仍须履行保密、竞业禁止等义务。", "difficulty": "中"}, {"uid": 189, "id": 189, "subject": "科目一", "chapter": "第七章 基金职业道德规范", "stem": "下列情形中，基金从业人员可以披露相关秘密信息的是（　）。", "optionA": "同事询问某客户的持仓明细", "optionB": "离职后接受媒体采访谈及原客户资料", "optionC": "客户信息涉及客户的违法活动", "optionD": "亲友打听公司尚未公开的新产品方案", "answer": "C", "explanation": "保守秘密的例外包括信息涉及客户或潜在客户的违法活动、法律要求披露、客户允许披露。B项属例外情形，其余均属违规泄露。", "difficulty": "易"}, {"uid": 190, "id": 190, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "中国证券投资基金业协会成立于（　）。", "optionA": "2010年", "optionB": "2012年", "optionC": "2013年", "optionD": "2011年", "answer": "B", "explanation": "中国证券投资基金业协会于2012年6月成立，是基金行业的自律组织。", "difficulty": "易"}, {"uid": 191, "id": 191, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金从业人员取得从业资格的基本方式是（　）。", "optionA": "由客户推荐", "optionB": "通过基金从业资格考试", "optionC": "由公司直接任命", "optionD": "由中国证监会审批", "answer": "B", "explanation": "基金从业人员一般应通过基金从业资格考试取得从业资格，并由所在机构办理注册。", "difficulty": "易"}, {"uid": 192, "id": 192, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金从业人员执业注册信息发生变更的，应当（　）。", "optionA": "重新参加考试", "optionB": "及时办理变更手续", "optionC": "自动失效", "optionD": "无需办理任何手续", "answer": "B", "explanation": "从业人员执业注册信息发生变更的，应由所在机构及时办理变更手续。", "difficulty": "易"}, {"uid": 193, "id": 193, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金从业人员每年接受后续职业培训的时间不得少于（　）。", "optionA": "10学时", "optionB": "15学时", "optionC": "5学时", "optionD": "20学时", "answer": "B", "explanation": "基金从业人员每年应完成不少于15学时的后续职业培训，以持续提升专业能力。", "difficulty": "易"}, {"uid": 194, "id": 194, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金从业资格考试成绩的有效期为（　）。", "optionA": "3年", "optionB": "2年", "optionC": "4年", "optionD": "5年", "answer": "C", "explanation": "基金从业资格考试成绩有效期为4年，超过期限需重新考试或按规定补齐培训。", "difficulty": "中"}, {"uid": 195, "id": 195, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "中国证券投资基金业协会的职责不包括（　）。", "optionA": "开展行业培训", "optionB": "制定行业自律规则", "optionC": "组织基金从业资格考试", "optionD": "对违法违规的基金管理人进行行政处罚", "answer": "D", "explanation": "协会负责自律管理、考试培训等，行政处罚权由中国证监会等行政机关行使。", "difficulty": "中"}, {"uid": 196, "id": 196, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金业协会对违反自律规则的会员可以采取的纪律处分不包括（　）。", "optionA": "暂停会员资格", "optionB": "警告", "optionC": "行政拘留", "optionD": "取消会员资格", "answer": "C", "explanation": "协会可采取警告、暂停或取消会员资格等纪律处分，行政拘留属于行政处罚。", "difficulty": "中"}, {"uid": 197, "id": 197, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金从业人员在执业过程中应当（　）。", "optionA": "随意向他人透露客户信息", "optionB": "只追求个人业绩", "optionC": "恪守职业道德，维护行业声誉", "optionD": "夸大基金收益", "answer": "C", "explanation": "从业人员应恪守职业道德，诚实守信、勤勉尽责，维护基金行业声誉。", "difficulty": "中"}, {"uid": 198, "id": 198, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "下列情形中，可能导致基金从业资格被注销的是（　）。", "optionA": "从业人员按规定办理变更注册", "optionB": "从业人员更换工作单位", "optionC": "从业人员被判处刑罚", "optionD": "从业人员参加后续职业培训", "answer": "C", "explanation": "从业人员受到刑事处罚等不符合从业条件情形的，其从业资格应按规定注销。", "difficulty": "难"}, {"uid": 199, "id": 199, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "关于中国证券投资基金业协会会员，下列说法正确的是（　）。", "optionA": "会员只能是基金管理人", "optionB": "会员无需遵守协会自律规则", "optionC": "会员包括基金管理人、基金托管人、销售机构等", "optionD": "会员资格由中国证监会审批", "answer": "C", "explanation": "协会会员包括基金管理人、托管人、销售机构等市场主体，会员应遵守协会自律规则。", "difficulty": "难"}, {"uid": 200, "id": 200, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "反洗钱的三项基本制度不包括（　）。", "optionA": "大额交易和可疑交易报告制度", "optionB": "客户身份识别制度", "optionC": "投资者适当性管理制度", "optionD": "客户身份资料和交易记录保存制度", "answer": "C", "explanation": "反洗钱三项基本制度是客户身份识别、身份资料和交易记录保存、大额和可疑交易报告。", "difficulty": "易"}, {"uid": 201, "id": 201, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "金融机构在与客户建立业务关系时，应当（　）。", "optionA": "核实客户身份并登记基本信息", "optionB": "可以匿名开户", "optionC": "只需记录客户姓名", "optionD": "无需了解客户职业", "answer": "A", "explanation": "金融机构应执行客户身份识别制度，核实客户身份，了解客户职业、资金来源等信息。", "difficulty": "易"}, {"uid": 202, "id": 202, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "根据大额交易报告标准，当日单笔或者累计交易人民币（　）以上的现金收支应当报告。", "optionA": "20万元", "optionB": "1万元", "optionC": "10万元", "optionD": "5万元", "answer": "D", "explanation": "根据大额交易和可疑交易报告管理办法，当日单笔或累计5万元以上现金收支应当报告。", "difficulty": "易"}, {"uid": 203, "id": 203, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "中国证监会投资者服务热线号码是（　）。", "optionA": "12345", "optionB": "12363", "optionC": "12386", "optionD": "12315", "answer": "C", "explanation": "12386是中国证监会投资者服务热线，受理投资者咨询、投诉和建议。", "difficulty": "易"}, {"uid": 204, "id": 204, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "我国《反洗钱法》于2006年10月31日通过，自（　）起施行。", "optionA": "2008年1月1日", "optionB": "2009年1月1日", "optionC": "2007年1月1日", "optionD": "2006年1月1日", "answer": "C", "explanation": "《反洗钱法》于2006年通过，自2007年1月1日起施行，是我国反洗钱领域的基本法律。", "difficulty": "中"}, {"uid": 205, "id": 205, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "金融机构发现可疑交易时，应当（　）。", "optionA": "及时向反洗钱监测分析机构报告", "optionB": "告知客户后再报告", "optionC": "只向本单位负责人报告", "optionD": "自行处理，无需报告", "answer": "A", "explanation": "金融机构发现可疑交易应及时向中国反洗钱监测分析中心报告，不得向客户泄露。", "difficulty": "中"}, {"uid": 206, "id": 206, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "投资者适当性管理的核心要求是（　）。", "optionA": "只向机构投资者销售产品", "optionB": "向所有投资者销售高风险产品", "optionC": "由投资者自行承担全部风险", "optionD": "将适当的产品销售给适当的投资者", "answer": "D", "explanation": "适当性管理要求经营机构了解投资者和产品，将适当的产品销售给适当的投资者。", "difficulty": "中"}, {"uid": 207, "id": 207, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "投资者保护的主要内容包括（　）。", "optionA": "仅风险提示", "optionB": "仅投诉处理", "optionC": "信息披露、适当性管理、投诉处理等", "optionD": "仅信息披露", "answer": "C", "explanation": "投资者保护涵盖信息披露、适当性管理、投资者教育、投诉处理、纠纷解决等多方面内容。", "difficulty": "中"}, {"uid": 208, "id": 208, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "金融机构在反洗钱工作中对依法履行职责获得的信息应当（　）。", "optionA": "可以向客户透露报告内容", "optionB": "可以用于营销推广", "optionC": "严格保密，不得向客户或其他无关人员泄露", "optionD": "可以公开披露", "answer": "C", "explanation": "反洗钱信息依法保密，金融机构及其工作人员不得向客户或其他无关人员泄露。", "difficulty": "难"}, {"uid": 209, "id": 209, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "关于反洗钱与投资者保护的关系，下列说法正确的是（　）。", "optionA": "反洗钱有助于防范金融犯罪，维护投资者合法权益", "optionB": "反洗钱只针对大额交易", "optionC": "反洗钱会增加金融机构成本，与投资者保护无关", "optionD": "反洗钱由基金业协会负责实施", "answer": "A", "explanation": "反洗钱通过防范洗钱和上游犯罪，维护金融秩序，是保护投资者合法权益的重要措施。", "difficulty": "难"}, {"uid": 210, "id": 210, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "中国特色金融文化五要五不中，要稳健审慎对应的是（　）。", "optionA": "不脱实向虚", "optionB": "不急功近利", "optionC": "不逾越底线", "optionD": "不唯利是图", "answer": "B", "explanation": "五要五不为：诚实守信不逾越底线、以义取利不唯利是图、稳健审慎不急功近利、守正创新不脱实向虚、依法合规不胡作非为。", "difficulty": "易"}, {"uid": 211, "id": 211, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "下列表述中，不属于中国特色金融文化五要五不内容的是（　）。", "optionA": "要诚实守信，不逾越底线", "optionB": "要效益优先，不盲目扩张", "optionC": "要守正创新，不脱实向虚", "optionD": "要以义取利，不唯利是图", "answer": "B", "explanation": "五要五不包括诚实守信、以义取利、稳健审慎、守正创新、依法合规五个方面，效益优先不属于其内容。", "difficulty": "易"}, {"uid": 212, "id": 212, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "2019年11月，中国证监会召开证券基金行业文化动员大会，提出加快建设（　）的行业文化。", "optionA": "守法、诚信、专业、创新", "optionB": "规范、透明、开放、有活力", "optionC": "合规、诚信、专业、稳健", "optionD": "合规、诚信、勤勉、稳健", "answer": "C", "explanation": "2019年11月证券基金行业文化动员大会提出加快建设合规、诚信、专业、稳健的行业文化，基金行业系统性文化建设正式启动。", "difficulty": "易"}, {"uid": 213, "id": 213, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "关于基金行业文化建设的重要意义，下列说法不正确的是（　）。", "optionA": "健康良好的行业文化是行稳致远的立身之本", "optionB": "健康良好的行业文化是服务实体经济的内在要求", "optionC": "健康良好的行业文化是资本市场稳定发展的重要保障", "optionD": "健康良好的行业文化是提高基金短期收益的主要手段", "answer": "D", "explanation": "行业文化建设的意义在于立身之本、服务实体经济、保障市场稳定发展、防范金融风险，并不以抬高短期收益为目的。", "difficulty": "易"}, {"uid": 214, "id": 214, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "2023年4月，中国证券投资基金业协会发布的文件是（　）。", "optionA": "《公募基金行业文化建设自律公约》", "optionB": "《证券基金行业文化建设工作纲要》", "optionC": "《公募基金行业文化建设倡议书》", "optionD": "《关于加快推进公募基金行业高质量发展的意见》", "answer": "A", "explanation": "2023年4月协会发布《公募基金行业文化建设自律公约》；高质量发展意见由证监会于2022年4月发布，倡议书在动员大会后发布。", "difficulty": "中"}, {"uid": 215, "id": 215, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金行业服务中国式现代化，要围绕做好五篇大文章找准发力点，下列不属于五篇大文章的是（　）。", "optionA": "科技金融", "optionB": "养老金融", "optionC": "绿色金融", "optionD": "消费金融", "answer": "D", "explanation": "五篇大文章为科技金融、绿色金融、普惠金融、养老金融和数字金融，消费金融不在其列。", "difficulty": "中"}, {"uid": 216, "id": 216, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "对严重违法失信主体在证券期货市场违法失信信息公开查询平台进行专项公示的期限为（　），自公示之日起算。", "optionA": "3年", "optionB": "1年", "optionC": "2年", "optionD": "6个月", "answer": "B", "explanation": "严重违法失信主体的专项公示期为1年，自公示之日起算；公示情形包括被行政处罚、市场禁入、被判处刑罚等。", "difficulty": "难"}, {"uid": 217, "id": 217, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "根据证券期货市场诚信档案管理规定，诚信档案不采集的公民信息是（　）。", "optionA": "承诺与履约信息", "optionB": "监管处罚信息", "optionC": "基因、指纹、血型信息", "optionD": "行政许可信息", "answer": "C", "explanation": "诚信档案不采集公民的宗教信仰、基因、指纹、血型、疾病和病史等信息，也不采集法律法规禁止采集的其他信息。", "difficulty": "难"}, {"uid": 218, "id": 218, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "因证券期货违法行为被行政处罚、市场禁入、刑事处罚和判决承担较大侵权、违约民事赔偿责任的信息，在诚信档案中的效力期限为（　）。", "optionA": "1年", "optionB": "5年", "optionC": "2年", "optionD": "3年", "answer": "B", "explanation": "一般违法失信信息效力期限为3年，上述严重失信信息为5年，均自对违法失信行为的处理决定执行完毕之日起算。", "difficulty": "难"}, {"uid": 219, "id": 219, "subject": "科目一", "chapter": "第八章 基金行业文化建设", "stem": "基金行业文化建设中，基金管理人必须恪守的首要原则是（　）。", "optionA": "信义义务", "optionB": "短期业绩领先", "optionC": "管理规模优先", "optionD": "股东利益最大化", "answer": "A", "explanation": "信义义务要求将客户利益置于优先地位，以诚实守信、勤勉尽责的态度行事，是基金行业建立信任和声誉的基石。", "difficulty": "易"}, {"uid": 1001, "id": 1, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "私募股权投资基金是指以非公开方式向特定对象募集资金，主要投资于（ ）的基金。", "optionA": "大宗商品和外汇", "optionB": "国债和金融债券", "optionC": "公开市场交易的股票", "optionD": "非上市企业股权", "answer": "D", "explanation": "私募股权投资基金以非公开方式募集，主要投资于非上市企业股权，通过上市、并购、回购等方式退出获利。", "difficulty": "易"}, {"uid": 1002, "id": 2, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "关于私募股权投资基金的特点，下列说法错误的是（ ）。", "optionA": "基金份额可以随时申购和赎回", "optionB": "投资期限通常较长，流动性较差", "optionC": "以非公开方式向特定对象募集", "optionD": "通常由专业管理机构进行管理", "answer": "A", "explanation": "私募股权投资基金投资于非上市股权，投资期限长、流动性差，基金份额不能像公募基金那样随时申购赎回。", "difficulty": "易"}, {"uid": 1003, "id": 3, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "一般认为，现代私募股权投资基金的雏形是1946年成立于美国的（ ）。", "optionA": "红杉资本", "optionB": "摩根士丹利公司", "optionC": "高盛公司", "optionD": "美国研究与发展公司（ARD）", "answer": "D", "explanation": "1946年成立的美国研究与发展公司（ARD）被认为是现代私募股权投资基金的雏形，主要投资于中小型企业。", "difficulty": "中"}, {"uid": 1004, "id": 4, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "私募股权投资基金与证券投资基金的主要区别在于（ ）。", "optionA": "前者主要投资非上市企业股权，后者主要投资公开市场证券", "optionB": "前者没有任何投资风险，后者投资风险相对较高", "optionC": "前者只能由商业银行管理，后者只能由基金公司管理", "optionD": "前者可以公开募集资金，后者只能非公开募集资金", "answer": "A", "explanation": "私募股权投资基金主要投资非上市企业股权，证券投资基金主要投资公开市场股票、债券等证券，二者投资对象不同。", "difficulty": "中"}, {"uid": 1005, "id": 5, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "私募股权投资基金在经济发展中的功能不包括（ ）。", "optionA": "推动科技创新和产业升级", "optionB": "优化社会资源配置", "optionC": "为投资者提供无风险的固定收益", "optionD": "促进中小企业融资", "answer": "C", "explanation": "私募股权投资基金属于高风险投资，不承诺保本保收益，为投资者提供无风险固定收益的说法是错误的。", "difficulty": "易"}, {"uid": 1006, "id": 6, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "我国私募股权投资基金行业快速发展的制度背景之一是（ ）。", "optionA": "2001年中国加入世界贸易组织", "optionB": "1998年证券投资基金法颁布实施", "optionC": "2015年股票市场异常波动", "optionD": "2004年中小企业板设立和2009年创业板设立", "answer": "D", "explanation": "2004年深交所设立中小企业板、2009年设立创业板，为私募股权投资基金退出提供了渠道，推动了行业发展。", "difficulty": "中"}, {"uid": 1007, "id": 7, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "私募股权投资基金募集资金应当遵循的原则是（ ）。", "optionA": "通过电视广告进行宣传", "optionB": "非公开方式、面向特定对象", "optionC": "在证券交易所挂牌募集", "optionD": "公开宣传、广泛推介", "answer": "B", "explanation": "私募股权投资基金应以非公开方式向特定对象募集，不得通过公众传播媒体公开宣传推介。", "difficulty": "易"}, {"uid": 1008, "id": 8, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "下列关于私募股权投资基金投资对象的表述，最准确的是（ ）。", "optionA": "仅投资于上市公司公开发行的股票", "optionB": "可投资于初创期、成长期、成熟期等不同阶段的企业股权", "optionC": "仅投资于初创期企业股权", "optionD": "仅投资于成熟期企业股权", "answer": "B", "explanation": "私募股权投资基金覆盖企业不同发展阶段，创业投资基金偏早期，并购基金偏成熟期，投资对象不限于某一阶段。", "difficulty": "难"}, {"uid": 1009, "id": 9, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "关于私募股权投资基金高风险、高收益特征的表述，正确的是（ ）。", "optionA": "通过组合投资和专业化管理分散风险，预期收益较高但可能损失本金", "optionB": "投资风险低于国债，收益稳定可预期", "optionC": "收益固定不变，投资风险由管理人承担", "optionD": "保本保收益，适合所有风险偏好的投资者", "answer": "A", "explanation": "私募股权投资基金通过组合投资和专业化管理分散风险，但投资周期长、不确定性大，预期收益较高且可能损失本金。", "difficulty": "难"}, {"uid": 1010, "id": 10, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "下列关于私募股权投资基金投资期限的说法，正确的是（ ）。", "optionA": "通常为3至7年甚至更长", "optionB": "通常为1年以内", "optionC": "与货币市场基金完全相同", "optionD": "必须每季度开放申购赎回", "answer": "A", "explanation": "私募股权投资基金投资于非上市企业股权，从投资到退出通常需要3至7年甚至更长时间，流动性较差。", "difficulty": "中"}, {"uid": 1011, "id": 11, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "在私募股权投资基金的当事人中，负责安全保管基金财产、监督管理人投资运作的是（　）。", "optionA": "基金销售机构", "optionB": "基金投资者", "optionC": "基金托管人", "optionD": "基金管理人", "answer": "C", "explanation": "基金托管人依据托管协议保管基金财产并监督管理人投资运作；投资者是出资人，管理人是受托投资管理者，销售机构只负责募集环节。", "difficulty": "易"}, {"uid": 1012, "id": 12, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "股权投资基金的下列运作环节，排序正确的是（　）。", "optionA": "设立基金、募集资金、投资项目、退出与清算分配、投后管理", "optionB": "募集资金、设立基金、投资项目、投后管理、退出与清算分配", "optionC": "设立基金、投资项目、募集资金、投后管理、退出与清算分配", "optionD": "募集资金、投资项目、设立基金、投后管理、退出与清算分配", "answer": "B", "explanation": "股权投资基金先向合格投资者募集资金，再完成设立与备案，之后才开展项目投资和投后管理，最后退出并清算分配，顺序不能颠倒。", "difficulty": "易"}, {"uid": 1013, "id": 13, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "我国私募投资基金监管坚持的原则不包括（　）。", "optionA": "底线监管", "optionB": "适度监管", "optionC": "审批监管", "optionD": "分类监管", "answer": "C", "explanation": "私募基金实行登记备案制而非行政审批，监管强调适度监管、底线监管和分类监管；审批监管与备案制改革方向相悖。", "difficulty": "中"}, {"uid": 1014, "id": 14, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "下列机构中，不属于股权投资基金市场服务机构的是（　）。", "optionA": "会计师事务所", "optionB": "基金份额登记机构", "optionC": "基金投资决策委员会", "optionD": "律师事务所", "answer": "C", "explanation": "投资决策委员会是基金内部的投资决策机构，不属于外部市场服务机构；律所、会计师事务所、份额登记机构均为外部服务提供方。", "difficulty": "中"}, {"uid": 1015, "id": 15, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "与一般股权投资基金相比，创业投资基金最突出的特点是（　）。", "optionA": "主要投资于上市公司股票", "optionB": "单笔投资规模大并以并购为主", "optionC": "主要投资于基础设施建设项目", "optionD": "主要投资于早期和成长期未上市企业", "answer": "D", "explanation": "创业投资基金聚焦种子期、初创期和成长期企业，单笔金额较小、项目数量较多；以上市公司股票、大型并购、基建为主的是其他类型基金。", "difficulty": "中"}, {"uid": 1016, "id": 16, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "有限合伙制成为美国股权投资基金主流组织形式，大致兴起于（　）。", "optionA": "20世纪20年代", "optionB": "20世纪70至80年代", "optionC": "20世纪40年代", "optionD": "21世纪初", "answer": "B", "explanation": "1946年ARD被视为现代创业投资鼻祖，但有限合伙制在20世纪70至80年代才因税收与激励安排在美国盛行，成为主流组织形式。", "difficulty": "难"}, {"uid": 1017, "id": 17, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "我国对私募投资基金全面实行登记备案管理始于（　）。", "optionA": "2014年", "optionB": "2004年", "optionC": "2008年", "optionD": "2018年", "answer": "A", "explanation": "2014年中国证券投资基金业协会启动私募基金管理人登记和基金备案，此前私募基金长期处于无统一登记备案状态。", "difficulty": "易"}, {"uid": 1018, "id": 18, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "基金投资者、基金管理人、基金托管人之间的权利义务关系，主要由（　）约定。", "optionA": "公司章程", "optionB": "托管银行内部制度", "optionC": "基金合同", "optionD": "基金业协会自律规则", "answer": "C", "explanation": "三方权利义务由基金合同约定，托管协议是基金合同项下的配套文件；公司章程只适用于公司型基金，自律规则不能替代合同约定。", "difficulty": "易"}, {"uid": 1019, "id": 19, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "关于股权投资基金对经济高质量发展的作用，下列说法错误的是（　）。", "optionA": "主要依靠银行信贷为企业提供资金", "optionB": "推动产业升级和并购重组", "optionC": "提高直接融资比重", "optionD": "支持科技创新和专精特新企业发展", "answer": "A", "explanation": "股权投资基金属于直接融资，以股权方式投入企业；依靠银行信贷属于间接融资，恰是股权基金要弥补的短板，故C项错误。", "difficulty": "中"}, {"uid": 1020, "id": 20, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "从资金来源看，我国股权投资基金呈现的突出特点是（　）。", "optionA": "以人民币基金为主", "optionB": "以外币基金为主", "optionC": "全部为外资背景", "optionD": "全部为政府出资", "answer": "A", "explanation": "我国股权投资基金以人民币基金为主体，外币基金占比较小；政府引导基金只是资金来源之一，不能概括整体结构。", "difficulty": "易"}, {"uid": 1021, "id": 21, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "关于我国股权投资基金的监管体系，下列说法错误的是（　）。", "optionA": "中基协实施登记备案和自律管理", "optionB": "中国证监会及其派出机构依法实施行政监管", "optionC": "中基协有权对违法违规机构作出行政处罚", "optionD": "发改委、央行、外汇局在各自职责范围内监管", "answer": "C", "explanation": "行政处罚权由中国证监会等行政机关行使，中基协只能采取自律管理措施和纪律处分，不能作出行政处罚，故C项错误。", "difficulty": "难"}, {"uid": 1022, "id": 22, "subject": "科目三", "chapter": "第一章 股权投资基金概述", "stem": "股权投资基金参与被投企业经营管理，通常采取的方式是（　）。", "optionA": "派驻董事或观察员、参与重大事项决策", "optionB": "只提供贷款收取固定利息", "optionC": "取代企业管理层负责销售", "optionD": "直接接管企业日常生产经营", "answer": "A", "explanation": "股权基金通过董事席位、观察员、重大事项表决等方式参与治理，不介入日常经营；接管经营或只收固定利息分别属于控股经营和借贷。", "difficulty": "中"}, {"uid": 1023, "id": 23, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "下列主体中，不属于私募股权投资基金参与主体的是（ ）。", "optionA": "基金托管人", "optionB": "基金管理人", "optionC": "证券交易所", "optionD": "基金投资者", "answer": "C", "explanation": "参与主体主要包括投资者、管理人、托管人、销售机构、服务机构以及监管自律机构，证券交易所不是私募股权投资基金的参与主体。", "difficulty": "易"}, {"uid": 1024, "id": 24, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募股权投资基金管理人的主要职责是（ ）。", "optionA": "负责基金募集、投资、管理和退出运作", "optionB": "提供基金份额登记结算服务", "optionC": "对基金行业实施行政监管", "optionD": "安全保管基金财产", "answer": "A", "explanation": "管理人负责基金的产品设计、募集、投资决策、投后管理和退出等运作，是基金的核心参与主体。", "difficulty": "易"}, {"uid": 1025, "id": 25, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募基金托管人的主要职责是（ ）。", "optionA": "负责基金的投资决策", "optionB": "安全保管基金财产并办理清算交割", "optionC": "向投资者推荐基金产品", "optionD": "制定基金的投资策略", "answer": "B", "explanation": "托管人负责安全保管基金财产、办理清算交割、复核审查资产净值等，不参与基金投资决策。", "difficulty": "中"}, {"uid": 1026, "id": 26, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募基金的合格投资者是指（ ）。", "optionA": "仅指金融资产超过1000万元的个人", "optionB": "所有具有民事行为能力的自然人和法人", "optionC": "具备相应风险识别和承担能力、投资于单只私募基金金额不低于100万元的单位和个人", "optionD": "仅指符合标准的机构投资者", "answer": "C", "explanation": "合格投资者应具备相应风险识别和承担能力，单只私募基金投资金额不低于100万元，并符合金融资产或收入标准。", "difficulty": "易"}, {"uid": 1027, "id": 27, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "作为合格投资者的个人，其金融资产不低于（ ）万元，或者最近三年个人年均收入不低于（ ）万元。", "optionA": "500；100", "optionB": "100；30", "optionC": "1000；200", "optionD": "300；50", "answer": "D", "explanation": "根据《私募投资基金监督管理暂行办法》，个人合格投资者金融资产不低于300万元，或最近三年年均收入不低于50万元。", "difficulty": "中"}, {"uid": 1028, "id": 28, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "作为合格投资者的单位，其净资产不低于（ ）万元。", "optionA": "1000", "optionB": "500", "optionC": "100", "optionD": "2000", "answer": "A", "explanation": "单位合格投资者要求净资产不低于1000万元，且投资于单只私募基金的金额不低于100万元。", "difficulty": "中"}, {"uid": 1029, "id": 29, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "契约型私募基金的投资者人数累计不得超过（ ）人。", "optionA": "500", "optionB": "100", "optionC": "200", "optionD": "50", "answer": "C", "explanation": "契约型私募基金投资者人数累计不得超过200人；合伙型、公司型基金还受合伙企业法、公司法的人数约束。", "difficulty": "中"}, {"uid": 1030, "id": 30, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募基金管理人应当向（ ）履行登记手续。", "optionA": "国家市场监督管理总局", "optionB": "中国证券投资基金业协会", "optionC": "中国人民银行", "optionD": "中国证监会", "answer": "B", "explanation": "私募基金管理人应当向中国证券投资基金业协会申请登记，基金募集完毕后还应办理基金备案。", "difficulty": "易"}, {"uid": 1031, "id": 31, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "关于私募基金销售机构，下列说法正确的是（ ）。", "optionA": "销售机构负责基金的投资决策", "optionB": "销售机构可以是未取得资质的个人", "optionC": "任何机构和个人均可销售私募基金", "optionD": "销售机构应取得基金销售业务资格并成为中基协会员", "answer": "D", "explanation": "私募基金销售机构需取得基金销售业务资格，并按规定成为中基协会员，方可接受管理人委托从事募集活动。", "difficulty": "难"}, {"uid": 1032, "id": 32, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "关于私募基金服务机构的表述，错误的是（ ）。", "optionA": "服务机构包括份额登记、估值核算、信息技术系统等机构", "optionB": "服务机构可以代替管理人作出投资决策", "optionC": "服务机构为基金运作提供专业化支持服务", "optionD": "服务机构应当具备相应资质并按规定进行备案", "answer": "B", "explanation": "服务机构提供份额登记、估值核算、信息技术等专业服务，不得代替管理人进行投资决策。", "difficulty": "难"}, {"uid": 1033, "id": 33, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "按照现行监管要求，私募股权投资基金管理人的实缴货币资本不得低于（　）万元。", "optionA": "1000", "optionB": "100", "optionC": "5000", "optionD": "500", "answer": "A", "explanation": "管理人须实缴货币资本不低于1000万元，且应为货币出资；100万元是合格投资者单只基金的最低投资额，容易混淆。", "difficulty": "易"}, {"uid": 1034, "id": 34, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募股权投资基金管理人的合规风控负责人，应当具备的相关工作经验不少于（　）年。", "optionA": "2", "optionB": "5", "optionC": "3", "optionD": "1", "answer": "C", "explanation": "合规风控负责人应具备3年以上相关经验，且不得兼任投资业务；这是管理人登记中对高级管理人员的硬性要求之一。", "difficulty": "难"}, {"uid": 1035, "id": 35, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "下列各项中，不属于私募股权投资基金管理人基本经营要求的是（　）。", "optionA": "建立完善的内部控制和风险管理制度", "optionB": "有固定的经营场所", "optionC": "取得金融业务许可证", "optionD": "实缴货币资本不低于1000万元", "answer": "C", "explanation": "私募基金管理人实行登记制，不需取得金融业务许可证；实缴资本、经营场所、人员配置和内控风控制度才是基本要求。", "difficulty": "中"}, {"uid": 1036, "id": 36, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募股权投资基金管理人的实际控制人发生变更时，应当（　）。", "optionA": "在基金清算时一并说明", "optionB": "及时向中基协履行变更登记", "optionC": "只需通知托管人", "optionD": "无需处理，不影响展业", "answer": "B", "explanation": "控股股东、实际控制人、法定代表人等重大事项变更须及时办理变更登记，未按规定变更可能被暂停产品备案。", "difficulty": "易"}, {"uid": 1037, "id": 37, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "下列管理人的行为中，体现勤勉义务要求的是（　）。", "optionA": "对拟投项目开展充分尽职调查并持续跟踪", "optionB": "由基金经理个人决定全部投资", "optionC": "向部分投资者优先披露信息", "optionD": "将基金财产用于关联方资金周转", "answer": "A", "explanation": "勤勉义务要求管理人专业审慎、勤勉尽责，尽调和持续监督是典型体现；挪用财产、选择性披露、个人专断均属违规。", "difficulty": "中"}, {"uid": 1038, "id": 38, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "下列行为中，违反管理人忠实义务的是（　）。", "optionA": "聘请会计师事务所审计基金", "optionB": "按约定向投资者分配收益", "optionC": "利用基金财产为关联方提供担保", "optionD": "按合同约定收取管理费", "answer": "C", "explanation": "忠实义务要求不得利用基金财产为关联方谋利、不得自我交易；收取管理费、分配收益、审计均属正常履职行为。", "difficulty": "中"}, {"uid": 1039, "id": 39, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "合伙制私募股权投资基金管理人的治理架构通常为（　）。", "optionA": "股东会、董事会、经理层、监事会", "optionB": "合伙人会议、执行事务合伙人、投资决策委员会", "optionC": "股东大会、托管人、份额登记机构", "optionD": "会员大会、理事会、专业委员会", "answer": "B", "explanation": "合伙制管理人由合伙人会议决定重大事项，执行事务合伙人负责执行，投资决策委员会负责投资决策；A项是公司制架构。", "difficulty": "难"}, {"uid": 1040, "id": 40, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "投资决策委员会审议与委员存在关联关系的项目时，通常应当（　）。", "optionA": "该委员回避表决", "optionB": "暂停该项目审议", "optionC": "由该委员一票决定", "optionD": "由管理人法定代表人代为表决", "answer": "A", "explanation": "投决会实行集体决策并建立回避制度，关联委员应回避，防止利益冲突；由他人代为表决或一人决定都违背制衡原则。", "difficulty": "中"}, {"uid": 1041, "id": 41, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募股权投资基金管理人常用的激励机制是（　）。", "optionA": "仅按管理规模提取管理费", "optionB": "由投资者直接发放奖金", "optionC": "固定工资加行政级别晋升", "optionD": "管理费加业绩报酬", "answer": "D", "explanation": "行业普遍采用管理费维持运营、业绩报酬即Carry分享超额收益，并辅以跟投、递延支付等安排；只按规模收费缺乏激励。", "difficulty": "易"}, {"uid": 1042, "id": 42, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "关于私募股权投资基金管理人从业人员的兼职，下列说法正确的是（　）。", "optionA": "可以在任何第三方机构兼职", "optionB": "不得在与本机构存在利益冲突的机构兼职", "optionC": "兼职无需申报", "optionD": "经同事同意即可兼职", "answer": "B", "explanation": "从业人员不得在冲突机构兼职，兼职情况应如实申报并接受管理；利益冲突会直接影响忠实义务的履行。", "difficulty": "易"}, {"uid": 1043, "id": 43, "subject": "科目三", "chapter": "第二章 股权投资基金管理人", "stem": "私募股权投资基金管理人应当对每只基金单独建账、独立核算，其主要目的是（　）。", "optionA": "提高管理费收取比例", "optionB": "规避投资者人数限制", "optionC": "保证基金财产独立、防止混同", "optionD": "便于合并纳税"
