<script>
const POINTS = [{"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 3, "title": "金融市场构成要素", "body": "交易主体、交易对象（金融工具）、交易价格、交易场所与组织方式；交易对象是市场交易活动的载体。", "id": "科目一|第一章 金融市场与资产管理|0"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 3, "title": "按期限分类", "body": "期限 ≤1 年为货币市场（同业拆借、票据、回购、大额可转让存单），>1 年为资本市场（股票、中长期债券、基金）。", "id": "科目一|第一章 金融市场与资产管理|1"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "按发行与流通分类", "body": "一级市场（发行市场，资金由投资者流向发行人）、二级市场（流通市场，为一级市场提供流动性）。", "id": "科目一|第一章 金融市场与资产管理|2"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "其他分类", "body": "按交割方式分现货/衍生品市场；按地域分国内/国际；按场所分场内（交易所）/场外（OTC、柜台）。", "id": "科目一|第一章 金融市场与资产管理|3"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 3, "title": "金融市场最基本功能是资金融通；另有价格发现、风险管理、信息传递、资源配置功能（命题常把「最基本」替换成其他功能做干扰项）。", "body": "", "id": "科目一|第一章 金融市场与资产管理|4"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "直接融资与间接融资", "body": "直接融资是资金供求双方直接形成债权/股权关系（股票、债券）；间接融资经金融中介（银行信贷），中介机构承担信用风险。", "id": "科目一|第一章 金融市场与资产管理|5"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 3, "title": "资产管理概念", "body": "金融机构接受投资者委托，对受托财产进行投资和管理的金融服务；本质是「受人之托、代人理财」，管理人收取管理费、不承担投资风险（卖者尽责、买者自负）。", "id": "科目一|第一章 金融市场与资产管理|6"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 3, "title": "资管新规（2018 年）核心要求", "body": "打破刚性兑付、禁止资金池、去除多层嵌套与通道、实行净值化管理、统一同类资管产品监管标准。", "id": "科目一|第一章 金融市场与资产管理|7"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "资管产品按投资性质分类（80% 标准）", "body": "固定收益类（债权类资产 ≥80%）、权益类（权益类资产 ≥80%）、商品及金融衍生品类（≥80%）、混合类（均未达 80%）。", "id": "科目一|第一章 金融市场与资产管理|8"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "我国资管行业主体", "body": "银行理财、信托计划、公募基金、私募基金、证券公司资管、保险资管、期货资管。", "id": "科目一|第一章 金融市场与资产管理|9"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 1, "title": "我国资产管理行业发展历程", "body": "起步于 20 世纪 90 年代末，2012 年后「大资管」扩张，2018 年资管新规后回归本源、通道业务压降（具体规模数字随年份变化，命题避免用绝对规模）。", "id": "科目一|第一章 金融市场与资产管理|10"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "金融市场地位", "body": "是货币政策传导的重要渠道，也是资源配置和风险定价的基础平台。", "id": "科目一|第一章 金融市场与资产管理|11"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "货币市场工具特征", "body": "期限短（≤1 年）、流动性强、风险低、收益相对稳定。", "id": "科目一|第一章 金融市场与资产管理|12"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 1, "title": "资本市场功能", "body": "为企业和政府提供长期资金，为投资者提供长期投资工具，促进资本形成。", "id": "科目一|第一章 金融市场与资产管理|13"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "居民理财需求驱动资管发展", "body": "居民财富增长、存款利率下行、养老第三支柱建设是行业长期增长逻辑。", "id": "科目一|第一章 金融市场与资产管理|14"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 1, "title": "资产管理 vs 银行存款", "body": "资管产品不保本保收益、不纳入存款保险、风险由投资者承担；存款受存款保险保障（同一银行本息 50 万元以内）。", "id": "科目一|第一章 金融市场与资产管理|15"}, {"subject": "科目一", "chapter": "第一章 金融市场与资产管理", "weight": 2, "title": "资产管理人受托责任", "body": "履行忠实义务与勤勉义务，不得将受托财产与其固有财产混同，不得侵占、挪用受托财产。", "id": "科目一|第一章 金融市场与资产管理|16"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "基金含义", "body": "通过发售基金份额/基金单位，将众多投资者的资金集中起来，由基金托管人托管、基金管理人管理，以投资组合方式进行证券投资的一种利益共享、风险共担的集合投资方式。", "id": "科目一|第二章 基金概述|17"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "基金特点", "body": "集合理财、专业管理；组合投资、分散风险；利益共享、风险共担；严格监管、信息透明；独立托管、保障安全。", "id": "科目一|第二章 基金概述|18"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "基金与股票、债券比较", "body": "基金是间接投资工具（投资者不直接持有底层证券），股票/债券是直接投资工具；基金风险收益介于债券与股票之间（按类型不同）。", "id": "科目一|第二章 基金概述|19"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "基金与信托比较", "body": "两者均为受托理财，但基金受《证券投资基金法》专门规范、以投资组合方式运作、有强制托管与信息披露要求；信托计划适用《信托法》，投资范围更广。", "id": "科目一|第二章 基金概述|20"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "基金运作环节顺序", "body": "产品设计与注册（备案）→ 募集 → 基金合同生效 → 投资运作 → 信息披露 → 终止与清算。", "id": "科目一|第二章 基金概述|21"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "基金运作三方关系", "body": "基金份额持有人（委托人/受益人）、基金管理人（受托人，负责投资管理）、基金托管人（保管人，负责财产保管与监督），三者相互制衡。", "id": "科目一|第二章 基金概述|22"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "基金市场参与主体", "body": "基金管理人、基金托管人、基金销售机构、基金服务机构（份额登记、估值核算、投资顾问、评级、信息技术系统等）、自律组织与监管机构。", "id": "科目一|第二章 基金概述|23"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "我国公募基金发展关键节点", "body": "1998 年首批封闭式基金成立（基金开元、基金金泰）；2001 年首只开放式基金（华安创新）；2013 年余额宝推动互联网基金；2018 年养老目标基金落地；2023 年公募基金费率改革。", "id": "科目一|第二章 基金概述|24"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "我国私募基金发展", "body": "起源于 20 世纪 80—90 年代创业投资，2004 年后阳光私募兴起，2013 年《基金法》将非公开募集基金纳入调整，2014 年起实行登记备案。", "id": "科目一|第二章 基金概述|25"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 3, "title": "私募资产管理计划", "body": "证券公司、基金公司、期货公司等证券期货经营机构非公开募集、接受单一/多个客户委托的资产管理产品，适用《证券期货经营机构私募资产管理业务管理办法》。", "id": "科目一|第二章 基金概述|26"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "公募基金的作用", "body": "服务居民财富管理、优化资源配置、支持实体经济和科技创新、完善社会保障体系（养老金第三支柱）。", "id": "科目一|第二章 基金概述|27"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "私募基金的作用", "body": "支持创新创业和中小企业发展、促进直接融资比重提升、服务产业升级与并购重组。", "id": "科目一|第二章 基金概述|28"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "基金与银行理财的区别", "body": "公募基金由持牌基金管理人管理、强制托管、每日估值披露净值；银行理财由理财子公司发行，投资范围与估值方式另有规则。", "id": "科目一|第二章 基金概述|29"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 1, "title": "基金财产的独立性", "body": "基金财产独立于管理人、托管人的固有财产，管理人/托管人解散、被撤销或破产清算时，基金财产不属于其清算财产。", "id": "科目一|第二章 基金概述|30"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 2, "title": "基金份额持有人权利", "body": "分享基金收益、参与分配清算后剩余财产、转让/赎回份额、查阅或复制公开披露信息、按规定召集或参加持有人大会并表决。", "id": "科目一|第二章 基金概述|31"}, {"subject": "科目一", "chapter": "第二章 基金概述", "weight": 1, "title": "基金的金融工具属性", "body": "基金份额是有价证券，可在依法设立的场所交易或按合同约定申购赎回。", "id": "科目一|第二章 基金概述|32"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "法律法规体系层级（由高到低）", "body": "法律 → 行政法规 → 部门规章 → 规范性文件 → 自律规则；下位法不得与上位法抵触。", "id": "科目一|第三章 基金法律法规体系和监管体系|33"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "法律层", "body": "全国人大及其常委会制定，包括《证券投资基金法》《信托法》《证券法》《公司法》《合伙企业法》《反洗钱法》。", "id": "科目一|第三章 基金法律法规体系和监管体系|34"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "行政法规层", "body": "《私募投资基金监督管理条例》（国务院令第 762 号，2023 年 9 月 1 日施行），是私募基金监管的第一部行政法规。", "id": "科目一|第三章 基金法律法规体系和监管体系|35"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "部门规章层", "body": "证监会制定，如《公开募集证券投资基金管理人监督管理办法》《公开募集证券投资基金运作管理办法》《证券投资基金托管业务管理办法》《公开募集证券投资基金信息披露管理办法》《证券期货投资者适当性管理办法》。", "id": "科目一|第三章 基金法律法规体系和监管体系|36"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "规范性文件层", "body": "证监会公告、通知、指引等，如《关于加强私募投资基金监管的若干规定》（证监会公告〔2020〕71 号）。", "id": "科目一|第三章 基金法律法规体系和监管体系|37"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "自律规则层", "body": "中基协章程、办法、指引、细则，如《私募投资基金登记备案办法》（中基协发〔2023〕5 号）及配套登记指引 1—3 号、备案指引 1—2 号。", "id": "科目一|第三章 基金法律法规体系和监管体系|38"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "《证券投资基金法》", "body": "2012 年 12 月 28 日修订通过，2013 年 6 月 1 日施行；2015 年 4 月 24 日修正。确立基金合同、管理人/托管人资格、募集、运作、信息披露、持有人权利、监管与法律责任等基本制度。", "id": "科目一|第三章 基金法律法规体系和监管体系|39"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "基金监管目标", "body": "保护基金投资者合法权益（核心目标）、防范和化解基金市场风险、促进基金业和资本市场健康发展。", "id": "科目一|第三章 基金法律法规体系和监管体系|40"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "基金监管原则", "body": "依法监管、公开公平公正（「三公」）、审慎监管、诚信监管；监管与自律相结合。", "id": "科目一|第三章 基金法律法规体系和监管体系|41"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "中国证监会职责", "body": "制定基金业规章规则；办理基金产品注册；核准管理人/托管人资格；监管基金募集、交易、投资运作与信息披露；查处违法违规；管理从业人员资格。", "id": "科目一|第三章 基金法律法规体系和监管体系|42"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "中国人民银行职责", "body": "反洗钱监督管理、支付清算、征信管理、金融控股公司监管；国家外汇管理局负责跨境资金流动、QDII 额度与外汇登记管理。", "id": "科目一|第三章 基金法律法规体系和监管体系|43"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "中国证券投资基金业协会", "body": "2012 年 6 月成立，社会团体法人，实行会员制，是基金行业的自律组织；职责包括登记备案、制定自律规则、从业资格管理、自律检查与纪律处分、纠纷调解、行业培训。", "id": "科目一|第三章 基金法律法规体系和监管体系|44"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "中国证券业协会", "body": "证券公司的自律组织，对证券公司资产管理、基金销售等业务实施自律管理。", "id": "科目一|第三章 基金法律法规体系和监管体系|45"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "交易场所自律管理", "body": "上海证券交易所（1990 年 11 月）、深圳证券交易所（1990 年 12 月）、北京证券交易所（2021 年 9 月）对基金上市交易、信息披露实施自律监管。", "id": "科目一|第三章 基金法律法规体系和监管体系|46"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 3, "title": "监管措施与行政处罚种类", "body": "责令改正、监管谈话、出具警示函、暂停业务、撤销资格、罚款、没收违法所得、市场禁入；情节严重构成犯罪的移送司法机关。", "id": "科目一|第三章 基金法律法规体系和监管体系|47"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "《基金法》法律责任中的罚款幅度", "body": "有违法所得的，没收违法所得并处违法所得 1 倍以上 5 倍以下罚款；没有违法所得或违法所得不足一定金额的，处 10 万元以上 100 万元以下罚款（具体条款以现行法条为准）。", "id": "科目一|第三章 基金法律法规体系和监管体系|48"}, {"subject": "科目一", "chapter": "第三章 基金法律法规体系和监管体系", "weight": 2, "title": "投资者保护机制", "body": "基金份额持有人大会、信息披露、销售适当性、投诉处理、纠纷调解与仲裁/诉讼。", "id": "科目一|第三章 基金法律法规体系和监管体系|49"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "公募基金管理人准入", "body": "经中国证监会批准设立，注册资本不低于 1 亿元人民币（实缴货币资本），主要股东具有良好财务状况与合规记录（具体净资产门槛待核）。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|50"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "公募基金管理人退出情形", "body": "解散、被撤销、被接管、破产，或不再符合持续经营条件；应依法处理存量基金业务、履行清算或转让程序。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|51"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "公募基金管理人法定职责", "body": "依法募集基金、办理基金注册/备案、管理基金财产、进行会计核算与估值、编制并披露信息、召集基金份额持有人大会、保存业务记录。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|52"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "基金管理人治理结构", "body": "股东会、董事会（可设审计委员会替代监事会）、监事会/监事、经理层、督察长；督察长负责合规与监督检查，独立行使职权。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|53"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "风险准备金制度", "body": "基金管理人应按月从基金管理费收入中计提风险准备金，专项用于赔偿因管理人违法违规、违反基金合同给基金财产或投资者造成的损失（计提比例与余额上限以现行规章为准，待核）。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|54"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "公募基金管理人财务指标", "body": "持续满足净资产、净资本、流动性等审慎经营要求，具体指标随《公开募集证券投资基金管理人监督管理办法》及配套规则执行（待核）。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|55"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "私募基金管理人登记", "body": "应向中基协登记；实缴货币资本不低于 1000 万元人民币或等值可自由兑换货币（专门管理创投基金的另有规定）；法定代表人、高管、执行事务合伙人或其委派代表应持股且合计实缴出资不低于最低实缴资本的 20%。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|56"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "私募管理人高管要求", "body": "合规风控负责人应具有 3 年以上投资相关的法律、会计、审计、监察、稽核或资产管理行业合规、风控、监管、自律管理等工作经验；不得在冲突机构兼职。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|57"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "私募管理人登记后义务", "body": "登记后应在规定期限内备案首只私募基金（6 个月内，待核），逾期未备案可能被注销登记；持续报送信息、重大事项变更须及时更新。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|58"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "私募基金管理人注销", "body": "主动注销、协会注销（失联、异常经营、不再符合登记要求）、强制注销；注销后不得继续展业，存量基金应妥善处置。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|59"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "基金托管人准入", "body": "商业银行申请托管资格，最近 3 个会计年度年末净资产均不低于 20 亿元人民币，资本充足率等符合监管要求；证券公司等机构另有规定；由中国证监会核准。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|60"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "基金托管人法定职责", "body": "安全保管基金财产；复核基金资产净值与份额净值；监督基金管理人的投资运作（发现违规拒绝执行并报告）；办理清算交割；出具托管报告；召集或配合召集持有人大会。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|61"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "托管人职责终止情形", "body": "解散、被撤销、被接管、破产、丧失托管资格、基金合同约定的其他情形；应妥善保管资料并配合新托管人交接（交接期限待核）。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|62"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "基金服务机构", "body": "基金销售机构、份额登记机构、估值核算机构、投资顾问机构、评级机构、信息技术系统服务机构；应具备相应资质、业务规范与内控。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|63"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "基金从业人员任职与执业", "body": "通过基金从业资格考试（科目一 + 科目二或科目三）、由机构办理执业注册后方可执业；离职应由机构办理注销；不得同时在两个以上机构执业。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|64"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "基金从业人员执业规范", "body": "诚实守信、勤勉尽责、专业胜任、保守秘密、避免利益冲突、不得利用职务便利牟取不正当利益。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|65"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "基金经理任职要求", "body": "具有基金从业资格、一定年限证券/基金投资研究经历、无重大违法违规记录（具体年限待核），并按规定办理注册与变更。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|66"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "廉洁从业要求", "body": "不得商业贿赂、不得利益输送、不得违规兼职或经商办企业、不得利用未公开信息交易、不得违规接受礼品礼金宴请、不得损害投资者和机构利益。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|67"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 3, "title": "贪污贿赂类罪名", "body": "贪污罪、受贿罪、行贿罪、单位行贿罪、利用影响力受贿罪、对有影响力的人行贿罪；构成要件围绕「利用职务便利」「谋取利益」「非法收受/给予财物」。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|68"}, {"subject": "科目一", "chapter": "第四章 基金市场参与主体及其从业人员的法规要求", "weight": 2, "title": "《中国共产党廉洁自律准则》", "body": "坚持公私分明、崇廉拒腐、尚俭戒奢、甘于奉献（党员廉洁自律规范）；党员领导干部还要廉洁从政、廉洁用权、廉洁修身、廉洁齐家。", "id": "科目一|第四章 基金市场参与主体及其从业人员的法规要求|69"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金产品注册", "body": "公募基金实行注册制，由基金管理人向中国证监会申请注册；未经注册不得发售。", "id": "科目一|第五章 基金活动的法规要求|70"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金分类", "body": "按运作方式分封闭式/开放式；按投资对象分股票基金（股票资产 ≥80%）、债券基金（债券资产 ≥80%）、混合基金、货币市场基金、基金中基金（投资于其他基金 ≥80%）、QDII 基金、REITs。", "id": "科目一|第五章 基金活动的法规要求|71"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金募集期限", "body": "自基金份额发售之日起不得超过 3 个月。", "id": "科目一|第五章 基金活动的法规要求|72"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "基金合同生效条件", "body": "募集份额总额不少于 2 亿份、募集金额不少于 2 亿元人民币、基金份额持有人不少于 200 人；满足条件后向证监会办理备案，基金合同生效。", "id": "科目一|第五章 基金活动的法规要求|73"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 2, "title": "募集失败的处理", "body": "募集期限届满未达生效条件，管理人应承担募集费用和债务，并在规定期限内返还投资者已缴纳款项及同期银行存款利息（返还期限待核）。", "id": "科目一|第五章 基金活动的法规要求|74"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "申购赎回基本规则", "body": "采用「未知价法」，以申请当日收市后计算的份额净值为基础；T 日申请、T+1 日确认；金额申购、份额赎回。", "id": "科目一|第五章 基金活动的法规要求|75"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "巨额赎回", "body": "单个开放日净赎回申请超过基金总份额 10% 即为巨额赎回；管理人可选择全额赎回或部分延期赎回，延期部分在后续开放日办理。", "id": "科目一|第五章 基金活动的法规要求|76"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "短期赎回费", "body": "持续持有期少于 7 日的投资者，收取不低于 1.5% 的赎回费，并全额计入基金财产。", "id": "科目一|第五章 基金活动的法规要求|77"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 2, "title": "基金销售业务规范", "body": "销售机构应取得相应资格；宣传推介材料应真实、准确、完整，不得承诺收益、不得片面强调业绩、不得诋毁同行；材料报备要求待核。", "id": "科目一|第五章 基金活动的法规要求|78"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "投资者适当性", "body": "投资者分普通投资者与专业投资者；基金产品/服务按风险由低到高分 R1—R5 五级；投资者风险承受能力与产品风险等级应匹配，不匹配时需特别警示并由投资者签署确认书；风险承受能力最低类别投资者不得购买高风险产品。", "id": "科目一|第五章 基金活动的法规要求|79"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金投资「双十」限制", "body": "一只基金持有一家公司发行的证券，其市值不超过基金资产净值的 10%；同一基金管理人管理的全部基金持有一家公司发行的证券，不超过该证券的 10%。", "id": "科目一|第五章 基金活动的法规要求|80"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 2, "title": "公募基金投资禁止行为", "body": "不得承销证券、不得违规向他人贷款或提供担保、不得从事承担无限责任的投资、不得买卖其他基金份额（另有规定除外）、不得进行内幕交易与操纵市场。", "id": "科目一|第五章 基金活动的法规要求|81"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金信息披露时限", "body": "季度报告在季度结束之日起 15 个工作日内披露；半年度报告在半年结束之日起 60 日内披露；年度报告在年度结束之日起 90 日内披露；重大事件自发生之日起 2 日内披露。", "id": "科目一|第五章 基金活动的法规要求|82"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "公募基金终止与清算", "body": "连续 60 个工作日出现基金资产净值低于 5000 万元或基金份额持有人数量不满 200 人的，管理人应向证监会报告并提出解决方案（清盘、合并、转型等）；终止后组织清算组清算并公告。", "id": "科目一|第五章 基金活动的法规要求|83"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "私募资产管理计划", "body": "合格投资者投资单只产品金额不低于 100 万元；投资者人数不超过 200 人；分级比例上限为固定收益类 3:1、权益类 1:1、混合类 2:1、商品及金融衍生品类 2:1。", "id": "科目一|第五章 基金活动的法规要求|84"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "私募基金募集流程（顺序）", "body": "特定对象确定 → 投资者适当性匹配 → 基金推介 → 风险揭示 → 合格投资者确认 → 签署基金合同 → 投资冷静期（不少于 24 小时）→ 回访确认 → 备案。", "id": "科目一|第五章 基金活动的法规要求|85"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "私募基金合格投资者标准", "body": "单位净资产不低于 1000 万元；个人金融资产不低于 300 万元或最近三年个人年均收入不低于 50 万元；投资于单只私募基金的金额不低于 100 万元。", "id": "科目一|第五章 基金活动的法规要求|86"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "私募基金投资者人数", "body": "有限责任公司型、合伙型企业型不超过 50 人；股份有限公司型、契约型不超过 200 人（同一管理人管理的多只基金合并计算投资者人数，另有规定除外）。", "id": "科目一|第五章 基金活动的法规要求|87"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "私募基金备案", "body": "管理人应自私募基金募集完毕之日起 20 个工作日内向中基协备案；协会自备案材料齐备之日起 20 个工作日内办结；募集完毕指投资者已签署基金合同且首期实缴资金已进入基金财产账户。", "id": "科目一|第五章 基金活动的法规要求|88"}, {"subject": "科目一", "chapter": "第五章 基金活动的法规要求", "weight": 3, "title": "反洗钱义务", "body": "客户身份识别（含受益所有人识别）、客户风险等级划分、大额交易与可疑交易报告、客户身份资料与交易记录至少保存 10 年（2025 年 1 月 1 日施行的《反洗钱法》）、保密义务、配合反洗钱调查。", "id": "科目一|第五章 基金活动的法规要求|89"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "合规管理概念", "body": "基金管理人及其员工的行为应符合法律法规、监管规定、自律规则、公司制度及职业道德；合规管理是全员、全流程、全覆盖的管理活动。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|90"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "合规管理基本原则", "body": "独立性、客观性、专业性、全面性、有效性（合规部门独立于业务部门，直接向董事会/管理层报告）。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|91"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "合规职责分工", "body": "董事会承担合规管理最终责任；监事会/审计委员会监督；合规负责人（督察长）组织实施；管理层与业务部门承担一线合规责任；合规管理部门独立开展合规审查、检查、培训与咨询。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|92"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "合规管理考核与保障", "body": "合规考核纳入绩效考核，合规部门及其人员考核不受业务部门干预；保障合规部门人员、经费与信息获取权。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|93"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "合规管理主要内容", "body": "合规审查、合规检查、合规监测、合规培训、合规咨询、合规报告、监管沟通与配合、违规事件处理。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|94"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "风险概念与目标", "body": "风险是未来结果的不确定性；风险管理目标是识别、计量、监测、控制风险，将风险控制在可承受范围内，实现风险与收益的平衡。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|95"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "风险管理原则", "body": "全面性、独立性、制衡性、适时性、成本效益。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|96"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "风险管理主要环节", "body": "风险识别 → 风险计量/评估 → 风险监测 → 风险报告 → 风险控制与处置（顺序题高频）。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|97"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "风险管理组织架构", "body": "董事会（最终责任）→ 风险管理委员会 → 风险管理部（独立）→ 业务部门（第一道防线）；内部审计为第三道防线。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|98"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "风险分类", "body": "市场风险、信用风险、流动性风险、操作风险、合规风险、声誉风险、战略风险；各类风险对应不同管理措施（如流动性风险用压力测试与流动性储备）。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|99"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "内控概念与三层次", "body": "内部控制是公司为实现经营目标、保护资产安全、保证信息真实而建立的控制机制；制度体系分公司章程层、基本制度层、业务操作流程层三个层次。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|100"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "内控目标", "body": "保证经营合法合规、保障基金财产与公司资产安全、保证信息披露真实完整、提高经营效率与效果。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|101"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "内控原则", "body": "健全性、有效性、独立性、相互制约、成本效益。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|102"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "内控五要素", "body": "控制环境、风险评估、控制活动、信息与沟通、内部监督（顺序与名称必背）。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|103"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 3, "title": "内控主要内容", "body": "投资管理控制、销售与客户服务控制、运营与估值控制、信息披露控制、信息技术控制、财务与人事控制。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|104"}, {"subject": "科目一", "chapter": "第六章 基金管理人的合规管理、风险管理和内部控制", "weight": 2, "title": "内控评价与审计", "body": "定期开展内部控制评价，内部审计部门独立审计并直接向董事会/审计委员会报告。", "id": "科目一|第六章 基金管理人的合规管理、风险管理和内部控制|105"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "道德与职业道德", "body": "道德依靠社会舆论、传统习惯和内心信念维系；职业道德是职业活动中应遵循的行为规范总和，具有职业性、规范性、约束性。", "id": "科目一|第七章 基金职业道德规范|106"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "基金职业道德含义与作用", "body": "基金从业人员在执业中应遵循的道德规范；作用是规范行为、维护投资者信心、促进行业健康发展、弥补法律约束的不足。", "id": "科目一|第七章 基金职业道德规范|107"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "基金职业道德建设内容", "body": "职业道德教育、制度建设、监督检查、奖惩机制、文化浸润。", "id": "科目一|第七章 基金职业道德规范|108"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "基金职业道德六项规范", "body": "守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。", "id": "科目一|第七章 基金职业道德规范|109"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "守法合规基本要求", "body": "知法懂法、依法执业、主动报告违法违规行为、配合监管检查。", "id": "科目一|第七章 基金职业道德规范|110"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "诚实守信基本要求", "body": "不得进行内幕交易和利用未公开信息交易；不得操纵市场；不得欺诈客户；不得不正当竞争。", "id": "科目一|第七章 基金职业道德规范|111"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "内幕交易与利用未公开信息交易", "body": "知悉内幕信息的人员不得买卖相关证券、不得泄露信息、不得建议他人交易；利用因职务便利获取的未公开信息交易同样禁止。", "id": "科目一|第七章 基金职业道德规范|112"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "操纵市场基本要求", "body": "不得单独或合谋集中资金/持股优势连续买卖、约定交易、自买自卖、虚假申报、蛊惑交易等影响证券价格或交易量。", "id": "科目一|第七章 基金职业道德规范|113"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "欺诈客户基本要求", "body": "不得虚假宣传、不得承诺收益、不得误导销售、不得挪用客户资产、不得违规代客理财、不得隐瞒风险。", "id": "科目一|第七章 基金职业道德规范|114"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "不正当竞争", "body": "不得诋毁同行、不得商业贿赂、不得以低于成本费率倾销、不得虚假排名；违反《反不正当竞争法》（2025 年修订）承担行政与民事责任。", "id": "科目一|第七章 基金职业道德规范|115"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "专业审慎基本要求", "body": "具备专业胜任能力、持续学习、审慎决策、勤勉尽责、不超出授权范围执业。", "id": "科目一|第七章 基金职业道德规范|116"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "客户至上基本要求", "body": "客户利益优先于机构和从业人员自身利益；公平对待所有客户；不得差别对待、不得利益输送。", "id": "科目一|第七章 基金职业道德规范|117"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "忠诚尽责基本要求", "body": "忠实于所在机构与客户，勤勉履职，不擅自离岗、不损害机构合法权益、不违规兼职。", "id": "科目一|第七章 基金职业道德规范|118"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 3, "title": "保守秘密基本要求", "body": "不得泄露客户信息、商业秘密、未公开信息；离职后仍负有保密义务；依法配合监管与司法调查时按程序提供。", "id": "科目一|第七章 基金职业道德规范|119"}, {"subject": "科目一", "chapter": "第七章 基金职业道德规范", "weight": 2, "title": "职业道德与法律的关系", "body": "法律是最低要求，道德要求高于法律；违反职业道德可能同时构成违法违规。", "id": "科目一|第七章 基金职业道德规范|120"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "文化与行业文化", "body": "文化是长期形成的共同价值观与行为方式；行业文化是行业共同遵循的价值理念、行为规范和形象标识。", "id": "科目一|第八章 基金行业文化建设|121"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 3, "title": "中国特色金融文化五条内涵", "body": "诚实守信、以义取利、稳健审慎、守正创新、依法合规（顺序与表述必背）。", "id": "科目一|第八章 基金行业文化建设|122"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "基金行业文化核心", "body": "合规、诚信、专业、稳健。", "id": "科目一|第八章 基金行业文化建设|123"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "基金行业文化建设意义", "body": "增强行业软实力、防范道德风险与经营风险、提升投资者信任、服务行业高质量发展。", "id": "科目一|第八章 基金行业文化建设|124"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "基金行业文化建设具体实践", "body": "党建引领、制度约束、文化宣导、典型示范、考核激励、投资者教育。", "id": "科目一|第八章 基金行业文化建设|125"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "中央八项规定", "body": "改进调查研究、精简会议活动、精简文件简报、规范出访活动、改进警卫工作、改进新闻报道、严格文稿发表、厉行勤俭节约（八个方面）。", "id": "科目一|第八章 基金行业文化建设|126"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 3, "title": "《中国共产党纪律处分条例》", "body": "纪律处分种类为警告、严重警告、撤销党内职务、留党察看、开除党籍五种；适用党员及党组织，坚持纪严于法、纪在法前。", "id": "科目一|第八章 基金行业文化建设|127"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "《中国共产党问责条例》", "body": "问责对象是党组织和党的领导干部；问责情形包括党的领导弱化、党的建设缺失、全面从严治党不力、维护党的纪律不力等；问责方式有检查、通报、改组、诫勉、组织调整或组织处理、纪律处分。", "id": "科目一|第八章 基金行业文化建设|128"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "诚信管理", "body": "证券基金期货行业建立诚信档案，记录失信行为；失信主体可能被采取限制业务、市场禁入等惩戒措施；失信信息共享与联合惩戒。", "id": "科目一|第八章 基金行业文化建设|129"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "社会信用体系建设", "body": "以信用为基础的新型监管机制，事前信用承诺、事中信用分级分类监管、事后失信惩戒。", "id": "科目一|第八章 基金行业文化建设|130"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 3, "title": "廉洁从业与作风建设结合", "body": "从业人员应落实中央八项规定精神，反对「四风」（形式主义、官僚主义、享乐主义、奢靡之风）。", "id": "科目一|第八章 基金行业文化建设|131"}, {"subject": "科目一", "chapter": "第八章 基金行业文化建设", "weight": 2, "title": "投资者教育与保护", "body": "普及基金知识、揭示投资风险、引导理性投资，是行业文化建设的重要内容。 ---", "id": "科目一|第八章 基金行业文化建设|132"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "股权投资基金概念", "body": "以非公开方式募集，主要投资于非上市企业股权，通过上市、并购、回购、清算等方式退出获利的私募基金。", "id": "科目三|第一章 股权投资基金概述|133"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "股权投资基金特点", "body": "非公开募集、投资期限长、流动性差、高风险高收益、专业管理、参与企业经营管理。", "id": "科目三|第一章 股权投资基金概述|134"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "基本运作流程", "body": "募集 → 设立 → 投资（项目开发、尽调、决策、交割）→ 投后管理 → 退出 → 清算分配。", "id": "科目三|第一章 股权投资基金概述|135"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "基金当事人", "body": "基金投资者（出资人）、基金管理人（受托管理）、基金托管人（保管监督）；三方权利义务由基金合同约定。", "id": "科目三|第一章 股权投资基金概述|136"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "市场服务机构", "body": "律师事务所、会计师事务所、估值机构、投资顾问、托管银行、份额登记机构等。", "id": "科目三|第一章 股权投资基金概述|137"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "监管体系", "body": "中国证监会及其派出机构依法监管；中基协实施登记备案与自律管理；发改委、央行、外汇局等在职责范围内监管。", "id": "科目三|第一章 股权投资基金概述|138"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "监管目标与原则", "body": "保护投资者合法权益、防范系统性风险、促进股权投资基金行业规范发展；坚持适度监管、底线监管、分类监管。", "id": "科目三|第一章 股权投资基金概述|139"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "行业自律", "body": "中基协通过登记备案、自律规则、检查、纪律处分、培训等方式实施自律管理。", "id": "科目三|第一章 股权投资基金概述|140"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "起源", "body": "1946 年美国研究与发展公司（ARD）被视为现代创业投资/股权投资的鼻祖；20 世纪 70—80 年代美国有限合伙制兴起。", "id": "科目三|第一章 股权投资基金概述|141"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "我国发展历程", "body": "1985 年中国新技术创业投资公司成立；2004 年后外资 PE 进入；2014 年登记备案制实施；2018 年资管新规后规范发展。", "id": "科目三|第一章 股权投资基金概述|142"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "我国发展现状与趋势", "body": "管理规模居全球前列、以人民币基金为主、创投与政府引导基金占比提升、退出渠道多元化。", "id": "科目三|第一章 股权投资基金概述|143"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 3, "title": "对经济高质量发展的作用", "body": "支持科技创新与「专精特新」、促进直接融资、推动产业升级与并购重组、增加就业与税收。", "id": "科目三|第一章 股权投资基金概述|144"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "股权投资基金与私募证券基金区别", "body": "投资标的（未上市股权 vs 公开交易证券）、流动性、估值方式、退出方式、投资周期不同。", "id": "科目三|第一章 股权投资基金概述|145"}, {"subject": "科目三", "chapter": "第一章 股权投资基金概述", "weight": 2, "title": "股权投资基金与创业投资基金区别", "body": "创投基金主要投资早期、成长期未上市企业，股权基金覆盖更广（含并购、夹层等）。", "id": "科目三|第一章 股权投资基金概述|146"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "管理人概念", "body": "依法设立、向中基协登记、受托管理股权投资基金的专业机构。", "id": "科目三|第二章 股权投资基金管理人|147"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "基本经营要求", "body": "实缴货币资本不低于 1000 万元；有固定经营场所；有满足业务需要的人员；建立完善的内控制度与风控制度。", "id": "科目三|第二章 股权投资基金管理人|148"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "股东、合伙人、实际控制人合规要求", "body": "不得有重大违法违规记录、不得代持、股权结构清晰稳定；实际控制人变更须及时履行变更登记。", "id": "科目三|第二章 股权投资基金管理人|149"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "从业人员合规要求", "body": "高管及从业人员应具备基金从业资格；合规风控负责人应具备 3 年以上相关经验；不得在冲突机构兼职。", "id": "科目三|第二章 股权投资基金管理人|150"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "管理人职责", "body": "募集基金、办理备案、投资管理、投后管理、退出安排、信息披露与报送、基金财产独立核算、保存业务记录。", "id": "科目三|第二章 股权投资基金管理人|151"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "信义义务", "body": "忠实义务（不得利益冲突、不得自我交易、不得挪用基金财产）+ 勤勉义务（专业审慎、尽职调查、持续监督）。", "id": "科目三|第二章 股权投资基金管理人|152"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "信义义务核心要求", "body": "投资者利益优先、公平对待所有投资者、信息披露真实完整、不得利用基金财产为关联方谋利。", "id": "科目三|第二章 股权投资基金管理人|153"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "专业要求", "body": "具备投资研究、行业分析、估值定价、交易结构设计、投后管理、退出运作等专业能力。", "id": "科目三|第二章 股权投资基金管理人|154"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "专业化制度保障", "body": "人员培训、投研体系、决策流程、风控合规、激励约束机制。", "id": "科目三|第二章 股权投资基金管理人|155"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "内部治理概念与原则", "body": "通过股东会、董事会、监事会/执行监事、管理层等机构设置形成决策、执行、监督制衡；原则包括权责清晰、有效制衡、独立监督。", "id": "科目三|第二章 股权投资基金管理人|156"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 3, "title": "治理结构常见形式", "body": "公司制（股东会—董事会—经理层—监事）、合伙制（合伙人会议—执行事务合伙人—投资决策委员会）。", "id": "科目三|第二章 股权投资基金管理人|157"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "决策机制", "body": "投资决策委员会集体决策、分级授权、回避制度、投决会与风控合规联动。", "id": "科目三|第二章 股权投资基金管理人|158"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "激励机制", "body": "管理费 + 业绩报酬（Carry）、员工持股/跟投、递延支付与追索扣回。", "id": "科目三|第二章 股权投资基金管理人|159"}, {"subject": "科目三", "chapter": "第二章 股权投资基金管理人", "weight": 2, "title": "监督机制", "body": "监事会/执行监事、合规风控负责人、内部审计、托管人监督、自律与行政监管。", "id": "科目三|第二章 股权投资基金管理人|160"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "基金产品基本要素", "body": "基金名称、组织形式、募集规模、存续期限、投资范围、管理费与业绩报酬、收益分配、退出方式。", "id": "科目三|第三章 股权投资基金产品|161"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "按组织形式分类", "body": "公司型、合伙型（有限合伙）、契约型；三者在法律主体、税收、治理、投资者人数上限方面不同。", "id": "科目三|第三章 股权投资基金产品|162"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "公司型基金特点", "body": "依据《公司法》设立，具有法人资格，投资者为股东，设股东会/董事会/监事会；公司层面缴纳企业所得税，存在双重征税问题（符合条件的创投企业可适用穿透政策）。", "id": "科目三|第三章 股权投资基金产品|163"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "合伙型基金特点", "body": "依据《合伙企业法》设立，普通合伙人（GP）执行合伙事务并承担无限连带责任，有限合伙人（LP）以出资额为限承担责任、不执行合伙事务；投资者人数不超过 50 人；合伙企业层面不缴企业所得税，由合伙人分别纳税。", "id": "科目三|第三章 股权投资基金产品|164"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "契约型基金特点", "body": "依据基金合同设立，不具有法人资格，由管理人代为持有股权/行使股东权利；投资者人数不超过 200 人；设立便捷但治理与登记安排依赖合同。", "id": "科目三|第三章 股权投资基金产品|165"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "按投资阶段分类", "body": "天使投资、创业投资（VC）、成长型投资（PE）、并购投资（Buyout）、夹层投资、Pre-IPO 投资。", "id": "科目三|第三章 股权投资基金产品|166"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "按投资方式分类", "body": "股权投资、股债结合（可转债、可交换债、优先股）、并购重组。", "id": "科目三|第三章 股权投资基金产品|167"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "创业投资基金运作特点", "body": "投资早期/成长期企业、单笔金额较小、项目数量较多、投后介入深、依赖 IPO/并购退出。", "id": "科目三|第三章 股权投资基金产品|168"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "创投基金鼓励政策", "body": "符合条件的创投企业投资于未上市中小高新技术企业/初创科技型企业满 2 年的，可按投资额的 70% 抵扣应纳税所得额（财税〔2018〕55 号等）。", "id": "科目三|第三章 股权投资基金产品|169"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "并购基金运作特点", "body": "取得目标企业控制权、常使用杠杆、改善经营后出售或上市退出、单笔规模大。", "id": "科目三|第三章 股权投资基金产品|170"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "股权投资母基金（FOF）", "body": "投资于其他股权投资基金的基金；业务包括一级投资、二级投资、直接投资；具有分散风险、专业筛选、降低门槛的作用。", "id": "科目三|第三章 股权投资基金产品|171"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "母基金的成本与收益", "body": "存在双重管理费与双重业绩报酬，收益被摊薄；优势是分散风险与获取优质基金份额。", "id": "科目三|第三章 股权投资基金产品|172"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 3, "title": "S 基金", "body": "从事私募股权基金二手份额交易的基金；价值在于提供流动性、缩短投资周期、折价获取优质资产；交易模式包括 LP 份额转让、接续基金、复杂重组。", "id": "科目三|第三章 股权投资基金产品|173"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "政府投资基金", "body": "由各级政府通过预算安排出资设立，按市场化方式运作，支持创新创业、产业升级、基础设施等政策目标；坚持政府引导、市场化运作、专业化管理。", "id": "科目三|第三章 股权投资基金产品|174"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "政府投资基金运作原则", "body": "不与市场争利、让利于社会资本、防范地方政府隐性债务、强化绩效管理。", "id": "科目三|第三章 股权投资基金产品|175"}, {"subject": "科目三", "chapter": "第三章 股权投资基金产品", "weight": 2, "title": "基金特殊主体分类与备案分类", "body": "按备案类型分为私募证券基金、私募股权基金、创业投资基金、私募资产配置基金等（以 AMBERS 系统分类为准）。", "id": "科目三|第三章 股权投资基金产品|176"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "募集与设立的关系", "body": "先募集（向合格投资者非公开募集资金）后设立（工商登记/基金合同设立），再办理备案。", "id": "科目三|第四章 股权投资基金的募集与设立|177"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "合格投资者标准", "body": "单位净资产不低于 1000 万元；个人金融资产不低于 300 万元或最近三年年均收入不低于 50 万元；单只基金投资额不低于 100 万元。", "id": "科目三|第四章 股权投资基金的募集与设立|178"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "投资者人数限制", "body": "合伙型、有限责任公司型不超过 50 人；契约型、股份有限公司型不超过 200 人；不得通过拆分、代持等方式规避。", "id": "科目三|第四章 股权投资基金的募集与设立|179"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "专业投资者与普通投资者", "body": "专业投资者包括持牌金融机构、符合条件的法人/合伙企业、高净值个人等；普通投资者享有更强保护（适当性、风险揭示、冷静期）。", "id": "科目三|第四章 股权投资基金的募集与设立|180"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "募集流程（顺序）", "body": "特定对象确定 → 投资者适当性匹配 → 基金推介 → 风险揭示 → 合格投资者确认 → 签署基金合同 → 冷静期（不少于 24 小时）→ 回访确认 → 备案。", "id": "科目三|第四章 股权投资基金的募集与设立|181"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "募集方式合规要求", "body": "不得公开宣传（不得通过报刊、电台、电视、互联网、讲座、报告会、短信、微信等方式向不特定对象宣传）；不得向不特定对象推介。", "id": "科目三|第四章 股权投资基金的募集与设立|182"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "募集资料合规要求", "body": "招募说明书/推介材料应真实、准确、完整，载明投资范围、风险揭示、费用、退出安排；风险揭示书应由投资者签字确认。", "id": "科目三|第四章 股权投资基金的募集与设立|183"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "基金合同必备条款", "body": "当事人权利义务、基金规模与存续期、出资方式与进度、投资范围与限制、管理费与业绩报酬、收益分配、退出方式、信息披露、违约责任、争议解决。", "id": "科目三|第四章 股权投资基金的募集与设立|184"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "设立主要要求", "body": "公司型办理工商登记并取得营业执照；合伙型办理合伙企业登记；契约型无需工商登记，以基金合同设立。", "id": "科目三|第四章 股权投资基金的募集与设立|185"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "备案要求", "body": "募集完毕后 20 个工作日内向中基协备案；备案材料包括基金合同、投资者明细、托管协议/托管说明、风险揭示书等。", "id": "科目三|第四章 股权投资基金的募集与设立|186"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "备案合规要点", "body": "募集完毕（投资者已签署合同且首期实缴到账）、投资者人数与合格投资者合规、募集方式合规、投资范围合规、托管安排合规。", "id": "科目三|第四章 股权投资基金的募集与设立|187"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 3, "title": "基金初始实缴规模", "body": "私募股权基金设立时初始实缴规模不低于 1000 万元；创业投资基金备案阶段可按首期实缴 500 万元先行备案，并在 6 个月内补足至 1000 万元。", "id": "科目三|第四章 股权投资基金的募集与设立|188"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "基金费用条款", "body": "管理费（按认缴/实缴/资产净值计提）、业绩报酬（常见 20% 超额分成）、托管费、中介费用、基金运营费用。", "id": "科目三|第四章 股权投资基金的募集与设立|189"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "投资事项条款", "body": "投资范围、投资限制（单项目比例、行业限制、关联交易）、投资决策程序、投后管理安排。", "id": "科目三|第四章 股权投资基金的募集与设立|190"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "内部组织机构条款", "body": "合伙人会议/股东会、投资决策委员会、咨询委员会（LPAC）、管理人职责边界。", "id": "科目三|第四章 股权投资基金的募集与设立|191"}, {"subject": "科目三", "chapter": "第四章 股权投资基金的募集与设立", "weight": 2, "title": "不同组织形式的合同差异", "body": "公司型为章程 + 股东协议；合伙型为合伙协议；契约型为基金合同。", "id": "科目三|第四章 股权投资基金的募集与设立|192"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "投资一般流程", "body": "项目开发与筛选 → 初步评估/立项 → 尽职调查 → 投资决策 → 签署交易文件 → 交割 → 投后管理。", "id": "科目三|第五章 股权投资基金的投资|193"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "尽职调查概念与作用", "body": "对目标企业的业务、财务、法律等进行全面核查，识别风险、验证投资假设、为估值与交易条款提供依据。", "id": "科目三|第五章 股权投资基金的投资|194"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "尽职调查主要内容", "body": "业务尽调（商业模式、市场、竞争、客户、团队）、财务尽调（收入质量、成本、负债、现金流、税务）、法律尽调（股权结构、资产权属、诉讼、合规、知识产权）。", "id": "科目三|第五章 股权投资基金的投资|195"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "尽职调查方法", "body": "查阅资料、访谈管理层与客户/供应商、现场考察、第三方机构核查、行业研究、财务分析。", "id": "科目三|第五章 股权投资基金的投资|196"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "企业价值与股权价值", "body": "企业价值（EV）= 股权价值 + 净负债；股权价值是股东权益价值，估值时须区分二者并注意流动性折价/控制权溢价。", "id": "科目三|第五章 股权投资基金的投资|197"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "参考最近融资价格法", "body": "以目标企业最近一轮融资的每股价格/估值作为参考，适用于近期有外部融资的企业，需考虑时间间隔与条件差异调整。", "id": "科目三|第五章 股权投资基金的投资|198"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "市场乘数法", "body": "选取可比公司/可比交易，计算市盈率（P/E）、市销率（P/S）、EV/EBITDA 等乘数，乘以目标企业对应指标得出估值。", "id": "科目三|第五章 股权投资基金的投资|199"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "现金流折现法（DCF）", "body": "预测未来自由现金流并按加权平均资本成本（WACC）折现；关键参数包括预测期、永续增长率、折现率、税率、资本结构。", "id": "科目三|第五章 股权投资基金的投资|200"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "成本法", "body": "以资产负债表净资产为基础调整，适用于资产重、收益不稳定或早期企业；难以反映未来盈利能力。", "id": "科目三|第五章 股权投资基金的投资|201"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "风险资本估值法", "body": "适用于早期企业，先预测退出时估值，再按目标收益率与风险调整折现回当前，反推可投资金额与持股比例。", "id": "科目三|第五章 股权投资基金的投资|202"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "估值方法选用", "body": "成熟稳定企业多用市场乘数法与 DCF；早期企业多用风险资本法/最近融资价格法；重资产企业可参考成本法；基金类型与投资阶段影响方法选择。", "id": "科目三|第五章 股权投资基金的投资|203"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "交易文件", "body": "增资协议（认购新增注册资本）、股权转让协议、股东协议（约定特殊权利）。", "id": "科目三|第五章 股权投资基金的投资|204"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 3, "title": "股东协议优先权条款", "body": "优先认购权（增资时按比例优先认购）、优先购买权（老股东转让时优先受让）、优先分红权、优先清算权。", "id": "科目三|第五章 股权投资基金的投资|205"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "其他经济权益条款", "body": "反稀释条款（完全棘轮/加权平均）、对赌/估值调整机制、最惠国待遇、共同出售权（随售权）。", "id": "科目三|第五章 股权投资基金的投资|206"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "公司治理条款", "body": "董事/观察员席位、一票否决权、信息权、知情权、竞业禁止、关键人条款。", "id": "科目三|第五章 股权投资基金的投资|207"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "投资方退出条款", "body": "回购权（触发条件、回购价格、回购主体）、领售权/拖售权、优先清算、IPO 承诺。", "id": "科目三|第五章 股权投资基金的投资|208"}, {"subject": "科目三", "chapter": "第五章 股权投资基金的投资", "weight": 2, "title": "交易结构", "body": "一般股权交易结构（直接持股、SPV 持股、多层架构）；离岸结构（开曼/BVI 等，用于境外上市）；股债结合（可转债、可交换债、优先股、夹层）。", "id": "科目三|第五章 股权投资基金的投资|209"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "投后管理概念与覆盖期间", "body": "从投资交割后到项目退出前的持续管理，覆盖期间通常与基金存续期匹配。", "id": "科目三|第六章 股权投资基金的投后管理|210"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 3, "title": "投后管理主要工作内容", "body": "监督经营与财务、参与公司治理、提供增值服务、监控风险、协助后续融资与退出。", "id": "科目三|第六章 股权投资基金的投后管理|211"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "投后管理的作用", "body": "提升项目价值、降低投资风险、保障退出、维护基金与投资者利益。", "id": "科目三|第六章 股权投资基金的投后管理|212"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "投后管理模式", "body": "投前投后一体化（投资经理负责制）、专业化投后团队、混合模式；人员需求包括行业背景、财务、法律、运营人才。", "id": "科目三|第六章 股权投资基金的投后管理|213"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 3, "title": "投后管理决策机制", "body": "投后事项分级决策，重大事项（追加投资、退出、重大诉讼）提交投决会；日常事项由投后团队/投资经理处理。", "id": "科目三|第六章 股权投资基金的投后管理|214"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "参与投后管理的部门", "body": "投资部、投后管理部、风控合规部、财务部、法务部。", "id": "科目三|第六章 股权投资基金的投后管理|215"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "投后管理制度与考核", "body": "定期报告制度、走访制度、风险预警制度、投后考核与激励。", "id": "科目三|第六章 股权投资基金的投后管理|216"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 3, "title": "投后管理主要风险点", "body": "信息不对称、管理层道德风险、经营恶化、资金挪用、关联交易、退出受阻。", "id": "科目三|第六章 股权投资基金的投后管理|217"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "不同基金产品的投后策略", "body": "创投基金侧重资源对接与后续融资；并购基金侧重整合与运营改善；母基金侧重子基金监督。", "id": "科目三|第六章 股权投资基金的投后管理|218"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "项目分类管理", "body": "按经营状况与风险程度分正常、关注、预警、危机类，差异化配置管理资源。", "id": "科目三|第六章 股权投资基金的投后管理|219"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 3, "title": "获取信息的主要方式", "body": "定期财务报表、董事会/股东会资料、现场走访、管理层访谈、第三方数据、银行流水与合同核查。", "id": "科目三|第六章 股权投资基金的投后管理|220"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "获取信息的主要内容", "body": "财务指标、经营数据、重大合同、诉讼、股权变动、核心人员变动、行业政策变化。", "id": "科目三|第六章 股权投资基金的投后管理|221"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "项目风险监测运行机制", "body": "风险指标设定、定期评估、预警触发、处置预案、上报路径。", "id": "科目三|第六章 股权投资基金的投后管理|222"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 3, "title": "增值服务主要内容", "body": "战略规划、人才引进、市场资源对接、后续融资、并购整合、规范治理、上市辅导。", "id": "科目三|第六章 股权投资基金的投后管理|223"}, {"subject": "科目三", "chapter": "第六章 股权投资基金的投后管理", "weight": 2, "title": "并购项目投后管理特点", "body": "取得控制权、深度整合（业务、人员、财务、文化）、协同效应实现、退出路径设计。", "id": "科目三|第六章 股权投资基金的投后管理|224"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 3, "title": "退出方式分类", "body": "上市转让退出（IPO）、挂牌转让退出（新三板等）、协议转让退出（第三方转让、回购）、清算退出。", "id": "科目三|第七章 股权投资基金的项目退出|225"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 3, "title": "不同退出方式区别", "body": "IPO 收益高但周期长、门槛高；回购确定性较强但依赖回购方履约能力；第三方转让灵活但折价；清算为失败退出、回收率低。", "id": "科目三|第七章 股权投资基金的项目退出|226"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "境内上市市场", "body": "上海证券交易所主板/科创板、深圳证券交易所主板/创业板、北京证券交易所；不同板块定位、上市条件与审核程序不同。", "id": "科目三|第七章 股权投资基金的项目退出|227"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "境内上市要点", "body": "股份制改造、规范治理、财务规范、信息披露、辅导验收、注册审核、发行承销。", "id": "科目三|第七章 股权投资基金的项目退出|228"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "境外上市要点", "body": "常见目的地为香港、美国；涉及外汇登记（37 号文）、红筹/VIE 架构、境外监管与信息披露。", "id": "科目三|第七章 股权投资基金的项目退出|229"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "上市后股份转让退出的交易机制与合规要求", "body": "锁定期（控股股东/实际控制人通常 36 个月，其他股东 12 个月，具体以板块规则为准，待核）、减持规则、信息披露义务。", "id": "科目三|第七章 股权投资基金的项目退出|230"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "挂牌转让退出", "body": "全国中小企业股份转让系统（新三板）挂牌，基础层/创新层/北交所递进；挂牌后可协议转让、做市交易、定向发行。", "id": "科目三|第七章 股权投资基金的项目退出|231"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "新三板挂牌基本要求与流程", "body": "依法设立存续满两年、业务明确、治理健全、股权清晰、主办券商推荐、全国股转公司审查。", "id": "科目三|第七章 股权投资基金的项目退出|232"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "第三方转让退出", "body": "向其他投资者/产业方转让股权，流程包括寻找受让方、尽调、定价、签署协议、工商变更。", "id": "科目三|第七章 股权投资基金的项目退出|233"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 3, "title": "回购退出", "body": "由创始股东/公司按约定价格回购投资方股权；触发条件包括业绩未达标、IPO 未如期、重大违约；需关注回购能力与《公司法》减资程序限制。", "id": "科目三|第七章 股权投资基金的项目退出|234"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "企业清算类型", "body": "解散清算（营业期限届满、股东会决议、合并分立等）与破产清算（资不抵债）。", "id": "科目三|第七章 股权投资基金的项目退出|235"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 3, "title": "清算退出流程", "body": "成立清算组 → 通知/公告债权人 → 清理财产、编制资产负债表 → 处理未了业务 → 清缴税款 → 清偿债务 → 分配剩余财产 → 注销登记。", "id": "科目三|第七章 股权投资基金的项目退出|236"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "清算顺序", "body": "清算费用 → 职工工资/社保/法定补偿 → 税款 → 普通债务 → 股东按比例分配剩余财产。", "id": "科目三|第七章 股权投资基金的项目退出|237"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "退出时点与基金存续期的匹配", "body": "基金存续期通常 5—10 年（含投资期与退出期），退出安排需与 LP 流动性需求匹配。", "id": "科目三|第七章 股权投资基金的项目退出|238"}, {"subject": "科目三", "chapter": "第七章 股权投资基金的项目退出", "weight": 2, "title": "S 基金作为退出补充渠道", "body": "为 LP 提供提前退出机会，也为 GP 提供接续基金方案。", "id": "科目三|第七章 股权投资基金的项目退出|239"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "基金治理概念", "body": "通过一系列制度安排协调投资者、管理人、托管人及其他利益相关者关系，保障基金规范运作与投资者利益。", "id": "科目三|第八章 股权投资基金治理|240"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "基金治理体系", "body": "法律与监管、自律规则、基金合同、内部治理结构、市场约束与声誉机制。", "id": "科目三|第八章 股权投资基金治理|241"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 3, "title": "利益一致原则", "body": "管理人与投资者利益绑定，通过业绩报酬、跟投、递延支付等机制实现；防止管理人追求规模而损害收益。", "id": "科目三|第八章 股权投资基金治理|242"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 3, "title": "公平对待投资者原则", "body": "同一基金内不同投资者按份额公平分配收益与费用；不同基金之间不得进行利益输送、不得优先照顾关联方。", "id": "科目三|第八章 股权投资基金治理|243"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 3, "title": "专业审慎原则", "body": "管理人应具备专业能力，勤勉尽责，审慎投资决策，持续履行受托职责。", "id": "科目三|第八章 股权投资基金治理|244"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 3, "title": "信息透明原则", "body": "向投资者真实、准确、完整、及时披露基金运作、投资组合、费用、关联交易、风险等信息。", "id": "科目三|第八章 股权投资基金治理|245"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "利益相关者参与原则", "body": "投资者通过持有人/合伙人会议、咨询委员会参与重大事项决策与监督。", "id": "科目三|第八章 股权投资基金治理|246"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "基金内部治理概念", "body": "基金层面的决策、执行、监督机制安排。", "id": "科目三|第八章 股权投资基金治理|247"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "不同组织类型的内部治理差异", "body": "公司型设股东会/董事会/监事会；合伙型设合伙人会议/咨询委员会/执行事务合伙人；契约型依托基金合同与份额持有人大会。", "id": "科目三|第八章 股权投资基金治理|248"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "内部治理决策机制", "body": "重大事项（修改合同、延长存续期、关联交易、清算）需投资者会议表决，通常需经一定比例（如 2/3 以上）通过（具体比例以合同约定为准）。", "id": "科目三|第八章 股权投资基金治理|249"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "激励机制", "body": "管理费、业绩报酬、跟投、员工持股、递延与追索扣回。", "id": "科目三|第八章 股权投资基金治理|250"}, {"subject": "科目三", "chapter": "第八章 股权投资基金治理", "weight": 2, "title": "约束机制", "body": "投资限制、关联交易审批、托管监督、信息披露、审计、自律检查。", "id": "科目三|第八章 股权投资基金治理|251"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "权益登记", "body": "不同组织形式基金的设立登记（工商登记/基金合同设立）、变更登记（增资、减资、份额转让、管理人变更）、清算登记（注销）。", "id": "科目三|第九章 股权投资基金的运营管理|252"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "基金托管含义与作用", "body": "托管人保管基金财产、监督投资运作、复核资产净值，保障基金财产安全与投资者利益。", "id": "科目三|第九章 股权投资基金的运营管理|253"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "我国股权投资基金托管要求", "body": "原则上应托管；基金合同约定不托管的，应明确保障基金财产安全的制度安排与纠纷解决机制（契约型基金强制托管要求待核）。", "id": "科目三|第九章 股权投资基金的运营管理|254"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "托管人主要职责", "body": "安全保管、账户管理、资金划付、资产估值复核、投资监督、出具托管报告、配合信息披露。", "id": "科目三|第九章 股权投资基金的运营管理|255"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "托管报告主要内容", "body": "基金资产状况、投资运作合规性、托管人履职情况、重大事项说明。", "id": "科目三|第九章 股权投资基金的运营管理|256"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "基金账户体系", "body": "募集账户、托管账户、基本户、证券账户等；资金闭环管理、专户专用。", "id": "科目三|第九章 股权投资基金的运营管理|257"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "估值原则", "body": "公允价值计量、一致性、及时性、独立性；投资标的应按公允价值估值，无法可靠取得时按监管/自律规则处理。", "id": "科目三|第九章 股权投资基金的运营管理|258"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "估值方法", "body": "最近融资价格法、市场乘数法、行业指标法、现金流折现法、成本法、风险资本法。", "id": "科目三|第九章 股权投资基金的运营管理|259"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "内部收益率（IRR）", "body": "使基金/项目现金流入现值等于现金流出现值的折现率，反映投资的实际年化收益率；计算需考虑现金流时点。", "id": "科目三|第九章 股权投资基金的运营管理|260"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "已分配倍数（DPI）", "body": "已分配给投资者的金额 ÷ 投资者已实缴出资额，反映现金回报能力。", "id": "科目三|第九章 股权投资基金的运营管理|261"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "剩余价值倍数（RVPI）", "body": "基金未实现价值（净资产）÷ 已实缴出资额；总收益倍数（TVPI）= DPI + RVPI。", "id": "科目三|第九章 股权投资基金的运营管理|262"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "基金财务报告", "body": "资产负债表、利润表、现金流量表、所有者权益变动表及附注；核心原则是真实、完整、公允。", "id": "科目三|第九章 股权投资基金的运营管理|263"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "税种与纳税主体", "body": "增值税（管理费、业绩报酬、金融商品转让）、企业所得税（公司型基金/管理人）、个人所得税（合伙型自然人合伙人、契约型投资者）；纳税主体因组织形式而异。", "id": "科目三|第九章 股权投资基金的运营管理|264"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "创投税收优惠", "body": "公司制/合伙制创投企业投资于未上市中小高新技术企业或初创科技型企业满 2 年，可按投资额的 70% 抵扣应纳税所得额；个人合伙人可按 70% 抵扣分得的经营所得。", "id": "科目三|第九章 股权投资基金的运营管理|265"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "收益分配方式", "body": "瀑布式分配（返还全部出资 → 支付门槛收益/优先回报 → 向 GP 追补 → 剩余部分按约定比例（常见 80/20）分配）；按项目分配 vs 按基金整体分配。", "id": "科目三|第九章 股权投资基金的运营管理|266"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "资本账户与账面分摊", "body": "资本账户记录各合伙人出资、分配、损益份额；收入、费用、亏损按约定比例（通常按出资比例）分摊。", "id": "科目三|第九章 股权投资基金的运营管理|267"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 3, "title": "基金清算程序", "body": "决定清算 → 成立清算组 → 通知公告债权人 → 清理财产与债权债务 → 编制清算报告 → 分配剩余财产 → 注销登记与备案。", "id": "科目三|第九章 股权投资基金的运营管理|268"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "投资者退出与基金退出比较", "body": "投资者退出是 LP 层面份额转让/赎回；基金退出是基金层面项目变现并分配。", "id": "科目三|第九章 股权投资基金的运营管理|269"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "信息披露与报送", "body": "向投资者披露基金净值、投资组合、重大事项；向中基协报送季度/年度信息（2026 年新规《私募投资基金信息披露监督管理办法》及实施细则的具体时限待核）。", "id": "科目三|第九章 股权投资基金的运营管理|270"}, {"subject": "科目三", "chapter": "第九章 股权投资基金的运营管理", "weight": 2, "title": "争议解决方式", "body": "协商、调解、仲裁、诉讼；基金合同应约定争议解决方式与管辖/仲裁机构。 ---", "id": "科目三|第九章 股权投资基金的运营管理|271"}];
const KEY = 'fundPointsDone_v1';
const done = JSON.parse(localStorage.getItem(KEY) || '{}');
const state = { subject: '科目一', chapter: 'all', q: '' };
const $ = id => document.getElementById(id);

function chaptersOf(s) {
  return [...new Set(POINTS.filter(p => p.subject === s).map(p => p.chapter))];
}
function filtered() {
  const q = state.q.trim();
  return POINTS.filter(p => p.subject === state.subject
    && (state.chapter === 'all' || p.chapter === state.chapter)
    && (!q || p.title.includes(q) || p.body.includes(q) || p.chapter.includes(q)));
}
function renderChips() {
  const chs = chaptersOf(state.subject);
  $('chips').innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip' + (state.chapter === 'all' ? ' on' : '');
  all.textContent = '全部章节';
  all.onclick = () => { state.chapter = 'all'; render(); };
  $('chips').appendChild(all);
  chs.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.chapter === ch ? ' on' : '');
    b.textContent = ch;
    b.onclick = () => { state.chapter = ch; render(); };
    $('chips').appendChild(b);
  });
}
function stars(n) { return '★'.repeat(n); }
function render() {
  renderChips();
  const list = filtered();
  const box = $('list');
  box.innerHTML = '';
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '没有匹配的考点，换个关键词试试';
    box.appendChild(d);
  }
  list.forEach((p, i) => {
    const card = document.createElement('article');
    card.className = 'card' + (done[p.id] ? ' done' : '');
    card.dataset.id = p.id;

    const top = document.createElement('div');
    top.className = 'card-top';
    const idx = document.createElement('span');
    idx.className = 'idx'; idx.textContent = String(i + 1).padStart(2, '0');
    const st = document.createElement('span');
    st.className = 'stars s' + p.weight; st.textContent = stars(p.weight);
    const ti = document.createElement('span');
    ti.className = 'title'; ti.textContent = p.title;
    top.append(idx, st, ti);

    const body = document.createElement('p');
    body.className = 'body'; body.textContent = p.body;

    body.addEventListener('click', () => toggleOpen(card));
    let more = null;
    if (p.body.length > 78) {
      more = document.createElement('div');
      more.className = 'more'; more.textContent = '展开全文';
      more.addEventListener('click', () => toggleOpen(card));
    }

    const act = document.createElement('div');
    act.className = 'card-act';
    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = p.chapter;
    const btn = document.createElement('button');
    btn.className = 'btn-done';
    btn.textContent = done[p.id] ? '已掌握 ✓' : '标记已掌握';
    btn.addEventListener('click', () => {
      if (done[p.id]) delete done[p.id]; else done[p.id] = 1;
      localStorage.setItem(KEY, JSON.stringify(done));
      render();
    });
    act.append(tag, btn);

    card.append(top, body);
    if (more) card.appendChild(more);
    card.appendChild(act);
    box.appendChild(card);
  });
  updateStats();
}
function toggleOpen(card) {
  card.classList.toggle('open');
  const more = card.querySelector('.more');
  if (more) more.textContent = card.classList.contains('open') ? '收起' : '展开全文';
}
function updateStats() {
  const list = filtered();
  const cur = POINTS.filter(p => p.subject === state.subject);
  const total = cur.length;
  const dn = cur.filter(p => done[p.id]).length;
  const curDone = list.filter(p => done[p.id]).length;
  $('curN').textContent = list.length;
  $('curDone').textContent = curDone;
  $('totalN').textContent = total;
  $('doneN').textContent = dn;
  const pct = total ? Math.round(dn / total * 100) : 0;
  $('pct').textContent = pct + '%';
  $('bar').style.width = pct + '%';
}
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  state.subject = b.dataset.s;
  state.chapter = 'all';
  render();
}));
$('reset').addEventListener('click', () => {
  if (!confirm('确定清空所有「已掌握」标记吗？')) return;
  Object.keys(done).forEach(k => delete done[k]);
  localStorage.setItem(KEY, JSON.stringify(done));
  render();
});
render();
</script>
